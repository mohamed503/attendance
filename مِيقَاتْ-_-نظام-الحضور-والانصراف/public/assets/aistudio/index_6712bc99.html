<meta property="og:title" content="مِيقَاتْ | نظام الحضور والانصراف">
<meta property="og:description" content="نظام متكامل لإدارة الحضور والانصراف والورديات والإجازات ومسير الرواتب الآلي عبر إحداثيات GPS.">

<style>
:root{
  --bg:#eaf2fb;--card:#fff;--ink:#12263f;--mute:#6580a0;--line:#d9e6f5;
  --pri:#1b7ee6;--pri-d:#0f5fc0;--pri-l:#e3f0ff;--navy:#0b3c7d;
  --ok:#12a371;--bad:#e04545;--warn:#e69a00;
  --grad:linear-gradient(135deg,#0d4fa8 0%,#1b7ee6 55%,#43b0f5 100%);
  --sh:0 8px 24px rgba(20,90,170,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit}
.ic{flex:none;vertical-align:middle}

/* ---------- الهيدر ---------- */
.top{background:var(--grad);color:#fff;padding:18px 16px 56px;border-radius:0 0 30px 30px;position:relative;overflow:hidden}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.09)}
.top::before{width:240px;height:240px;top:-110px;left:-60px}
.top::after{width:170px;height:170px;bottom:-90px;right:22%}
.top-in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:12px}
.brand b{display:block;font-size:23px;font-weight:800;line-height:1.35}
.brand small{opacity:.8;font-size:12.5px}
.logo{width:46px;height:46px;border-radius:14px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);display:grid;place-items:center;backdrop-filter:blur(4px);color:#fff}
.logo.big{width:74px;height:74px;border-radius:22px;background:var(--grad);border:0;box-shadow:0 10px 26px rgba(27,126,230,.4);margin:0 auto 12px}
.top-act{display:flex;gap:8px;align-items:center}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.15);color:#fff;display:grid;place-items:center;cursor:pointer}
.ib:hover{background:rgba(255,255,255,.28)}

.wrap{max-width:1100px;margin:0 auto;padding:0 16px 24px}

/* ---------- التبويبات ---------- */
.tabs{display:flex;gap:6px;background:#fff;padding:8px;border-radius:18px;box-shadow:var(--sh);margin:-34px 0 16px;position:relative;z-index:2;overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;border:0;background:transparent;color:var(--mute);font-weight:700;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--pri-l);color:var(--pri-d)}
.tab.on{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(27,126,230,.35)}

/* ---------- البطاقات ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
h1,h2,h3{margin:0 0 12px}
h1{font-size:22px}h2{font-size:18px}h3{font-size:16.5px;margin:0}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.chi{width:34px;height:34px;border-radius:11px;background:var(--pri-l);color:var(--pri-d);display:grid;place-items:center}
.muted{color:var(--mute)}.center{text-align:center}

/* ---------- الأزرار والحقول ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:0;background:var(--grad);color:#fff;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:700;box-shadow:0 4px 12px rgba(27,126,230,.28);transition:transform .08s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none}
.btn.sec{background:var(--pri-l);color:var(--pri-d);box-shadow:none}
.btn.sec:hover{background:#d3e7ff}
.btn.ok{background:linear-gradient(135deg,#0e8f63,#2fcf97);box-shadow:0 4px 12px rgba(18,163,113,.3)}
.btn.bad{background:linear-gradient(135deg,#c93636,#f06a6a);box-shadow:0 4px 12px rgba(224,69,69,.28)}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px;gap:5px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px}
.field label{font-size:13px;color:var(--mute);font-weight:500}
input,select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#f8fbff;color:var(--ink);width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);background:#fff;box-shadow:0 0 0 4px rgba(27,126,230,.14)}

/* ---------- الجداول ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:11px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:#f1f7fe;color:var(--navy);font-weight:700;font-size:13px}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#f8fbff}
.who{display:flex;align-items:center;gap:10px;font-weight:700}
.av{width:36px;height:36px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.av.lg{width:58px;height:58px;font-size:24px;border:3px solid rgba(255,255,255,.55);background:rgba(255,255,255,.2)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700}
.b-ok{background:#dff5ec;color:var(--ok)}.b-bad{background:#fde6e6;color:var(--bad)}.b-warn{background:#fff1d1;color:#b97800}.b-mute{background:#e8eef7;color:var(--mute)}.b-pri{background:var(--pri-l);color:var(--pri-d)}

/* ---------- الإحصائيات ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px 16px;display:flex;align-items:center;gap:14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:28px;line-height:1.1;font-weight:800}
.stat span{color:var(--mute);font-size:13px}
.st-ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.st-ic.ok{background:linear-gradient(135deg,#0e8f63,#2fcf97)}
.st-ic.pri{background:var(--grad)}
.st-ic.bad{background:linear-gradient(135deg,#c93636,#f58b8b)}
.st-ic.warn{background:linear-gradient(135deg,#d98600,#ffc24a)}
.st-ic.navy{background:linear-gradient(135deg,#0b3c7d,#3a74c4)}

/* ---------- تنبيهات ---------- */
.notice{border:1px solid #f3d38a;background:#fff8e6;border-radius:16px;padding:12px 16px;margin-bottom:14px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#12263f;color:#fff;padding:12px 22px;border-radius:14px;z-index:99;max-width:90vw;box-shadow:0 8px 28px rgba(0,0,0,.28);font-weight:500}
.toast.err{background:var(--bad)}.toast.good{background:var(--ok)}

/* ---------- الدخول ---------- */
.auth-bg{min-height:100vh;background:var(--grad);display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
.auth-bg::before,.auth-bg::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.08)}
.auth-bg::before{width:380px;height:380px;top:-160px;right:-120px}
.auth-bg::after{width:300px;height:300px;bottom:-130px;left:-90px}
.login{width:100%;max-width:390px;background:#fff;border-radius:26px;padding:28px 24px;box-shadow:0 24px 60px rgba(8,40,100,.35);position:relative;z-index:1}
.login h1{font-size:30px;margin-bottom:0;line-height:1.5;color:var(--navy)}
.mk{display:block}
.emp-brand{display:flex;align-items:center;justify-content:space-between;gap:8px;color:#fff;font-weight:800;font-size:19px;margin-bottom:14px}
.emp-brand-l{display:flex;align-items:center;gap:8px}
.emp-brand .mk{filter:drop-shadow(0 2px 4px rgba(0,0,0,.18))}

/* ---------- واجهة الموظف ---------- */
.emp-bg{min-height:100vh;background:var(--grad) top/100% 300px no-repeat,var(--bg)}
.emp-wrap{max-width:460px;margin:0 auto;padding:22px 16px 30px}
.emp-head{display:flex;align-items:center;gap:14px;color:#fff;margin-bottom:18px}
.emp-head small{opacity:.85}
.emp-head h1{margin:0;font-size:23px}
.clockcard{text-align:center;padding:22px 16px}
.clock{font-size:48px;font-weight:800;letter-spacing:1px;direction:ltr;color:var(--navy);line-height:1.1;margin:4px 0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ok);font-weight:700}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(18,163,113,.5)}100%{box-shadow:0 0 0 10px rgba(18,163,113,0)}}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.pbtn{border:0;border-radius:22px;padding:22px 8px;color:#fff;font-weight:800;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;transition:transform .08s}
.pbtn:active{transform:scale(.96)}
.pbtn .pc{width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.22);display:grid;place-items:center}
.pbtn.in{background:linear-gradient(135deg,#0e8f63,#2fcf97);box-shadow:0 10px 22px rgba(18,163,113,.35)}
.pbtn.out{background:linear-gradient(135deg,#c93636,#f58080);box-shadow:0 10px 22px rgba(224,69,69,.32)}
.pbtn:disabled{opacity:.35;box-shadow:none;cursor:not-allowed}
.status{padding:13px 14px;border-radius:16px;background:#e8f1fc;color:var(--navy);text-align:center;min-height:48px;margin-bottom:14px;font-weight:500}
.status.err{background:#fde6e6;color:var(--bad)}.status.good{background:#dff5ec;color:var(--ok)}

pre.rules{background:#0e1a33;color:#d6e2ff;padding:14px;border-radius:14px;overflow:auto;direction:ltr;text-align:left;font-size:12.5px;max-height:340px}
ol li{margin-bottom:6px}
a{color:var(--pri-d)}

/* ---------- نوافذ ---------- */
.ov{position:fixed;inset:0;background:rgba(10,30,60,.55);z-index:90;display:grid;place-items:center;padding:14px;backdrop-filter:blur(2px)}
.modal{background:#fff;border-radius:22px;width:100%;max-width:720px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(5,25,60,.4)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mh h3{margin:0}
.mb{padding:16px 18px;overflow-y:auto;flex:1}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:12px 18px;border-top:1px solid var(--line);background:#f8fbff;border-radius:0 0 22px 22px}
.ib.dark{background:var(--pri-l);color:var(--pri-d);border-color:transparent;width:36px;height:36px}
.ib.dark:hover{background:#d3e7ff}
.sec-t{font-weight:800;color:var(--navy);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
.hint{font-size:13px;color:var(--mute);margin:4px 0 10px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.drow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0;border-bottom:1px dashed var(--line)}
.drow:last-child{border-bottom:0}
.dn{width:96px;font-weight:700;display:flex;align-items:center;gap:7px;flex:none}
.dn input{width:auto}
.tin{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tin input{width:auto;min-width:112px;padding:7px 8px}
.num{width:96px!important}
.sc{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:99px;background:var(--pri-l);color:var(--pri-d);font-weight:700;font-size:13px;cursor:pointer;border:0}
.chip:hover{background:#d3e7ff}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.srow .nm{flex:1;min-width:120px}
.srow input[type=time]{width:auto;min-width:112px;padding:8px}
.cyc{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.cyc label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:3px}
.plan{display:inline-flex;align-items:center;gap:6px;background:var(--pri-l);color:var(--pri-d);padding:5px 12px;border-radius:99px;font-weight:700;font-size:13px;margin-top:8px}
.sch{border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;background:#fff}
.sch h4{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sch p{margin:2px 0 10px;color:var(--mute);font-size:13.5px}
.chk{display:flex;align-items:center;gap:8px;font-weight:500}
.chk input{width:auto}

/* ---------- شريط الاتصال وتثبيت التطبيق ---------- */
.off-bar{position:fixed;top:0;left:0;right:0;background:var(--warn);color:#fff;text-align:center;font-size:12.5px;font-weight:700;padding:6px 12px;z-index:100;display:none}
.pwa-btn{display:none;align-items:center;gap:6px;padding:6px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.18);color:#fff;font-size:12.5px;font-weight:700;cursor:pointer}
.pwa-btn:hover{background:rgba(255,255,255,.3)}

@media (max-width:720px){
  .ov{padding:0;place-items:end stretch}
  .modal{max-width:none;max-height:94vh;border-radius:22px 22px 0 0}
  .mf{border-radius:0;padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}

/* ---------- الجوال: تبويبات سفلية ---------- */
@media (max-width:720px){
  .top{padding:14px 14px 50px;border-radius:0 0 26px 26px}
  .brand b{font-size:16.5px}
  .tabs{position:fixed;bottom:0;left:0;right:0;margin:0;border-radius:22px 22px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;gap:2px;box-shadow:0 -8px 28px rgba(15,80,160,.18);z-index:50;overflow:visible}
  .tab{flex:1;flex-direction:column;gap:2px;font-size:11.5px;padding:8px 2px;border-radius:14px}
  .tab.on{background:var(--pri-l);color:var(--pri-d);box-shadow:none}
  .wrap.main{padding-bottom:100px;padding-top:14px}
  .toast{bottom:100px}
  .stat{padding:12px}.stat b{font-size:24px}.st-ic{width:44px;height:44px}
  .clock{font-size:42px}
}
@media (max-width:420px){.tab{font-size:10.5px}.tab svg{width:18px;height:18px}}
</style>
</head>

function rulesText(email0) {
const email = String(email0 || '').trim().toLowerCase().replace(/[^a-z0-9@._+\-]/g, '');
return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // الإدارة: البريد المكتوب هنا يبقى «المالك» دائماً (للاسترجاع) + أي مشرف مضاف في /admins
    function isAdmin() {
      return request.auth != null
        && (request.auth.token.email == '${email}'
            || exists(/databases/$(database)/documents/admins/$(request.auth.uid))
            || (request.auth.token.get('email_verified', false) == true
                && exists(/databases/$(database)/documents/admins/$(request.auth.token.email))));
    }

    // صاحب الرابط: هوية مجهولة مرتبطة بوصف الموظف — تمنع نسخ att_dev أو انتحال الجهاز
    function ownerOnly(empId) {
      return request.auth != null
        && get(/databases/$(database)/documents/employees/$(empId)).data.get('uid', null) == request.auth.uid;
    }

    match /admins/{uid} {
      allow read, write: if isAdmin();
    }

    match /locations/{id} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }
    match /schedules/{id} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }
    match /holidays/{id} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }
    match /settings/{id} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }
    match /taskTypes/{id} {
      allow read: if request.auth != null;
      allow write: if isAdmin();
    }

    match /employees/{empId} {
      allow get: if isAdmin() || ownerOnly(empId) || unclaimed();
      allow list, create, delete: if isAdmin();
      allow update: if isAdmin() || claimDevice() || bindUid() || rebindDevice() || punchState();

      // الرابط لم يُربط بهوية بعد: يمكن قراءته لأجل ربطه
      function unclaimed() {
        return request.auth != null
          && resource.data.get('uid', null) == null
          && resource.data.active == true;
      }

      // أول فتح للرابط: ربط الجهاز + الهوية معاً
      function claimDevice() {
        return request.auth != null
          && resource.data.get('deviceId', null) == null
          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['deviceId', 'uid'])
          && request.resource.data.uid == request.auth.uid;
      }

      // ترقية رابط قديم (جهاز فقط) إلى نظام الهوية
      function bindUid() {
        return request.auth != null
          && resource.data.get('uid', null) == null
          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['uid'])
          && request.resource.data.uid == request.auth.uid;
      }

      // استعادة ربط نفس الجهاز (مثلاً عند مسح جلسة Auth المجهولة مع بقاء رمز الجهاز أو العكس)
      function rebindDevice() {
        return request.auth != null
          && resource.data.active == true
          && resource.data.get('deviceId', null) != null
          && request.resource.data.get('deviceId', null) == resource.data.get('deviceId', null)
          && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['uid'])
          && request.resource.data.uid == request.auth.uid;
      }

      // تحديث حالة الموظف مسموح فقط لصاحب الهوية ومع إنشاء سجل في نفس الدفعة (batch)
      function punchState() {
        let a = request.resource.data;
        return ownerOnly(empId)
          && resource.data.active == true
          && a.diff(resource.data).affectedKeys().hasOnly(['state', 'lastAt', 'lastRecId'])
          && a.state in ['in', 'out']
          && a.lastAt == request.time
          && a.lastRecId is string
          && !exists(/databases/$(database)/documents/employees/$(empId)/records/$(a.lastRecId))
          && existsAfter(/databases/$(database)/documents/employees/$(empId)/records/$(a.lastRecId));
      }

      match /records/{recId} {
        allow read: if isAdmin() || ownerOnly(empId);
        allow create: if isAdmin() || validRecord();
        allow update, delete: if isAdmin();

        function validRecord() {
          let d = request.resource.data;
          let e = get(/databases/$(database)/documents/employees/$(empId)).data;
          let a = getAfter(/databases/$(database)/documents/employees/$(empId)).data;
          let l = get(/databases/$(database)/documents/locations/$(d.locationId)).data;
          let st = e.get('state', null);
          let last = e.get('lastAt', null);
          let dx = (d.lng - l.lng) * l.kx;
          let dy = (d.lat - l.lat) * l.ky;
          return request.auth != null
            && e.get('uid', null) == request.auth.uid
            && d.keys().hasOnly(['type','time','lat','lng','accuracy','distance','locationId','locationName','empName','deviceId'])
            && d.keys().hasAll(['type','time','lat','lng','accuracy','distance','locationId','locationName','empName','deviceId'])
            && d.time == request.time
            && d.type in ['in', 'out']
            && e.active == true
            && d.empName == e.name
            && d.deviceId == e.get('deviceId', null)
            && d.lat is number && d.lng is number
            && d.lat >= -90 && d.lat <= 90 && d.lng >= -180 && d.lng <= 180
            && d.accuracy is number && d.accuracy >= 0 && d.accuracy <= 250
            && d.distance is number
            && d.locationId is string && d.locationName == l.name
            && (!('locs' in e) || e.locs.size() == 0 || d.locationId in e.locs)
            && l.get('active', true) != false
            && math.sqrt(dx * dx + dy * dy) <= l.radius + 10
            && a.get('lastRecId', null) == recId && a.get('state', null) == d.type
            && (last == null || request.time.toMillis() - last.toMillis() >= 20000)
            && ((d.type == 'in' && (st == null || st == 'out' || (last != null && request.time.toMillis() - last.toMillis() >= 50400000)))
              || (d.type == 'out' && (st == null || st == 'in')));
        }
      }

      // طلبات الإجازة والتصحيح — القراءة والكتابة لصاحب الهوية أو الإدارة فقط
      match /requests/{rid} {
        allow read: if isAdmin() || ownerOnly(empId);
        allow create: if isAdmin() || validRequest();
        allow update: if isAdmin();
        allow delete: if isAdmin() || (ownerOnly(empId) && resource.data.status == 'pending');

        function validRequest() {
          let d = request.resource.data;
          let e = get(/databases/$(database)/documents/employees/$(empId)).data;
          return request.auth != null
            && e.get('uid', null) == request.auth.uid
            && d.keys().hasOnly(['kind','type','typeName','from','to','fixIn','fixOut','note','status','empName','createdAt','taskId','taskName','qty'])
            && d.keys().hasAll(['kind','from','to','status','empName','createdAt'])
            && e.active == true
            && d.status == 'pending'
            && d.kind in ['leave', 'fix', 'task']
            && d.empName == e.name
            && d.createdAt == request.time
            && d.from is string && d.from.matches('[0-9]{4}-[0-9]{2}-[0-9]{2}')
            && d.to is string && d.to.matches('[0-9]{4}-[0-9]{2}-[0-9]{2}')
            && d.from <= d.to
            && d.get('note', '') is string && d.get('note', '').size() <= 300
            && d.get('type', '') is string && d.get('type', '').size() <= 40
            && d.get('typeName', '') is string && d.get('typeName', '').size() <= 60
            && d.get('fixIn', '') is string && d.get('fixIn', '').size() <= 5
            && d.get('fixOut', '') is string && d.get('fixOut', '').size() <= 5
            && (d.kind != 'task' || (e.get('empType', 'staff') == 'task'
                && d.get('taskId', '') is string && d.get('taskId', '').size() > 0 && d.get('taskId', '').size() <= 40
                && exists(/databases/$(database)/documents/taskTypes/$(d.get('taskId', '')))
                && get(/databases/$(database)/documents/taskTypes/$(d.get('taskId', ''))).data.name == d.get('taskName', '')
                && get(/databases/$(database)/documents/taskTypes/$(d.get('taskId', ''))).data.get('active', true) != false
                && d.get('taskName', '').size() <= 80
                && d.get('qty', 0) is number && d.get('qty', 0) >= 1 && d.get('qty', 0) <= 500));
        }
      }
    }

    match /{path=**}/records/{recId} {
      allow read: if isAdmin();
    }
    match /{path=**}/requests/{rid} {
      allow read: if isAdmin();
    }
  }
}`;
}

async function employeeApp(db, auth, token) {
  const showErr = m => { root.innerHTML = `<div class="emp-bg"><div class="emp-wrap"><div class="card center" style="margin-top:60px"><div class="st-ic bad" style="margin:0 auto 12px">${ic('alert', 24)}</div><p style="margin:0;font-weight:500">${esc(m)}</p></div></div></div>`; };
  root.innerHTML = `<div class="emp-bg"><div class="emp-wrap"><div class="card center" style="margin-top:60px">جاري التحميل…</div></div></div>`;
  const ref = doc(db, 'employees', token);
  let emp, locs = [];
  const myDev = getDeviceId();
  /* --- المصادقة المجهولة: هوية دائمة تُربط بوصف الموظف --- */
  let uid = null;
  try {
    const cu = auth.currentUser;
    if (cu && cu.isAnonymous) uid = cu.uid;
    else { if (cu) await signOut(auth); const cred = await signInAnonymously(auth); uid = cred.user.uid; }
  } catch (e) {
    const c = e && e.code ? e.code : '';
    return showErr(
      (c === 'auth/operation-not-allowed' || c === 'auth/configuration-not-found' || c === 'auth/admin-restricted-operation')
        ? 'تسجيل الدخول المجهول (Anonymous) غير مفعّل في هذا المشروع. اطلب من الإدارة: Firebase Console ← Authentication ← Sign-in method ← تفعيل Anonymous، ثم أعد المحاولة.'
        : 'تعذر الاتصال بالنظام. تحقق من الإنترنت وحاول مجدداً.');
  }
  try {
    const snap = await getDoc(ref);
    if (!snap.exists() || !snap.data().active) return showErr('الرابط غير صالح أو تم إيقافه. تواصل مع الإدارة.');
    emp = snap.data();
    if (!emp.deviceId && !emp.uid) {
      await updateDoc(ref, { deviceId: myDev, uid });
      emp.deviceId = myDev; emp.uid = uid;
    } else if (emp.uid === uid && emp.deviceId !== myDev) {
      // نفس حساب المصادقة المجهولة على نفس المتصفح لكن مُعرّف localStorage فُقد: نستعيده محلياً دون إزعاج الموظف
      try { localStorage.setItem('att_dev', emp.deviceId); } catch {}
    } else if (emp.deviceId === myDev && emp.uid !== uid) {
      // نفس الجهاز لكن جلسة Anonymous Auth تجددت: نحدّث uid إن سمحت القواعد
      try { await updateDoc(ref, { uid }); emp.uid = uid; }
      catch { return showErr('هذا الرابط مرتبط بجهاز آخر. اطلب من الإدارة إعادة ضبط الجهاز.'); }
    } else if (emp.uid && emp.uid !== uid) {
      return showErr('هذا الرابط مرتبط بجهاز آخر. اطلب من الإدارة إعادة ضبط الجهاز.');
    } else if (!emp.uid) {
      await updateDoc(ref, { uid });
      emp.uid = uid;
    } else if (emp.deviceId !== myDev) {
      return showErr('هذا الرابط مرتبط بجهاز آخر. اطلب من الإدارة إعادة ضبط الجهاز.');
    }
    const ls = await getDocs(collection(db, 'locations'));
    locs = ls.docs.map(d => ({ id: d.id, ...d.data() })).filter(l => l.active !== false);
    if (emp.locs && emp.locs.length) locs = locs.filter(l => emp.locs.includes(l.id));
  } catch (e) {
    if (e && e.code === 'permission-denied') return showErr('هذا الرابط مرتبط بجهاز آخر، أو القواعد لم تُحدث بعد. اطلب من الإدارة إعادة ضبط الجهاز.');

  let hols = [];

      <div class="sc">

        <button class="chip" id="rqFix">${ic('edit', 15)} تصحيح نسيان حضور / انصراف</button>

    </div>
    <div class="card"><div class="ch"><span class="chi">${ic('report', 18)}</span><h3>آخر تسجيلاتك</h3></div><div class="tw"><table><tbody id="hist"><tr><td class="muted">…</td></tr></tbody></table></div></div>

  refreshPwaButtons();

    const b = baseDay(sched, key, emp.rotOffset);
    if (!b.work) return `<span class="plan">${ic('sun', 15)} اليوم يوم راحة</span>`;
    if (sched.mode === 'flex') return `<span class="plan">${ic('clock', 15)} المطلوب اليوم: ${fmtMinsH(b.flexMin)}</span>`;
    return `<span class="plan">${ic(b.periods[0].e > 1440 ? 'moon' : 'clock', 15)} ${b.shiftName ? esc(b.shiftName) + ': ' : 'دوامك: '}${b.periods.map(p => `${fmtHM(minHM(p.s))} – ${fmtHM(minHM(p.e))}`).join(' و ')}</span>`;
  };
  clearInterval(window.__empClockTick);
  window.__empClockTick = setInterval(() => {
    if (!$('#clock')) return;
    const n = now();
    $('#clock').textContent = fmtTime(n, true);
    $('#dateTxt').textContent = `${weekday(n)} ${fmtDate(n)}`;
    const k = dayKey(n);
    if (k !== planKey) { planKey = k; $('#plan').innerHTML = planHtml(k); }
  }, 500);

  let last = null;
  const inflightKey = 'att_inflight_' + token;
  async function loadHist() {
    try {
      const q = query(collection(db, 'employees', token, 'records'), orderBy('time', 'desc'), limit(15));
      const s = await getDocs(q);
      const rows = s.docs.map(d => ({ ...d.data(), t: d.data().time?.toDate() })).filter(r => r.t);
      last = rows[0] || null;
      $('#hist').innerHTML = rows.length ? rows.map(r => `<tr><td><span class="badge ${r.type === 'in' ? 'b-ok' : 'b-bad'}">${r.type === 'in' ? 'حضور' : 'انصراف'}</span></td><td>${fmtDate(r.t)}</td><td>${fmtTime(r.t)}</td><td class="muted">${esc(r.locationName)}</td></tr>`).join('') : '<tr><td class="muted">لا توجد تسجيلات بعد</td></tr>';
    } catch { $('#hist').innerHTML = '<tr><td class="muted">تعذر تحميل السجل</td></tr>'; }
    const n = now();
    // يتطابق مع حد القواعد (FORGOT_MS = 14h) ومع جدول الموظف لمنع التعارض عند تسجيل حضور جديد
    const forgotLim = Math.min(FORGOT_MS, forgotMsOf(sched));
    const canIn = !(last && last.type === 'in' && n - last.t < forgotLim);
    // الانصراف متاح فقط إذا كانت الجلسة المفتوحة لم تتجاوز سقف الاقتران
    const maxOutSpan = Math.max(forgotMsOf(sched) * 2, 36 * 3600e3);
    const canOut = !!(last && last.type === 'in' && (n - last.t) <= maxOutSpan);
    $('#bIn').disabled = !canIn; $('#bOut').disabled = !canOut;
    $('#state').innerHTML = last ? (last.type === 'in' ? `<span class="badge b-ok">${ic('check', 14)} أنت حاضر منذ ${fmtTime(last.t)}</span>` : `<span class="badge b-mute">آخر انصراف ${fmtTime(last.t)}</span>`) : '';
  }

  const setMsg = (t, c = '') => { const m = $('#msg'); if (m) { m.className = 'status ' + c; m.textContent = t; } };
  const getPos = () => new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 }));

  async function punch(type) {
    if (!navigator.onLine) return setMsg('لا يوجد اتصال بالإنترنت. لا تُسجَّل البصمة دون اتصال — أعد المحاولة عند عودة الشبكة.', 'err');
    if (!navigator.geolocation) return setMsg('متصفحك لا يدعم تحديد الموقع.', 'err');
    if (!locs.length) return setMsg('لم تحدد الإدارة أي موقع عمل بعد.', 'err');
    try {
      const pendTs = +sessionStorage.getItem(inflightKey) || 0;
      if (Date.now() - pendTs < 25000) return setMsg('توجد عملية تسجيل قيد الإرسال حالياً — انتظر ثوانٍ ولا تُعد الضغط.', 'err');
    } catch {}
    if (last && now() - last.t < MIN_GAP_MS) return setMsg('تم تسجيلك للتو، انتظر لحظات ثم أعد المحاولة.', 'err');
    $('#bIn').disabled = $('#bOut').disabled = true;
    setMsg('جاري تحديد موقعك… (قد يستغرق بضع ثوانٍ)');
    let pos;
    try { pos = await getPos(); }
    catch (e) {
      setMsg(e.code === 1 ? 'تم رفض إذن الموقع. فعّل الإذن من إعدادات المتصفح ثم أعد المحاولة.' : 'تعذر تحديد موقعك. فعّل GPS وتأكد من الاتصال ثم أعد المحاولة.', 'err');
      return loadHist();
    }
    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
    if (accuracy > MAX_ACCURACY) { setMsg(`دقة الموقع ضعيفة (±${Math.round(accuracy)}م). فعّل GPS أو انتقل لمكان مفتوح وأعد المحاولة.`, 'err'); return loadHist(); }
    let best = null;
    for (const l of locs) { const d = dist(lat, lng, l.lat, l.lng); if (!best || d < best.d) best = { l, d }; }
    if (best.d > best.l.radius) { setMsg(`أنت خارج نطاق العمل. تبعد حوالي ${Math.round(best.d)} متر عن «${best.l.name}» (المسموح ${best.l.radius}م). لم يتم التسجيل.`, 'err'); return loadHist(); }
    try {
      try { sessionStorage.setItem(inflightKey, String(Date.now())); } catch {}
      const devToUse = emp.deviceId || myDev;
      const recRef = doc(collection(db, 'employees', token, 'records'));
      const batch = writeBatch(db);
      batch.set(recRef, { type, time: serverTimestamp(), lat, lng, accuracy: Math.round(accuracy), distance: Math.round(best.d), locationId: best.l.id, locationName: best.l.name, empName: emp.name, deviceId: devToUse });
      batch.update(ref, { state: type, lastAt: serverTimestamp(), lastRecId: recRef.id });
      const done = batch.commit();
      const first = await Promise.race([done.then(() => 'ok'), new Promise(r => setTimeout(() => r('slow'), 15000))]);
      if (first === 'slow') {
        setMsg('الشبكة بطيئة: التسجيل قيد الإرسال. لا تُعد الضغط — سيظهر في «آخر تسجيلاتك» فور وصوله.');
        done.then(() => { try { sessionStorage.removeItem(inflightKey); } catch {} setMsg('✅ وصل التسجيل إلى الخادم', 'good'); loadHist(); }).catch(() => { try { sessionStorage.removeItem(inflightKey); } catch {} setMsg('تعذر حفظ التسجيل. تحقق من الاتصال وأعد المحاولة.', 'err'); loadHist(); });
        return;
      }
      try { sessionStorage.removeItem(inflightKey); } catch {}
      setMsg(type === 'in' ? `✅ تم تسجيل حضورك في «${best.l.name}»` : `✅ تم تسجيل انصرافك من «${best.l.name}»`, 'good');
    } catch (e) {
      try { sessionStorage.removeItem(inflightKey); } catch {}
      setMsg(e.code === 'permission-denied' ? 'رفض الخادم التسجيل: تأكد أنك داخل نطاق العمل وأن آخر عملية لم تُسجَّل للتو، ثم أعد المحاولة.' : 'تعذر حفظ التسجيل. تحقق من الاتصال وحاول مجدداً.', 'err');
    }
    loadHist();
  }
  /* ---------- طلبات الموظف: إجازة وتصحيح ---------- */
  const rqFormEl = $('#rqForm');
  const myLeaves = { list: [] };
  async function refreshMyLeaves() {
    try { const s = await getDocs(query(collection(db, 'employees', token, 'requests'), where('kind', '==', 'leave'))); myLeaves.list = s.docs.map(d => d.data()); } catch {}
    return myLeaves.list;
  }
  const annualLeft = () => { const yr = dayKey(now()).slice(0, 4), q = emp.leaveQuota ?? 21; const used = myLeaves.list.filter(r => r.status === 'approved' && leaveDeducts(r)).reduce((a, r) => a + countLeaveDays(r.from, r.to, sched, emp.rotOffset || 0, hols, yr), 0); return { q, used, rem: q - used, yr }; };
  const cntWork = (from, to) => (from && to && to >= from ? countLeaveDays(from, to, sched, emp.rotOffset || 0, hols) : 0);
  const showBal = () => { const b = $('#rqBal'); if (!b) return; const x = annualLeft(); b.style.display = 'block'; b.innerHTML = `${ic('sun', 15)} رصيد الإجازات ${x.yr} (أيام عمل): المتبقي <b>${x.rem} يوم</b> (المستهلك ${x.used} من ${x.q})`; };
  function showRqForm(kind) {
    rqFormEl.innerHTML = kind === 'leave' ? `
      <div class="g2" style="margin-top:10px">
        <div id="rqBal" class="field" style="grid-column:1/-1;background:var(--pri-l);padding:9px 12px;border-radius:10px;font-size:13px;display:none"></div>
        <div class="field"><label>نوع الإجازة</label><select id="rqType">${LT.map(x => `<option value="${esc(x.id)}">${esc(x.name)}${+x.pct < 100 ? ` (تُدفع ${+x.pct}% من الأجر)` : ''}</option>`).join('')}</select></div>
        <div class="field"><label>من تاريخ</label><input type="date" id="rqFrom"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" id="rqTo"></div>
        <div id="rqCnt" class="hint" style="grid-column:1/-1;margin:0"></div>
        <div class="field" style="grid-column:1/-1"><label>ملاحظة (اختياري)</label><input id="rqNote" maxlength="300"></div>
        <button class="btn" id="rqSend" style="grid-column:1/-1">إرسال الطلب للإدارة</button>
      </div>` : `
      <div class="g2" style="margin-top:10px">
        <div class="field"><label>يوم النسيان</label><input type="date" id="rqDay" max="${dayKey(now())}"></div>
        <div class="field"><label>وقت حضور</label><input type="time" id="rqIn"></div>
        <div class="field"><label>وقت انصراف</label><input type="time" id="rqOut"></div>
        <div class="field" style="grid-column:1/-1"><label>سبب النسيان / ملاحظة</label><input id="rqNote" maxlength="300"></div>
        <button class="btn" id="rqSend" style="grid-column:1/-1">إرسال الطلب للإدارة</button>
      </div>`;
    if (kind === 'leave') {
      refreshMyLeaves().then(showBal);
      const upd = () => {
        const el = $('#rqCnt'); if (!el) return;
        const n = cntWork($('#rqFrom').value, $('#rqTo').value), x = LT.find(v => v.id === $('#rqType').value) || LT[0];
        el.textContent = n ? `أيام العمل المحتسبة: ${n} (تُستثنى أيام الراحة والعطل الرسمية)${+x.pct < 100 ? ` · تُدفع بنسبة ${+x.pct}% من الأجر` : ''}` : ($('#rqFrom').value && $('#rqTo').value ? 'لا يوجد يوم دوام في هذه الفترة' : '');
      };
      ['rqFrom', 'rqTo', 'rqType'].forEach(i => $('#' + i).addEventListener('change', upd));
    }
    $('#rqSend').onclick = async () => {
      const btn = $('#rqSend');
      if (btn) btn.disabled = true;
      try {
        const note = ($('#rqNote') ? $('#rqNote').value.trim() : '');
        if (kind === 'leave') {
          const from = $('#rqFrom').value, to = $('#rqTo').value;
          if (!from || !to || to < from) { if (btn) btn.disabled = false; return toast('حدد فترة إجازة صحيحة', 'err'); }
          const list = await refreshMyLeaves();
          for (const r of list) if ((r.status === 'approved' || r.status === 'pending') && !(to < r.from || from > r.to)) { if (btn) btn.disabled = false; return toast(`يوجد طلب إجازة (${r.status === 'approved' ? 'معتمد' : 'معلّق'}) يتعارض مع هذه الفترة (${r.from} إلى ${r.to})`, 'err'); }
          if (list.filter(r => r.status === 'pending').length >= 5) { if (btn) btn.disabled = false; return toast('لديك 5 طلبات إجازة بانتظار المراجعة — انتظر حتى تُراجَع قبل إرسال طلب جديد', 'err'); }
          if (daysBetween(from, to) + 1 > 90) { if (btn) btn.disabled = false; return toast('أقصى مدة للطلب الواحد 90 يوماً', 'err'); }
          const nWork = cntWork(from, to);
          if (!nWork) { if (btn) btn.disabled = false; return toast('هذه الفترة لا تتضمن أي يوم دوام (راحة أو عطل رسمية)', 'err'); }
          const lt = LT.find(v => v.id === $('#rqType').value) || LT[0];
          if (lt.deduct) { const x = annualLeft(); if (nWork > x.rem && !confirm(`أيام العمل المطلوبة (${nWork}) تتجاوز رصيدك المتبقي (${x.rem} يوم). هل تريد الإرسال رغم ذلك؟`)) { if (btn) btn.disabled = false; return; } }
          await addDoc(collection(db, 'employees', token, 'requests'), { kind: 'leave', type: String(lt.id).slice(0, 40), typeName: String(lt.name).slice(0, 60), from, to, note, status: 'pending', empName: emp.name, createdAt: serverTimestamp() });
          rqFormEl.innerHTML = '';
          toast('أُرسل طلب الإجازة — بانتظار موافقة الإدارة', 'good');
        } else {
          const d = $('#rqDay').value, tin = $('#rqIn').value, tout = $('#rqOut').value;
          if (!d || (!tin && !tout)) { if (btn) btn.disabled = false; return toast('حدد اليوم والوقت المطلوب تصحيحه', 'err'); }
          if (d > dayKey(now())) { if (btn) btn.disabled = false; return toast('لا يمكن تقديم تصحيح ليوم في المستقبل', 'err'); }
          await addDoc(collection(db, 'employees', token, 'requests'), { kind: 'fix', type: '', typeName: '', from: d, to: d, fixIn: tin || '', fixOut: tout || '', note, status: 'pending', empName: emp.name, createdAt: serverTimestamp() });
          rqFormEl.innerHTML = '';
          toast('أُرسل طلب التصحيح — بانتظار موافقة الإدارة', 'good');
        }
        loadReqs();
      } catch (e) { if (btn) btn.disabled = false; console.error(e); toast('تعذر إرسال الطلب، حاول مجدداً', 'err'); }
    };
  }
  $('#rqLeave').onclick = () => showRqForm('leave');
  $('#rqFix').onclick = () => showRqForm('fix');
  $('#rqList').onclick = async ev => {
    const bx = ev.target.closest('[data-cx]'); if (!bx || !confirm('إلغاء هذا الطلب؟')) return;
    try { await deleteDoc(doc(db, 'employees', token, 'requests', bx.dataset.cx)); toast('أُلغي الطلب', 'good'); loadReqs(); }
    catch { toast('تعذر الإلغاء (ربما روجع الطلب)', 'err'); }
  };
  async function loadReqs() {
    try {
      const q = query(collection(db, 'employees', token, 'requests'), orderBy('createdAt', 'desc'), limit(10));
      const s = await getDocs(q);
      $('#rqList').innerHTML = s.docs.length ? s.docs.map(d => {
        const r = d.data();
        const st = r.status === 'pending' ? '<span class="badge b-warn">بانتظار المراجعة</span>' : r.status === 'approved' ? '<span class="badge b-ok">مقبول</span>' : '<span class="badge b-bad">مرفوض</span>';
        const det = r.kind === 'leave' ? `${esc(r.typeName || 'إجازة')} · من ${esc(r.from)} إلى ${esc(r.to)}` : `تصحيح ${esc(r.from)}${r.fixIn ? ' · حضور ' + esc(r.fixIn) : ''}${r.fixOut ? ' · انصراف ' + esc(r.fixOut) : ''}`;
        return `<tr><td>${det}</td><td>${st}${r.status === 'pending' ? ` <button class="btn sm sec" data-cx="${d.id}">${ic('x', 14)} إلغاء</button>` : ''}</td></tr>`;
      }).join('') : '<tr><td class="muted">لا توجد طلبات بعد</td></tr>';
    } catch { $('#rqList').innerHTML = '<tr><td class="muted">تعذر تحميل طلباتك</td></tr>'; }
  }
  loadReqs();

  $('#bIn').onclick = () => punch('in');
  $('#bOut').onclick = () => punch('out');
  loadHist();
}

/* =====================================================================
   واجهة موظف المهام (فري لانسر): بلا بصمة، يُسجّل مهامه والإدارة تعتمد
   ===================================================================== */
async function taskWorkerApp(db, token, emp, orgName) {
  let types = [];
  try { const s = await getDocs(collection(db, 'taskTypes')); types = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.active !== false).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar')); } catch {}
  const price = id => { const o = emp.taskPrices && emp.taskPrices[id]; if (o != null) return +o || 0; const x = types.find(v => v.id === id); return x ? +x.price || 0 : 0; };
  const today = dayKey(new Date());
  root.innerHTML = `<div class="emp-bg"><div class="emp-wrap">
    <div class="emp-brand"><div class="emp-brand-l">${logoMark(28)}<span>${esc(orgName)}</span></div><button class="pwa-btn" onclick="window.__installPWA()">${ic('download', 15)} تثبيت التطبيق</button></div>
    <div class="emp-head"><div class="av lg">${ini(emp.name)}</div><div><small>موظف مهام${emp.dept ? ` · ${esc(emp.dept)}` : ''}</small><h1>${esc(emp.name)}</h1></div></div>
    <div class="card"><div class="ch"><span class="chi">${ic('task', 18)}</span><h3>تسجيل مهمة منفّذة</h3></div>
      ${types.length ? `<div class="g2">
        <div class="field" style="grid-column:1/-1"><label>نوع المهمة</label><select id="tkType">${types.map(x => `<option value="${esc(x.id)}">${esc(x.name)} — ${price(x.id)} للوحدة</option>`).join('')}</select></div>
        <div class="field"><label>العدد المنفّذ</label><input type="number" id="tkQty" min="1" max="500" step="1" value="1" inputmode="numeric"></div>
        <div class="field"><label>تاريخ التنفيذ</label><input type="date" id="tkDay" value="${today}" max="${today}"></div>
        <div class="field" style="grid-column:1/-1"><label>ملاحظة / رابط الدليل (اختياري)</label><input id="tkNote" maxlength="300"></div>
        <button class="btn" id="tkSend" style="grid-column:1/-1">إرسال للإدارة للاعتماد</button></div>`
      : '<p class="muted" style="margin:0">لم تُضف الإدارة أنواع مهام بعد. تواصل معها.</p>'}
    </div>
    <div class="card"><div class="ch"><span class="chi">${ic('report', 18)}</span><h3>حسابي هذا الشهر</h3></div><div id="tkSum" class="muted">…</div></div>
    <div class="card"><div class="ch"><span class="chi">${ic('send', 18)}</span><h3>مهامي</h3></div><div class="tw"><table><tbody id="tkList"><tr><td class="muted">…</td></tr></tbody></table></div></div>
  </div></div>`;
  refreshPwaButtons();
  async function load() {
    try {
      const s = await getDocs(query(collection(db, 'employees', token, 'requests'), orderBy('createdAt', 'desc'), limit(60)));
      const rows = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.kind === 'task');
      const mk = today.slice(0, 7);
      const ap = rows.filter(r => r.status === 'approved' && String(r.from).startsWith(mk));
      const pe = rows.filter(r => r.status === 'pending' && String(r.from).startsWith(mk));
      const sum = (a, f) => a.reduce((x, r) => x + f(r), 0);
      $('#tkSum').innerHTML = `<div>معتمد: <b>${sum(ap, r => +(r.qtyApproved ?? r.qty) || 0)}</b> وحدة · المبلغ <b>${Math.round(sum(ap, r => +r.amount || 0) * 100) / 100}</b></div><div style="margin-top:4px">بانتظار الاعتماد: ${sum(pe, r => +r.qty || 0)} وحدة (تقديرياً ${Math.round(sum(pe, r => (+r.qty || 0) * price(r.taskId)) * 100) / 100})</div>`;
      $('#tkList').innerHTML = rows.length ? rows.map(r => {
        const st = r.status === 'pending' ? '<span class="badge b-warn">بانتظار الاعتماد</span>' : r.status === 'approved' ? `<span class="badge b-ok">معتمد · ${+r.amount || 0}</span>` : '<span class="badge b-bad">مرفوض</span>';
        return `<tr><td>${esc(r.taskName || '')} × ${+(r.qtyApproved ?? r.qty) || 0}<div class="muted" style="font-size:12px">${esc(r.from)}</div></td><td>${st}${r.status === 'pending' ? ` <button class="btn sm sec" data-cx="${esc(r.id)}">${ic('x', 14)}</button>` : ''}</td></tr>`;
      }).join('') : '<tr><td class="muted">لا توجد مهام مسجّلة بعد</td></tr>';
    } catch { $('#tkList').innerHTML = '<tr><td class="muted">تعذر تحميل مهامك</td></tr>'; }
  }
  if ($('#tkSend')) $('#tkSend').onclick = async () => {
    const id = $('#tkType').value, qty = parseInt($('#tkQty').value, 10), day = $('#tkDay').value, x = types.find(v => v.id === id);
    if (!x) return toast('اختر نوع المهمة', 'err');
    if (!(qty >= 1 && qty <= 500)) return toast('العدد من 1 إلى 500', 'err');
    if (!day || day > today) return toast('حدد تاريخ تنفيذ صحيحاً (لا يكون في المستقبل)', 'err');
    try {
      await addDoc(collection(db, 'employees', token, 'requests'), { kind: 'task', type: 'task', typeName: '', taskId: id, taskName: String(x.name).slice(0, 80), qty, from: day, to: day, note: $('#tkNote').value.trim().slice(0, 300), status: 'pending', empName: emp.name, createdAt: serverTimestamp() });
      $('#tkQty').value = 1; $('#tkNote').value = '';
      toast('أُرسلت المهمة — بانتظار اعتماد الإدارة', 'good'); load();
    } catch (e) { console.error(e); toast(e.code === 'permission-denied' ? 'رُفض الطلب: قد يكون نوع المهمة تغيّر — أعد تحميل الصفحة' : 'تعذر الإرسال، حاول مجدداً', 'err'); }
  };
  $('#tkList').onclick = async ev => {
    const bx = ev.target.closest('[data-cx]'); if (!bx || !confirm('إلغاء هذه المهمة؟')) return;
    try { await deleteDoc(doc(db, 'employees', token, 'requests', bx.dataset.cx)); toast('أُلغيت المهمة', 'good'); load(); }
    catch { toast('تعذر الإلغاء (ربما رُوجعت)', 'err'); }
  };
  load();
}

/* =====================================================================
   تسجيل دخول الإدارة
   ===================================================================== */
function loginPage(auth) {
  root.innerHTML = `<div class="auth-bg"><div class="login">

          if (!d.on) h += `<span class="muted">يوم راحة</span>`;
          else {
            d.p.forEach((p, j) => { h += `<span class="tin">${j ? 'و' : 'من'} ${tm(`days.${i}.p.${j}.s`, p.s)} إلى ${tm(`days.${i}.p.${j}.e`, p.e)}${j ? `<button type="button" class="chip" data-a="rmP" data-i="${i}" data-j="${j}">${ic('x', 14)}</button>` : ''}</span>`; });
            if (d.p.length < 2) h += `<button type="button" class="chip" data-a="addP" data-i="${i}">${ic('plus', 14)} فترة ثانية</button>`;
          }
          h += `</div>`;
        });
        h += `<div class="sc"><button type="button" class="chip" data-a="copyAll">${ic('copy', 14)} تطبيق أوقات أول يوم عمل على باقي أيام العمل</button></div>`;
      }
      if (W.mode === 'flex') {
        h += `<div class="sec-t">${ic('clock', 18)} ساعات العمل المطلوبة يومياً</div>`;
        DAY_ORDER.forEach(i => { const d = W.days[i]; h += `<div class="drow"><label class="dn"><input type="checkbox" data-k="days.${i}.on" data-redraw ${d.on ? 'checked' : ''}> ${DAY_NAMES[i]}</label>${d.on ? `${nm(`days.${i}.h`, d.h, 'min="0" max="24" step="0.25"')} ساعة` : '<span class="muted">يوم راحة</span>'}</div>`; });
      }
      if (W.mode === 'rotation') {
        h += `<div class="sec-t">${ic('moon', 18)} قوالب جاهزة (اختياري)</div><div class="sc">${PRESETS.map((p, i) => `<button type="button" class="chip" data-a="preset" data-i="${i}">${p.label}</button>`).join('')}</div>`;
        h += `<div class="sec-t">${ic('clock', 18)} الورديات</div>`;
        W.shifts.forEach((x, i) => { h += `<div class="srow"><input class="nm" data-k="shifts.${i}.name" value="${esc(x.name)}" placeholder="اسم الوردية">${tm(`shifts.${i}.s`, x.s)}<span>إلى</span>${tm(`shifts.${i}.e`, x.e)}<button type="button" class="chip" data-a="rmShift" data-i="${i}">${ic('trash', 14)}</button></div>`; });
        h += `<div class="sc"><button type="button" class="chip" data-a="addShift">${ic('plus', 14)} إضافة وردية</button></div>`;
        h += `<div class="sec-t">${ic('refresh', 18)} دورة الأيام</div><p class="hint">اختر لكل يوم من الدورة وردية أو «راحة». تتكرر الدورة تلقائياً.</p><div class="cyc">`;
        W.cycle.forEach((c, i) => { h += `<label>اليوم ${i + 1}<select data-k="cycle.${i}"><option value="">راحة</option>${W.shifts.map(x => `<option value="${x.id}" ${c === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></label>`; });
        h += `</div><div class="sc"><button type="button" class="chip" data-a="addDay">${ic('plus', 14)} إضافة يوم للدورة</button>${W.cycle.length ? `<button type="button" class="chip" data-a="rmDay">${ic('x', 14)} حذف آخر يوم</button>` : ''}</div>`;
        h += `<div class="field" style="max-width:260px"><label>تاريخ اليوم الأول من الدورة</label><input type="date" data-k="anchor" value="${esc(W.anchor)}"></div>`;
      }
      h += `<div class="sec-t">${ic('alert', 18)} التأخير والاستراحة</div><div class="g2">`;
      h += `<div class="field"><label>استراحة غير مدفوعة (دقيقة)</label>${nm('breakMin', W.breakMin, 'min="0"')}</div>`;
      if (W.mode !== 'flex') {
        h += `<div class="field"><label>سماح التأخير (دقيقة)</label>${nm('graceLate', W.graceLate, 'min="0"')}</div><div class="field"><label>سماح الخروج المبكر (دقيقة)</label>${nm('graceEarly', W.graceEarly, 'min="0"')}</div>`;
        h += `<div class="field" style="grid-column:1/-1"><label>طريقة احتساب التأخير بعد السماح</label>${sel('graceMode', W.graceMode, [['forgive', 'إن تجاوز السماح تُحتسب الدقائق كاملة'], ['excess', 'تُحتسب الدقائق التي تلي السماح فقط']])}</div>`;
      }
      h += `</div><p class="hint">تُخصم الاستراحة تلقائياً من أي يوم تتجاوز ساعات العمل فيه 4 ساعات.</p>`;
      h += `<div class="sec-t">${ic('plus', 18)} العمل الإضافي</div><div class="g2">`;
      h += `<div class="field" style="grid-column:1/-1"><label>متى يُحسب العمل إضافياً؟</label>${sel('ot.mode', W.ot.mode, [['hours', 'ما زاد عن ساعات اليوم'], ['afterEnd', 'ما بعد نهاية الدوام الرسمي'], ['none', 'لا يوجد عمل إضافي']], true)}</div>`;
      if (W.ot.mode !== 'none') {
        h += `<div class="field"><label>حد الساعات اليومي (0 = ساعات الجدول)</label>${nm('ot.baseH', W.ot.baseH, 'min="0" step="0.25"')}</div>`;
        h += `<div class="field"><label>أقل إضافي يُحتسب (دقيقة)</label>${nm('ot.min', W.ot.min, 'min="0"')}</div>`;
        h += `<div class="field"><label>التقريب للأدنى كل</label>${sel('ot.step', W.ot.step, [[0, 'بدون تقريب'], [5, '5 دقائق'], [10, '10 دقائق'], [15, '15 دقيقة'], [30, '30 دقيقة'], [60, 'ساعة']])}</div>`;
        h += `<div class="field"><label>أقصى إضافي يومياً بالساعات (0 = بلا حد)</label>${nm('ot.capH', W.ot.capH, 'min="0" step="0.25"')}</div>`;
        h += `<div class="field"><label>معامل الإضافي في الأيام العادية</label>${nm('ot.rateNormal', W.ot.rateNormal, 'min="0" step="0.05"')}</div>`;
        h += `<div class="field"><label>معامل العمل في يوم الراحة</label>${nm('ot.rateRest', W.ot.rateRest, 'min="0" step="0.05"')}</div>`;
        h += `<div class="field"><label>معامل العمل في العطلة الرسمية</label>${nm('ot.rateHoliday', W.ot.rateHoliday, 'min="0" step="0.05"')}</div>`;
        h += `<div class="field" style="grid-column:1/-1"><label class="chk"><input type="checkbox" data-k="ot.offDayAll" ${W.ot.offDayAll ? 'checked' : ''}> كل ساعات العمل في يوم الراحة أو العطلة تُحتسب إضافية</label></div>`;
      }
      h += `</div><p class="hint">المعاملات للمحاسب: تُضرب بها ساعات الإضافي لتعطي الساعات المكافئة في التقارير.</p>`;
      return h;
    };
    openModal({
      title: ex ? 'تعديل جدول الدوام' : 'جدول دوام جديد', body,
      onField: (k, v) => setPath(W, k, v),
      onAct: (a, d) => {
        const i = +d.i, j = +d.j;
        if (a === 'addP') W.days[i].p.push({ s: '17:00', e: '21:00' });
        if (a === 'rmP') W.days[i].p.splice(j, 1);
        if (a === 'copyAll') { const f = DAY_ORDER.find(x => W.days[x].on); if (f !== undefined) DAY_ORDER.forEach(x => { if (W.days[x].on) W.days[x].p = JSON.parse(JSON.stringify(W.days[f].p)); }); }
        if (a === 'preset') { const p = PRESETS[i]; W.shifts = JSON.parse(JSON.stringify(p.shifts)); W.cycle = [...p.cycle]; }
        if (a === 'addShift') W.shifts.push({ id: 's' + Math.random().toString(36).slice(2, 7), name: 'وردية ' + (W.shifts.length + 1), s: '08:00', e: '16:00' });
        if (a === 'rmShift') { const id = W.shifts[i].id; W.shifts.splice(i, 1); W.cycle = W.cycle.map(c => c === id ? '' : c); }
        if (a === 'addDay') W.cycle.push('');
        if (a === 'rmDay') W.cycle.pop();
      },
      onSave: async () => {
        const bad = m => { toast(m, 'err'); return false; };
        const c = JSON.parse(JSON.stringify(W)); delete c.id; delete c._n;
        c.name = (c.name || '').trim(); if (!c.name) return bad('اكتب اسم الجدول');
        if (c.mode === 'fixed') {
          const on = DAY_ORDER.filter(i => c.days[i].on); if (!on.length) return bad('فعّل يوماً واحداً على الأقل');
          for (const i of on) { c.days[i].p = c.days[i].p.filter(p => p.s && p.e); if (!c.days[i].p.length) return bad(`أكمل أوقات يوم ${DAY_NAMES[i]}`); }
        }
        if (c.mode === 'flex' && !DAY_ORDER.some(i => c.days[i].on && c.days[i].h > 0)) return bad('فعّل يوماً وحدد ساعاته');
        if (c.mode === 'rotation') {
          if (!c.shifts.length) return bad('أضف وردية واحدة على الأقل');
          if (c.shifts.some(x => !x.name.trim() || !x.s || !x.e)) return bad('أكمل اسم وأوقات كل وردية');
          if (!c.cycle.some(x => x)) return bad('أضف أيام الدورة واختر وردية ليوم واحد على الأقل');
          if (!c.anchor) return bad('حدد تاريخ اليوم الأول من الدورة');
        }
        ['breakMin', 'graceLate', 'graceEarly'].forEach(k => c[k] = Math.max(0, +c[k] || 0));
        ['baseH', 'min', 'step', 'capH', 'rateNormal', 'rateRest', 'rateHoliday'].forEach(k => c.ot[k] = Math.max(0, +c.ot[k] || 0));
        c.ot.offDayAll = !!c.ot.offDayAll;
        c.updatedAt = serverTimestamp();
        if (ex) await setDoc(doc(db, 'schedules', ex.id), c); else await addDoc(collection(db, 'schedules'), { ...c, createdAt: serverTimestamp() });
        await loadAll(); toast('تم حفظ الجدول', 'good');
      }
    });
  }

  /* --- محرر بيانات الموظف --- */
  function employeeEditor(e) {
    const created = e.createdAt && e.createdAt.toDate ? dayKey(e.createdAt.toDate()) : dayKey(new Date());
    const W = { name: e.name || '', phone: e.phone || '', scheduleId: e.scheduleId || '', rotPos: (e.rotOffset || 0) + 1, startDate: e.startDate || created, dept: e.dept || '', payMode: e.payMode === 'monthly' || e.payMode === 'hourly' ? e.payMode : 'none', payAmount: e.payAmount ?? '', leaveQuota: e.leaveQuota ?? 21, empType: e.empType === 'task' ? 'task' : 'staff' };
    W.locs = {}; (e.locs || []).forEach(id => W.locs[id] = true);
    W.tp = {}; Object.entries(e.taskPrices || {}).forEach(([k, v]) => W.tp[k] = v);
    const body = () => {
      const sc = S.scheds.find(x => x.id === W.scheduleId);
      let h = `<div class="g2"><div class="field"><label>الاسم</label><input data-k="name" value="${esc(W.name)}"></div><div class="field"><label>رقم الواتساب</label><input data-k="phone" dir="ltr" value="${esc(W.phone)}" placeholder="2189XXXXXXXX"></div></div>`;
      h += `<div class="field" style="max-width:280px"><label>القسم / الفرع (اختياري)</label><input data-k="dept" value="${esc(W.dept)}" placeholder="المبيعات"></div>`;
      h += `<div class="field" style="max-width:380px;margin-top:10px"><label>نوع التوظيف</label><select data-k="empType" data-redraw><option value="staff" ${W.empType === 'staff' ? 'selected' : ''}>موظف دوام (بصمة وجدول)</option><option value="task" ${W.empType === 'task' ? 'selected' : ''}>موظف مهام — فري لانسر (يُدفع له حسب المهام المنفّذة)</option></select></div>`;
      if (W.empType === 'task') {
        h += `<div class="sec-t">${ic('task', 18)} أسعار خاصة بهذا الموظف (اختياري)</div><p class="hint" style="margin-top:0">اترك الخانة فارغة ليُحتسب سعر الكتالوج. موظف المهام بلا بصمة ولا جدول ولا غياب ولا رصيد إجازات، وأجره = مجموع مهامه المعتمدة في الفترة.</p>`;
        h += S.taskTypes.length ? `<div class="g2">${S.taskTypes.map(x => `<div class="field"><label>${esc(x.name)} (الكتالوج: ${+x.price || 0})</label><input class="num" type="number" min="0" step="0.01" data-k="tp.${esc(x.id)}" value="${W.tp[x.id] ?? ''}"></div>`).join('')}</div>` : '<p class="muted">لا يوجد كتالوج مهام بعد — أضف أنواع المهام من تبويب «المهام».</p>';
        return h;
      }
      h += `<div class="sec-t">${ic('sched', 18)} الدوام</div><div class="field"><label>جدول الدوام</label><select data-k="scheduleId" data-redraw><option value="">— بدون جدول (غير محدد) —</option>${S.scheds.map(x => `<option value="${x.id}" ${W.scheduleId === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></div>`;
      if (sc) h += `<p class="hint">${esc(schedSummary(sc))}</p>`;
      if (sc && sc.mode === 'rotation' && (sc.cycle || []).length) {
        const n = sc.cycle.length, pos = Math.min(Math.max(1, +W.rotPos || 1), n), sh = (sc.shifts || []).find(x => x.id === sc.cycle[pos - 1]);
        h += `<div class="field" style="max-width:260px"><label>موضع الموظف في الدورة (من 1 إلى ${n})</label><input class="num" type="number" min="1" max="${n}" data-k="rotPos" data-redraw value="${pos}"></div><p class="hint">في تاريخ ${fmtDate(dayStart(sc.anchor))} يكون الموظف في اليوم رقم ${pos} من الدورة: <b>${sh ? esc(sh.name) : 'راحة'}</b>. استخدم مواضع مختلفة لتوزيع الموظفين على فرق.</p>`;
      }
      h += `<div class="field" style="max-width:260px"><label>تاريخ بدء احتساب الدوام</label><input type="date" data-k="startDate" value="${esc(W.startDate)}"></div><p class="hint">الأيام السابقة لهذا التاريخ لا تُحتسب غياباً.</p>`;
      h += `<div class="sec-t">${ic('pin', 18)} المواقع المسموحة لهذا الموظف</div><p class="hint" style="margin-top:0">إن لم تختر أياً منها فسيسمح له بالتسجيل في أي موقع مفعّل. المواقع غير المختارة لن تقبل بصمته.</p>`;
      h += `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px">${S.locs.map(l => `<label class="chk"><input type="checkbox" data-k="locs.${l.id}" ${W.locs[l.id] ? 'checked' : ''}> ${esc(l.name)}</label>`).join('')}</div>`;
      h += `<div class="sec-t">${ic('plus', 18)} الحساب والرواتب</div><div class="g2"><div class="field"><label>طريقة الأجر</label><select data-k="payMode" data-redraw><option value="none" ${W.payMode === 'none' ? 'selected' : ''}>— غير محدد —</option><option value="monthly" ${W.payMode === 'monthly' ? 'selected' : ''}>راتب شهري</option><option value="hourly" ${W.payMode === 'hourly' ? 'selected' : ''}>أجر لكل ساعة</option></select></div>`;
      if (W.payMode !== 'none') h += `<div class="field"><label>${W.payMode === 'monthly' ? 'الراتب الشهري' : 'أجر الساعة'} (بالوحدة المحلية)</label><input class="num" type="number" min="0" step="0.01" data-k="payAmount" value="${W.payAmount}"></div>`;
      h += `</div><p class="hint">مسير الرواتب الآلي يُبنى في تبويب التقارير من هذه القيم مع بيانات الفترة: الأساسي، قيمة الإضافي بالمعاملات، وخصم التأخير والمبكر والغياب والإجازة بلا راتب (للراتب الشهري).</p>`;
      h += `<div class="sec-t">${ic('sun', 18)} رصيد الإجازات السنوية</div><div class="g2"><div class="field"><label>الحصة السنوية (يوم)</label><input class="num" type="number" min="0" max="365" step="1" data-k="leaveQuota" value="${W.leaveQuota ?? 21}"></div></div><p class="hint">يُحسب المتبقي = الحصة ناقص أيام عمل الإجازات المعتمدة من الأنواع التي تُخصم من الرصيد (حسب «أنواع الإجازات» في تبويب الدوام) في السنة الحالية، ويظهر في تبويب «الطلبات» مع تنبيه عند اعتماد طلب يتجاوز الرصيد.</p>`;
      return h;
    };
    openModal({
      title: 'بيانات الموظف', body, onField: (k, v) => { if (k.startsWith('locs.')) W.locs[k.slice(5)] = !!v; else if (k.startsWith('tp.')) W.tp[k.slice(3)] = v; else W[k] = v; },
      onSave: async () => {
        const name = (W.name || '').trim(); if (!name) { toast('اكتب اسم الموظف', 'err'); return false; }
        if (W.empType === 'task') {
          const tp = {}; Object.entries(W.tp).forEach(([k, v]) => { if (v !== '' && v != null && +v >= 0) tp[k] = +v; });
          await updateDoc(doc(db, 'employees', e.id), { name, phone: String(W.phone || '').replace(/\D/g, ''), dept: String(W.dept || '').trim(), empType: 'task', payMode: 'task', payAmount: 0, scheduleId: '', rotOffset: 0, locs: [], taskPrices: tp });
          await loadAll(); toast('تم حفظ بيانات الموظف', 'good'); return;
        }
        const sc = S.scheds.find(x => x.id === W.scheduleId);
        const n = sc && sc.mode === 'rotation' ? (sc.cycle || []).length : 0;
        const rot = n ? Math.min(Math.max(1, +W.rotPos || 1), n) - 1 : 0;
        const ids = Object.keys(W.locs).filter(id => W.locs[id]);
        const amt = +W.payAmount || 0;
        if (W.payMode !== 'none' && !(amt > 0)) { toast('اكتب قيمة الراتب', 'err'); return false; }
        await updateDoc(doc(db, 'employees', e.id), { name, phone: String(W.phone || '').replace(/\D/g, ''), scheduleId: sc ? sc.id : '', rotOffset: rot, startDate: W.startDate || created, dept: String(W.dept || '').trim(), payMode: W.payMode, payAmount: W.payMode === 'none' ? 0 : amt, locs: ids, leaveQuota: Math.max(0, +W.leaveQuota || 21), empType: 'staff' });
        await loadAll(); toast('تم حفظ بيانات الموظف', 'good');
      }
    });
  }

    </tbody></table></div>

      }
    });
  }

  /* --- أدوات المرحلة 3: تحميل مكتبات CDN عند الطلب فقط --- */
  let _L = null;
  function loadLeaflet() {
    if (window.L) return Promise.resolve(window.L);
    if (_L) return _L;
    _L = new Promise((res, rej) => {
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
      const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
      s.onload = () => res(window.L); s.onerror = () => { _L = null; rej(new Error('leaflet-load')); };
      document.head.appendChild(s);
    });
    return _L;
  }

  /* --- محرر المواقع بالخريطة (Leaflet + OpenStreetMap) --- */
  function locEditor(ex) {
    const W = ex ? { id: ex.id, name: ex.name || '', lat: +ex.lat, lng: +ex.lng, radius: +ex.radius || 100 } : { id: null, name: '', lat: 32.8872, lng: 13.1913, radius: 100 };
    let map = null, marker = null, circle = null;
    const syncMap = () => {
      if (!map || !window.L) return;
      const c = [W.lat, W.lng];
      if (marker) marker.setLatLng(c);
      else { marker = window.L.marker(c, { draggable: true }).addTo(map); marker.on('dragend', () => { const p = marker.getLatLng(); W.lat = p.lat; W.lng = p.lng; syncMap(); }); }
      if (circle) circle.setLatLng(c).setRadius(W.radius);
      else circle = window.L.circle(c, { radius: W.radius, color: '#1b7ee6', fillOpacity: 0.15 }).addTo(map);
      map.setView(c, Math.max(map.getZoom(), 15), { animate: false });
      const t = $('#coordTxt'); if (t) t.textContent = `${W.lat.toFixed(5)}, ${W.lng.toFixed(5)}`;
    };
    const initMap = box => {
      loadLeaflet().then(() => {
        if (!box.isConnected) return;
        box._ready = true;
        map = window.L.map(box, { scrollWheelZoom: true }).setView([W.lat, W.lng], 15);
        window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        map.on('click', ev => { W.lat = ev.latlng.lat; W.lng = ev.latlng.lng; syncMap(); });
        syncMap();
      }).catch(() => { box._busy = false; toast('تعذر تحميل الخريطة — تحقق من الاتصال ثم أعد المحاولة', 'err'); });
    };
    let mo = null;
    const obs = new MutationObserver(() => {
      if (!document.querySelector('.ov')) { obs.disconnect(); return; }
      const box = document.getElementById('mapBox');
      if (box && !box._ready && !box._busy) { box._busy = true; initMap(box); }
    });
    obs.observe(document.body, { childList: true, subtree: true });
    const body = () => `
      <div class="g2"><div class="field"><label>اسم الموقع</label><input data-k="name" value="${esc(W.name)}"></div>
      <div class="field"><label>النطاق (متر)</label><input class="num" type="number" min="10" data-k="radius" data-redraw value="${W.radius}"></div></div>
      <p class="hint">اضغط على الخريطة لوضع النقطة أو اسحب العلامة. الدائرة الزرقاء هي النطاق المسموح للموظف حول الموقع.</p>
      <div id="mapBox" style="height:320px;border-radius:14px;border:1px solid var(--line);background:#e8eef7"></div>
      <div class="sc"><button type="button" class="chip" data-a="myLoc">${ic('target', 15)} موقعي الحالي</button><span class="muted" dir="ltr" id="coordTxt">${W.lat ? W.lat.toFixed(5) + ', ' + W.lng.toFixed(5) : ''}</span></div>`;
    mo = openModal({
      title: ex ? 'تعديل الموقع (خريطة تفاعلية)' : 'موقع جديد (خريطة تفاعلية)', saveText: 'حفظ الموقع', body,
      onField: (k, v) => { if (k === 'radius') W.radius = Math.max(10, +v || 100); else W[k] = v; },
      onAct: async a => {
        if (a === 'myLoc') {
          toast('جاري تحديد موقعك…');
          try {
            const p = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { enableHighAccuracy: true, timeout: 20000 }));
            W.lat = p.coords.latitude; W.lng = p.coords.longitude;
            toast('تم تعيين نقطة موقعك على الخريطة', 'good');
          } catch { toast('تعذر تحديد موقعك', 'err'); }
          if (mo) mo.draw();
        }
      },
      onSave: async () => {
        const bad = m => { toast(m, 'err'); return false; };
        if (!(W.name || '').trim()) return bad('اكتب اسم الموقع');
        if (typeof W.lat !== 'number' || typeof W.lng !== 'number' || isNaN(W.lat) || isNaN(W.lng)) return bad('حدد نقطة على الخريطة');
        if (!(W.radius >= 10)) return bad('النطاق 10 أمتار على الأقل');
        obs.disconnect();
        if (ex) await updateDoc(doc(db, 'locations', ex.id), { name: W.name.trim(), lat: W.lat, lng: W.lng, radius: Math.round(W.radius), ...geoK(W.lat) });
        else await addDoc(collection(db, 'locations'), { name: W.name.trim(), lat: W.lat, lng: W.lng, radius: Math.round(W.radius), active: true, ...geoK(W.lat) });
        await loadAll(); toast('تم حفظ الموقع', 'good');
      }
    });
  }

  function annualUsed(empId, year) {
    const c = empCtx(empId);
    return S.leaves.filter(l => l.empId === empId && leaveDeducts(l)).reduce((a, l) => a + countLeaveDays(l.from, l.to, c.sc, c.rot, S.holKeys, year), 0);

    ${S.emps.filter(e => e.active && e.empType !== 'task').map(e => { const q = e.leaveQuota ?? 21, u = annualUsed(e.id, dayKey(new Date()).slice(0, 4)), rem = q - u; return `<tr><td>${esc(e.name)}</td><td>${q} يوم</td><td>${u} يوم</td><td><span class="badge ${rem < 0 ? 'b-bad' : rem <= 3 ? 'b-warn' : 'b-ok'}">${rem} يوم</span></td></tr>`; }).join('') || '<tr><td colspan="4" class="muted">لا يوجد موظفون</td></tr>'}

  /* --- السجل --- */
  function filtered() {
    return S.recs.filter(r => { const k = dayKey(r.t); return k >= S.from && k <= S.to && (!S.emp || r.empId === S.emp); });
  }
  function notStarted(sc, key, rot) {
    if (!sc) return false;
    const b = baseDay(sc, key, rot); if (!b.work) return false;
    if (sc.mode === 'flex') return true;
    if (!b.periods.length) return false;
    return Math.floor(Date.now() / 60000 + TZOFF) % 1440 < b.periods[0].s + (sc.graceLate ?? 10);
  }
  const stopOf = e => e.active ? null : (e.archivedAt && e.archivedAt.toDate ? dayKey(e.archivedAt.toDate()) : '0000-00-00');
  let _sumC = null, _sumT = 0;
  const summary = () => { if (!_sumC || Date.now() - _sumT > 30000) { _sumC = computeSummary(); _sumT = Date.now(); } return _sumC; };
  function computeSummary() {
    const out = [];
    const byEmp = {};
    [...S.recs].sort((a, b) => a.t - b.t).forEach(r => (byEmp[r.empId] = byEmp[r.empId] || []).push(r));
    S.emps.filter(e => (e.active || (stopOf(e) && stopOf(e) > S.from)) && (!S.emp || e.id === S.emp)).forEach(e => { if (!byEmp[e.id]) byEmp[e.id] = []; });
    Object.entries(byEmp).forEach(([empId, rs]) => {
      if (S.emp && empId !== S.emp) return;
      const emp = S.emps.find(e => e.id === empId);
      if (!emp) return;
      if (emp.empType === 'task') return;
      const stopKey = stopOf(emp);
      const name = emp ? emp.name : (rs.length ? rs[rs.length - 1].empName : empId);
      const sc = emp && emp.scheduleId ? normSched(S.scheds.find(s => s.id === emp.scheduleId) || {}) : null;
      const rot = emp ? (emp.rotOffset || 0) : 0;
      const sd = emp ? emp.startDate : null;
      const lim = forgotMsOf(sc);
      const sesAll = pairSessions(rs, lim);
      let k = S.from;
      while (k <= S.to) {
        const ses = sesAll.filter(s => dayKey(s.start) === k);
        const met = calcDay(sc, k, ses, S.holKeys, rot, { nowMs: Date.now(), cap: lim });
        let status;
        if (ses.length) {
          const lastSes = ses[ses.length - 1];
          status = (met.open && lastSes && (Date.now() - lastSes.start) >= lim) ? 'forgot' : met.open ? 'open' : 'work';
          if (status === 'forgot') { met.raw = 0; met.net = 0; met.otMin = 0; met.otEq = 0; met.otRate = 0; met.early = 0; }
        }
        else if (onLeave(S.leaves, empId, k) && isLeaveDay(sc, k, rot, S.holKeys)) status = 'leave';
        else if (met.dayType === 'work' && met.planned > 0 && (!sd || k >= sd) && !(stopKey && k >= stopKey)) {
          if (k === dayKey(new Date()) && notStarted(sc, k, rot)) { k = addDays(k, 1); continue; }
          status = 'absent';
        }
        else { k = addDays(k, 1); continue; }
        out.push({ empId, name, day: k, met, status, lv: status === 'leave' ? getLeaveObj(S.leaves, empId, k) : null });
        k = addDays(k, 1);
      }
    });
    return out.sort((a, b) => b.day.localeCompare(a.day) || (a.name || '').localeCompare(b.name || '', 'ar'));
  }

  /* --- مسير الرواتب الآلي (إصلاح العيب المحاسبي في تناقض أيام الشهر والخصومات + دقة الساعات العادية الفعلية) ---
     الشهري: يُستخدم مقام الشهر الفعلي `dimOf(day)` للاستحقاق ولخصم الغياب والإجازة بلا راتب في نفس اليوم،
     بحيث إذا غاب الموظف الشهر كاملاً (28 أو 30 أو 31 يوماً) يكون الصافي = 0 تماماً بلا زيادة ولا سالب!
     كما أن `paidH` يعرض الساعات العادية الفعلية التي عملها الموظف (`regH`) بدقة. */
  const dimOf = k => new Date(Date.UTC(+k.slice(0, 4), +k.slice(5, 7), 0)).getUTCDate();
  function payrollRows() {
    const agg = new Map();
    const blank = () => ({ net: 0, otMin: 0, otEq: 0, late: 0, early: 0, absent: 0, absentDays: [], daysWorked: 0, forgotDays: 0, plMin: 0, plDays: 0, lv: [] });
    summary().forEach(s => {
      const g = agg.get(s.empId) || blank();
      if (s.status === 'work' || s.status === 'open') { g.net += s.met.net; g.otMin += s.met.otMin; g.otEq += (s.met.otEq || 0); g.daysWorked++; }
      else if (s.status === 'forgot') g.forgotDays++;
      else if (s.status === 'absent') { g.absent++; g.absentDays.push(s.day); }
      else if (s.status === 'leave' && s.lv) g.lv.push({ day: s.day, pct: leavePct(s.lv) / 100, plan: s.met.planned || 0 });
      g.late += s.met.late || 0; g.early += s.met.early || 0;
      if ((s.status === 'work' || s.status === 'open' || s.status === 'absent') && s.met.planned > 0) { g.plMin += s.met.planned; g.plDays++; }
      agg.set(s.empId, g);
    });
    const emps = S.emps.filter(e => (e.empType === 'task' || ((e.payMode === 'monthly' || e.payMode === 'hourly') && (+e.payAmount || 0) > 0))
      && (e.active || (stopOf(e) && stopOf(e) > S.from)) && (!S.emp || e.id === S.emp));
    return emps.map(e => {
      if (e.empType === 'task') {
        const rs = S.reqs.filter(r => r.kind === 'task' && r.status === 'approved' && r.empId === e.id && r.from >= S.from && r.from <= S.to);
        const base = rs.reduce((a, r) => a + (+r.amount || 0), 0), qty = rs.reduce((a, r) => a + (+(r.qtyApproved ?? r.qty) || 0), 0);
        return { empId: e.id, name: e.name, pm: 'task', amt: 0, paidH: 0, otEq: 0, base, otPay: 0, dedLate: 0, dedEarly: 0, dedAbs: 0, net: base, absent: 0, unpaidDays: 0, payDays: 0, lateMin: 0, earlyMin: 0, forgotDays: 0, taskQty: qty };
      }
      const g = agg.get(e.id) || blank();
      const pm = e.payMode, amt = +e.payAmount || 0;
      const regH = Math.max(0, g.net - g.otMin) / 60;
      let base = 0, otPay = 0, dedLate = 0, dedEarly = 0, dedAbs = 0, payDays = 0, avgH = 8;
      if (pm === 'hourly') {
        const leavePay = g.lv.reduce((a, x) => a + (x.plan ? x.plan / 60 : 8) * amt * x.pct, 0);
        base = amt * regH + leavePay; otPay = amt * g.otEq;
      } else {
        const dayRate = amt / 30;
        avgH = g.plDays ? Math.min(24, Math.max(1, g.plMin / g.plDays / 60)) : 8;
        const hourRate = dayRate / avgH;
        const from = (e.startDate && e.startDate > S.from) ? e.startDate : S.from;
        const stop = stopOf(e);
        const to = (stop && stop < S.to) ? stop : S.to;
        for (let k = from; k <= to; k = addDays(k, 1)) { base += amt / dimOf(k); payDays++; }
        // توحيد قيمة اليوم في الاستحقاق والخصم معاً حسب الشهر الفعلي، مع سقف لا يتجاوز الاستحقاق الأساسي
        const absDed = g.absentDays.reduce((a, dKey) => a + (amt / dimOf(dKey)), 0);

          const base = dayStart(r.from);
          const mkTime = (type, tstr) => { let m = hm(tstr); if (type === 'out' && r.fixIn && m <= hm(r.fixIn)) m += 1440; return Timestamp.fromDate(new Date(base.getTime() + m * 60000)); };
          const mkRec = type => ({ type, lat: 0, lng: 0, accuracy: 0, distance: 0, locationId: 'admin', locationName: 'تصحيح إداري (طلب معتمد)', empName: r.empName, deviceId: 'admin-fix' });
          let latestType = null, latestTs = null, latestId = null;
          if (r.fixIn) {
            const inRef = doc(collection(db, 'employees', empId, 'records'));
            const inTs = mkTime('in', r.fixIn);
            batch.set(inRef, { ...mkRec('in'), time: inTs });
            latestType = 'in'; latestTs = inTs; latestId = inRef.id;
          }
          if (r.fixOut) {
            const outRef = doc(collection(db, 'employees', empId, 'records'));
            const outTs = mkTime('out', r.fixOut);
            batch.set(outRef, { ...mkRec('out'), time: outTs });
            latestType = 'out'; latestTs = outTs; latestId = outRef.id;
          }
          const empDoc = S.emps.find(x => x.id === empId);
          const prevLastMs = empDoc && empDoc.lastAt && empDoc.lastAt.toMillis ? empDoc.lastAt.toMillis() : 0;
          if (latestTs && latestTs.toMillis() >= prevLastMs) {
            batch.update(doc(db, 'employees', empId), { state: latestType, lastAt: latestTs, lastRecId: latestId });
          }
        }
        await batch.commit();
        await loadAll(); toast(st === 'approved' ? 'تم اعتماد الطلب' : 'تم رفض الطلب', 'good');
      }
      if (act === 'ltEdit') return leaveTypesEditor();
      if (act === 'addTask') {
        const name = $('#tkName').value.trim(), price = parseFloat($('#tkPrice').value);
        if (!name || isNaN(price) || price < 0) return toast('اكتب اسم المهمة وسعرها', 'err');
        await addDoc(collection(db, 'taskTypes'), { name: name.slice(0, 80), price, active: true, createdAt: serverTimestamp() });
        await loadAll(); toast('أُضيفت المهمة للكتالوج', 'good');
      }
      if (act === 'editTask') {
        const x = S.taskTypes.find(v => v.id === id); if (!x) return;
        const n = prompt('اسم المهمة:', x.name); if (n === null) return;
        const p = prompt('سعر الوحدة:', String(x.price)); if (p === null) return;
        const pv = parseFloat(p); if (!n.trim() || isNaN(pv) || pv < 0) return toast('بيانات غير صحيحة', 'err');
        await updateDoc(doc(db, 'taskTypes', id), { name: n.trim().slice(0, 80), price: pv });
        await loadAll(); toast('تم التحديث — الأسعار المعتمدة سابقاً لا تتغيّر', 'good');
      }
      if (act === 'toggleTask') { const x = S.taskTypes.find(v => v.id === id); await updateDoc(doc(db, 'taskTypes', id), { active: x.active === false }); await loadAll(); }
      if (act === 'delTask') { if (confirm('حذف هذه المهمة من الكتالوج؟ تبقى مهامها المعتمدة سابقاً محفوظة.')) { await deleteDoc(doc(db, 'taskTypes', id)); await loadAll(); } }
      if (act === 'filter') {
        const f = $('#fFrom').value, t = $('#fTo').value;
        if (!f || !t || t < f) return toast('حدد فترة صحيحة', 'err');
        if ((dayStart(t) - dayStart(f)) / 86400000 > 92) return toast('الحد الأقصى للفترة 3 أشهر', 'err');
        S.from = f; S.to = t; S.emp = $('#fEmp').value; _sumC = null; await loadRecs(); _sumC = null; render();
      }
      if (act === 'csv') {
        const rows = [['الموظف', 'التاريخ', 'الحالة', 'أول حضور', 'آخر انصراف', 'متأخر (د)', 'مبكر (د)', 'صافي العمل (د)', 'إضافي (ساعات مكافئة)']];
        summary().forEach(s => rows.push([
          s.name, s.day,
          stText(s, ST_TXT),
          s.met.firstIn ? fmtTime(s.met.firstIn, true) : '',
          s.met.lastOut ? fmtTime(s.met.lastOut, true) : '',
          s.met.late || 0, s.met.early || 0, Math.round(s.met.net),
          s.met.otEq ? +s.met.otEq.toFixed(2) : 0
        ]));
        const csv = '\ufeff' + rows.map(r => r.map(c => { const s = String(c ?? ''); const safe = /^[=+\-@\t\r]/.test(s) ? "'" + s : s; return `"${safe.replace(/"/g, '""')}"`; }).join(',')).join('\n');
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `meqat_summary_${S.from}_${S.to}.csv`; a.click();
      }
    } catch (err) { console.error(err); toast('حدث خطأ — تحقق من الاتصال وصلاحيات Firestore', 'err'); }
  };

  clearInterval(window.__meqatTick);
  window.__meqatTick = setInterval(async () => {
    if (!auth.currentUser || S.tab !== 'today' || document.hidden || document.querySelector('.ov')) return;
    try { S.today = await fetchRecs(dayStart(dayKey(new Date(Date.now() - 86400000))), dayEnd(dayKey(new Date()))); } catch { return; }
    if (S.tab === 'today' && !document.querySelector('.ov') && $('#content')) viewToday($('#content'));
  }, 60000);
  loadAll();
}
</script>
</body>
</html>
