<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d4fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ميقات">
<title>مِيقَاتْ | نظام الحضور والانصراف</title>
<meta name="description" content="نظام متكامل لإدارة الحضور والانصراف والورديات والإجازات ومسير الرواتب الآلي عبر إحداثيات GPS.">
<meta property="og:title" content="مِيقَاتْ | نظام الحضور والانصراف">
<meta property="og:description" content="نظام متكامل لإدارة الحضور والانصراف والورديات والإجازات ومسير الرواتب الآلي عبر إحداثيات GPS.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f0f5fc;--card:#ffffff;--surface:#f7faff;--ink:#0f2544;--mute:#64748b;--line:#e2e8f0;
  --pri:#1b7ee6;--pri-d:#0f5fc0;--pri-l:#e0effe;--navy:#0b3c7d;
  --ok:#10b981;--bad:#ef4444;--warn:#f59e0b;
  --grad:linear-gradient(135deg,#09397c 0%,#1568c7 52%,#329ef2 100%);
  --sh:0 4px 20px -2px rgba(15,37,68,.06),0 2px 6px -1px rgba(15,37,68,.04);
  --sh-lg:0 16px 36px -6px rgba(15,37,68,.12);
  --th-bg:#f4f8fd;--tr-hover:#f8fbff;--inp-bg:#f8fafc;
}
[data-theme="dark"]{
  --bg:#0b1120;--card:#131c31;--surface:#19253f;--ink:#f1f5f9;--mute:#94a3b8;--line:#233252;
  --pri:#3898ff;--pri-d:#60a5fa;--pri-l:rgba(56,152,255,.15);--navy:#93c5fd;
  --ok:#10b981;--bad:#f87171;--warn:#fbbf24;
  --grad:linear-gradient(135deg,#082046 0%,#0f458a 55%,#1967be 100%);
  --sh:0 6px 24px rgba(0,0,0,.35);
  --sh-lg:0 20px 44px rgba(0,0,0,.55);
  --th-bg:#18243e;--tr-hover:#18233c;--inp-bg:#0f172a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Tajawal","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:15px;line-height:1.65;transition:background-color .25s,color .25s}
button,input,select,textarea{font:inherit}
.ic{flex:none;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(0,0,0,.1))}

/* ---------- الهيدر ---------- */
.top{background:var(--grad);color:#fff;padding:22px 20px 64px;border-radius:0 0 34px 34px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(11,60,125,.2)}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 70%);pointer-events:none}
.top::before{width:320px;height:320px;top:-140px;left:-80px}
.top::after{width:260px;height:260px;bottom:-120px;right:18%}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:14px}
.brand b{display:block;font-size:24px;font-weight:900;line-height:1.25;letter-spacing:-.3px}
.brand small{opacity:.85;font-size:13px;font-weight:500}
.logo{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;backdrop-filter:blur(8px);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.logo.big{width:82px;height:82px;border-radius:26px;background:var(--grad);border:0;box-shadow:0 12px 30px rgba(27,126,230,.38);margin:0 auto 14px}
.top-act{display:flex;gap:10px;align-items:center}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);transition:transform .15s,background .2s}
.ib:hover{background:rgba(255,255,255,.26);transform:translateY(-2px)}
.ib:active{transform:scale(.95)}

.wrap{max-width:1180px;margin:0 auto;padding:0 18px 32px}

/* ---------- التبويبات الرئيسية والفرعية ---------- */
.tabs{display:flex;gap:6px;background:var(--card);padding:8px;border-radius:22px;box-shadow:var(--sh-lg);border:1px solid var(--line);margin:-38px 0 22px;position:relative;z-index:2;overflow-x:auto}
.tab{display:flex;align-items:center;gap:10px;padding:11px 20px;border-radius:15px;border:0;background:transparent;color:var(--mute);font-weight:800;font-size:14.5px;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab:hover{background:var(--pri-l);color:var(--pri-d)}
.tab.on{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(27,126,230,.32)}

.subtabs{display:inline-flex;gap:6px;background:var(--surface);padding:6px;border-radius:16px;border:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.stab{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:12px;border:0;background:transparent;color:var(--mute);font-weight:700;font-size:13.5px;cursor:pointer;transition:all .18s}
.stab:hover{color:var(--ink)}
.stab.on{background:var(--card);color:var(--pri);box-shadow:var(--sh);font-weight:800}

/* ---------- البطاقات والحاويات ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:var(--sh);transition:background-color .25s,border-color .25s}
h1,h2,h3{margin:0 0 12px}
h1{font-size:23px;font-weight:900}h2{font-size:19px;font-weight:800}h3{font-size:17px;font-weight:800;margin:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ch-l{display:flex;align-items:center;gap:12px}
.chi{width:42px;height:42px;border-radius:14px;background:var(--pri-l);display:grid;place-items:center;flex:none}
.muted{color:var(--mute)}.center{text-align:center}

/* ---------- شريط الأدوات والبحث ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.search-box{position:relative;flex:1;min-width:220px;max-width:340px}
.search-box input{padding-right:40px;border-radius:14px;background:var(--surface);border-color:var(--line)}
.search-box .s-ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.75}

/* ---------- الأزرار والحقول ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--grad);color:#fff;padding:11px 20px;border-radius:14px;cursor:pointer;font-weight:800;font-size:14.5px;box-shadow:0 4px 14px rgba(27,126,230,.26);transition:transform .1s,filter .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.btn.sec{background:var(--pri-l);color:var(--pri);box-shadow:none;border:1px solid transparent}
.btn.sec:hover{border-color:var(--pri)}
.btn.ok{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 4px 14px rgba(16,185,129,.28)}
.btn.bad{background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 4px 14px rgba(239,68,68,.26)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:11px;gap:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.field label{font-size:13px;color:var(--mute);font-weight:700}
input,select,textarea{border:1.5px solid var(--line);border-radius:13px;padding:11px 14px;background:var(--inp-bg);color:var(--ink);width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 4px rgba(27,126,230,.15)}

/* ---------- الجداول الاحترافية ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:13px 16px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--th-bg);color:var(--navy);font-weight:800;font-size:13px;letter-spacing:.1px}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .15s}
tbody tr:hover td{background:var(--tr-hover)}
tfoot td{background:var(--th-bg);font-weight:900;border-top:2px solid var(--line)}
.who{display:flex;align-items:center;gap:12px;font-weight:800}
.av{width:40px;height:40px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px;flex:none;box-shadow:0 4px 10px rgba(27,126,230,.22)}
.av.lg{width:64px;height:64px;border-radius:22px;font-size:26px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:10px;font-size:12.5px;font-weight:800}
.b-ok{background:rgba(16,185,129,.14);color:#10b981}.b-bad{background:rgba(239,68,68,.14);color:#ef4444}.b-warn{background:rgba(245,158,11,.15);color:#f59e0b}.b-mute{background:var(--surface);color:var(--mute);border:1px solid var(--line)}.b-pri{background:var(--pri-l);color:var(--pri)}

/* ---------- قائمة إجراءات الموظف المنسدلة (بدون زحمة) ---------- */
.act-menu{position:relative;display:inline-block}
.act-menu summary{list-style:none;cursor:pointer;padding:7px 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;user-select:none}
.act-menu summary::-webkit-details-marker{display:none}
.act-menu summary:hover{border-color:var(--pri);color:var(--pri)}
.act-drop{position:absolute;left:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--sh-lg);z-index:40;min-width:185px;display:flex;flex-direction:column;gap:3px}
.act-drop button{width:100%;justify-content:flex-start;background:transparent;color:var(--ink);box-shadow:none;padding:9px 12px;border-radius:11px;font-size:13.5px;font-weight:700}
.act-drop button:hover{background:var(--pri-l);color:var(--pri);transform:none}
.act-drop button.bad-txt{color:var(--bad)}
.act-drop button.bad-txt:hover{background:rgba(239,68,68,.12)}

/* ---------- الإحصائيات ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;align-items:center;gap:15px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.stat b{display:block;font-size:30px;line-height:1.1;font-weight:900;color:var(--ink)}
.stat span{color:var(--mute);font-size:13px;font-weight:700}
.st-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none;background:var(--surface);border:1px solid var(--line)}

/* ---------- تنبيهات ---------- */
.notice{border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.1);border-radius:18px;padding:14px 18px;margin-bottom:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:13px 24px;border-radius:16px;z-index:120;max-width:90vw;box-shadow:0 12px 32px rgba(0,0,0,.35);font-weight:700;border:1px solid rgba(255,255,255,.1)}
.toast.err{background:#dc2626}.toast.good{background:#059669}

/* ---------- الدخول ---------- */
.auth-bg{min-height:100vh;background:var(--grad);display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
.auth-bg::before,.auth-bg::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.auth-bg::before{width:420px;height:420px;top:-180px;right:-120px}
.auth-bg::after{width:340px;height:340px;bottom:-150px;left:-90px}
.login{width:100%;max-width:410px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:34px 28px;box-shadow:0 28px 70px rgba(5,20,54,.45);position:relative;z-index:1}
.login h1{font-size:30px;margin-bottom:2px;line-height:1.4;color:var(--ink)}
.mk{display:block}

/* ---------- واجهة الموظف المطوّرة ---------- */
.emp-bg{min-height:100vh;background:var(--grad) top/100% 320px no-repeat,var(--bg)}
.emp-wrap{max-width:480px;margin:0 auto;padding:20px 16px 36px}
.emp-brand{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;font-weight:900;font-size:20px;margin-bottom:18px}
.emp-brand-l{display:flex;align-items:center;gap:10px}
.emp-head{display:flex;align-items:center;gap:16px;color:#fff;margin-bottom:20px;background:rgba(255,255,255,.1);padding:14px 16px;border-radius:22px;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px)}
.emp-head small{opacity:.9;font-size:13px;font-weight:600;display:block;margin-bottom:2px}
.emp-head h1{margin:0;font-size:22px;font-weight:900}
.clockcard{text-align:center;padding:26px 20px;border-radius:28px;box-shadow:var(--sh-lg);position:relative;overflow:hidden}
.clock{font-size:50px;font-weight:900;letter-spacing:1.5px;direction:ltr;color:var(--ink);line-height:1.1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:#10b981;font-weight:800;background:rgba(16,185,129,.12);padding:4px 12px;border-radius:99px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:#10b981;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}100%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.pbtn{border:0;border-radius:26px;padding:24px 12px;color:#fff;font-weight:900;font-size:17.5px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:transform .14s,box-shadow .2s;position:relative;overflow:hidden}
.pbtn:hover:not(:disabled){transform:translateY(-3px)}
.pbtn:active:not(:disabled){transform:scale(.96)}
.pbtn .pc{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;box-shadow:inset 0 2px 4px rgba(255,255,255,.3)}
.pbtn.in{background:linear-gradient(145deg,#059669 0%,#10b981 60%,#34d399 100%);box-shadow:0 12px 26px rgba(16,185,129,.35)}
.pbtn.out{background:linear-gradient(145deg,#dc2626 0%,#ef4444 60%,#f87171 100%);box-shadow:0 12px 26px rgba(239,68,68,.32)}
.pbtn:disabled{opacity:.38;box-shadow:none;cursor:not-allowed;filter:grayscale(.25)}
.status{padding:14px 16px;border-radius:18px;background:var(--pri-l);color:var(--pri-d);text-align:center;min-height:50px;margin-bottom:16px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid rgba(27,126,230,.2)}
.status.err{background:rgba(239,68,68,.14);color:var(--bad);border-color:rgba(239,68,68,.3)}.status.good{background:rgba(16,185,129,.14);color:var(--ok);border-color:rgba(16,185,129,.3)}

pre.rules{background:#0b1329;color:#dbeafe;padding:16px;border-radius:16px;overflow:auto;direction:ltr;text-align:left;font-size:12.5px;max-height:340px;border:1px solid #1e293b}
ol li{margin-bottom:8px}
a{color:var(--pri)}

/* ---------- نوافذ ---------- */
.ov{position:fixed;inset:0;background:rgba(7,16,34,.62);z-index:100;display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--line);border-radius:26px;width:100%;max-width:740px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:18px}
.mb{padding:20px 22px;overflow-y:auto;flex:1}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 26px 26px}
.ib.dark{background:var(--pri-l);color:var(--pri);border-color:transparent;width:38px;height:38px}
.ib.dark:hover{background:var(--pri);color:#fff}
.sec-t{font-weight:900;color:var(--navy);margin:22px 0 10px;display:flex;align-items:center;gap:9px;font-size:15.5px}
.hint{font-size:13px;color:var(--mute);margin:4px 0 12px;line-height:1.6}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.drow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.drow:last-child{border-bottom:0}
.dn{width:98px;font-weight:800;display:flex;align-items:center;gap:8px;flex:none}
.dn input{width:auto}
.tin{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tin input{width:auto;min-width:116px;padding:8px 10px}
.num{width:100px!important}
.sc{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:12px;background:var(--pri-l);color:var(--pri);font-weight:800;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .15s}
.chip:hover{border-color:var(--pri);transform:translateY(-1px)}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.srow .nm{flex:1;min-width:120px}
.srow input[type=time]{width:auto;min-width:116px;padding:8px}
.cyc{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cyc label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px;font-weight:700}
.plan{display:inline-flex;align-items:center;gap:8px;background:var(--pri-l);color:var(--pri);padding:6px 14px;border-radius:12px;font-weight:800;font-size:13.5px;margin-top:10px}
.sch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.sch{border:1px solid var(--line);border-radius:20px;padding:18px;background:var(--card);box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.sch h4{margin:0 0 6px;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800}
.sch p{margin:0;color:var(--mute);font-size:13.5px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chk input{width:auto}

/* ---------- طي البطاقات الفرعية ---------- */
details.fold{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 20px;margin-bottom:18px;box-shadow:var(--sh)}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px;user-select:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold[open] summary{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}

/* ---------- شريط الاتصال وتثبيت التطبيق ---------- */
.off-bar{position:fixed;top:0;left:0;right:0;background:var(--warn);color:#fff;text-align:center;font-size:12.5px;font-weight:800;padding:6px 12px;z-index:110;display:none}
.pwa-btn{display:none;align-items:center;gap:6px;padding:7px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;backdrop-filter:blur(6px)}
.pwa-btn:hover{background:rgba(255,255,255,.28)}

@media (max-width:760px){
  .ov{padding:0;place-items:end stretch}
  .modal{max-width:none;max-height:94vh;border-radius:26px 26px 0 0}
  .mf{border-radius:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .top{padding:16px 14px 52px;border-radius:0 0 28px 28px}
  .brand b{font-size:18px}

    return showErr(
      (c === 'auth/operation-not-allowed' || c === 'auth/configuration-not-found' || c === 'auth/admin-restricted-operation')

  try {
    const snap = await getDoc(ref);

    emp = snap.data();

      await updateDoc(ref, { deviceId: myDev, uid });

    } else if (emp.deviceId === myDev && emp.uid !== uid) {
      try { await updateDoc(ref, { uid }); emp.uid = uid; }
      catch { return showErr('هذا الرابط مرتبط بجهاز آخر. اطلب من الإدارة إعادة ضبط الجهاز.'); }
    } else if (emp.uid && emp.uid !== uid) {
      return showErr('هذا الرابط مرتبط بجهاز آخر. اطلب من الإدارة إعادة ضبط الجهاز.');
    } else if (!emp.uid) {

    } else if (emp.deviceId !== myDev) {

  } catch (e) {
    if (e && e.code === 'permission-denied') return showErr('هذا الرابط مرتبط بجهاز آخر، أو القواعد لم تُحدث بعد. اطلب من الإدارة إعادة ضبط الجهاز.');

  }
  let orgName = BRAND, LT = DEF_LT;
  try { const st = await getDoc(doc(db, 'settings', 'general')); if (st.exists()) { const s = st.data(); if (s.tzOffset != null && !isNaN(+s.tzOffset)) TZOFF = +s.tzOffset; if (s.orgName) orgName = s.orgName; LT = leaveTypesOf(s); } } catch {}

  </div></div>`;
  refreshPwaButtons();
  $('#skew').style.display = skewWarn ? 'inline-block' : 'none';
  let planKey = '';
  const planHtml = key => {

    return `<span class="plan">${ic(b.periods[0].e > 1440 ? 'moon' : 'clock', 18)} ${b.shiftName ? esc(b.shiftName) + ': ' : 'دوامك: '}${b.periods.map(p => `${fmtHM(minHM(p.s))} – ${fmtHM(minHM(p.e))}`).join(' و ')}</span>`;
  };
  clearInterval(window.__empClockTick);
  window.__empClockTick = setInterval(() => {
    if (!$('#clock')) return;
    const n = now();
    $('#clock').textContent = fmtTime(n, true);
    $('#dateTxt').textContent = `${weekday(n)} ${fmtDate(n)}`;

  let last = null;
  const inflightKey = 'att_inflight_' + token;
  async function loadHist() {
    try {
      const q = query(collection(db, 'employees', token, 'records'), orderBy('time', 'desc'), limit(15));
      const s = await getDocs(q);
      const rows = s.docs.map(d => ({ ...d.data(), t: d.data().time?.toDate() })).filter(r => r.t);

      $('#hist').innerHTML = rows.length ? rows.map(r => `<tr><td><span class="badge ${r.type === 'in' ? 'b-ok' : 'b-bad'}">${r.type === 'in' ? 'حضور' : 'انصراف'}</span></td><td>${fmtDate(r.t)}</td><td>${fmtTime(r.t)}</td><td class="muted">${esc(r.locationName)}</td></tr>`).join('') : '<tr><td class="muted">لا توجد تسجيلات بعد</td></tr>';
    } catch { $('#hist').innerHTML = '<tr><td class="muted">تعذر تحميل السجل</td></tr>'; }
    const n = now();
    const forgotLim = Math.min(FORGOT_MS, forgotMsOf(sched));

    if (!navigator.geolocation) return setMsg('متصفحك لا يدعم تحديد الموقع.', 'err');

    let pos;

    let best = null;

    try {

      if (first === 'slow') {
        setMsg('الشبكة بطيئة: التسجيل قيد الإرسال. لا تُعد الضغط — سيظهر في «آخر تسجيلاتك» فور وصوله.');
        done.then(() => { try { sessionStorage.removeItem(inflightKey); } catch {} setMsg('✅ وصل التسجيل إلى الخادم', 'good'); loadHist(); }).catch(() => { try { sessionStorage.removeItem(inflightKey); } catch {} setMsg('تعذر حفظ التسجيل. تحقق من الاتصال وأعد المحاولة.', 'err'); loadHist(); });
