  /* --- 7. تبويب التقارير والرواتب والسجل (مقسّم إلى 3 تبويبات فرعية أنيقة بدون تكديس) --- */
  function filtered() {
    return S.recs.filter(r => { const k = dayKey(r.t); return k >= S.from && k <= S.to && (!S.emp || r.empId === S.emp); });
  }
  function notStarted(sc, key, rot) {
    if (!sc) return false;
    const b = baseDay(sc, key, rot); if (!b.work) return false;
    if (sc.mode === 'flex') return true;
    if (!b.periods.length) return false;
    return Math.floor(Date.now() / 60000 + TZOFF) % 1440 < b.periods[0].s + (sc.graceLate ?? 10);
  }
  const stopOf = e => e.active ? null : (e.archivedAt && e.archivedAt.toDate ? dayKey(e.archivedAt.toDate()) : '0000-00-00');
  let _sumC = null, _sumT = 0;
  const summary = () => { if (!_sumC || Date.now() - _sumT > 30000) { _sumC = computeSummary(); _sumT = Date.now(); } return _sumC; };
  function computeSummary() {
    const out = [];
    const byEmp = {};
    [...S.recs].sort((a, b) => a.t - b.t).forEach(r => (byEmp[r.empId] = byEmp[r.empId] || []).push(r));
    S.emps.filter(e => (e.active || (stopOf(e) && stopOf(e) > S.from)) && (!S.emp || e.id === S.emp)).forEach(e => { if (!byEmp[e.id]) byEmp[e.id] = []; });
    Object.entries(byEmp).forEach(([empId, rs]) => {
      if (S.emp && empId !== S.emp) return;
      const emp = S.emps.find(e => e.id === empId);
      if (!emp) return;
      if (emp.empType === 'task') return;
      const stopKey = stopOf(emp);
      const name = emp ? emp.name : (rs.length ? rs[rs.length - 1].empName : empId);
      const sc = emp && emp.scheduleId ? normSched(S.scheds.find(s => s.id === emp.scheduleId) || {}) : null;
      const rot = emp ? (emp.rotOffset || 0) : 0;
      const sd = emp ? emp.startDate : null;
      const lim = forgotMsOf(sc);
      const sesAll = pairSessions(rs, lim);
      let k = S.from;
      while (k <= S.to) {
        const ses = sesAll.filter(s => dayKey(s.start) === k);
        const met = calcDay(sc, k, ses, S.holKeys, rot, { nowMs: Date.now(), cap: lim });
        let status;
        if (ses.length) {
          const lastSes = ses[ses.length - 1];
          status = (met.open && lastSes && (Date.now() - lastSes.start) >= lim) ? 'forgot' : met.open ? 'open' : 'work';
          if (status === 'forgot') { met.raw = 0; met.net = 0; met.otMin = 0; met.otEq = 0; met.otRate = 0; met.early = 0; }
        }
        else if (onLeave(S.leaves, empId, k) && isLeaveDay(sc, k, rot, S.holKeys)) status = 'leave';
        else if (met.dayType === 'work' && met.planned > 0 && (!sd || k >= sd) && !(stopKey && k >= stopKey)) {
          if (k === dayKey(new Date()) && notStarted(sc, k, rot)) { k = addDays(k, 1); continue; }
          status = 'absent';
        }
        else { k = addDays(k, 1); continue; }
        out.push({ empId, name, day: k, met, status, lv: status === 'leave' ? getLeaveObj(S.leaves, empId, k) : null });
        k = addDays(k, 1);
      }
    });
    return out.sort((a, b) => b.day.localeCompare(a.day) || (a.name || '').localeCompare(b.name || '', 'ar'));
  }

  const dimOf = k => new Date(Date.UTC(+k.slice(0, 4), +k.slice(5, 7), 0)).getUTCDate();
  /* سياسة «نسيان الانصراف»: كسر اليوم المخصوم (0 = بلا خصم … 1 = يوم كامل) — تحددها الإدارة من الدوام والإعدادات ثم إعدادات المنشأة */
  const forgotAlerts = () => { try { return summary().filter(s => s.status === 'forgot'); } catch { return []; } };
  const forgotDed = () => { const v = S.set ? S.set.forgotDeductDays : null; const n = (v === undefined || v === null || v === '') ? 0 : +v; return isNaN(n) ? 0 : Math.min(1, Math.max(0, n)); };
  const forgotTxt = () => { const d = forgotDed(); return d === 0 ? 'بلا خصم تلقائي (يُدفع اليوم كاملاً حتى تُصحَّح البصمة)' : d >= 1 ? 'خصم يوم كامل' : `خصم ${d === 0.25 ? 'ربع' : d === 0.5 ? 'نصف' : d} يوم`; };
/* حساب الاستقطاعات القانونية الليبية (قانون 18/2023): ضمان 5.125% + تضامن 1% + ضريبة دخل مع الإعفاء العائلي + دمغة 0.5% */
  function calcLibyanStatutory(gross, familyStatus = 'single') {
    if (!(gross > 0)) return { inss: 0, solid: 0, incomeTax: 0, stamp: 0, total: 0, employerInss: 0 };
    const inss = gross * 0.05125;           // حصة الموظف في الضمان الاجتماعي 5.125%
    const solid = gross * 0.01;             // التضامن الاجتماعي 1%
    const employerInss = gross * 0.1125;    // حصة جهة العمل (للعلم في التقارير)
    const exemp = familyStatus === 'kids' ? 275 : familyStatus === 'married' ? 200 : 150;
    const taxable = Math.max(0, gross - inss - solid - exemp);
    const incomeTax = taxable <= 1000 ? taxable * 0.05 : (1000 * 0.05) + ((taxable - 1000) * 0.10);
    const prelimNet = Math.max(0, gross - inss - solid - incomeTax);
    const stamp = prelimNet * 0.005;        // ضريبة الدمغة 0.5%
    return { inss, solid, incomeTax, stamp, total: inss + solid + incomeTax + stamp, employerInss };
  }

  function payrollRows() {
    const agg = new Map();
    const blank = () => ({ net: 0, otMin: 0, otEq: 0, late: 0, early: 0, absent: 0, absentDays: [], daysWorked: 0, forgotDays: 0, forgotList: [], forgotPlan: 0, plMin: 0, plDays: 0, lv: [], lateK: 0, earlyK: 0, otK: 0 });
    summary().forEach(s => {
      const g = agg.get(s.empId) || blank();
      const dm = dimOf(s.day);
      if (s.status === 'work' || s.status === 'open') { g.net += s.met.net; g.otMin += s.met.otMin; g.otEq += (s.met.otEq || 0); g.otK += (s.met.otEq || 0) / dm; g.daysWorked++; }
      else if (s.status === 'forgot') { g.forgotDays++; g.forgotList.push(s.day); g.forgotPlan += (s.met.planned || 0); }
      else if (s.status === 'absent') { g.absent++; g.absentDays.push(s.day); }
      else if (s.status === 'leave' && s.lv) g.lv.push({ day: s.day, pct: leavePct(s.lv) / 100, plan: s.met.planned || 0 });
      g.late += s.met.late || 0; g.early += s.met.early || 0;
      g.lateK += (s.met.late || 0) / dm; g.earlyK += (s.met.early || 0) / dm;
      if ((s.status === 'work' || s.status === 'open' || s.status === 'absent') && s.met.planned > 0) { g.plMin += s.met.planned; g.plDays++; }
      agg.set(s.empId, g);
    });
    const emps = S.emps.filter(e => (e.empType === 'task' || ((e.payMode === 'monthly' || e.payMode === 'hourly') && (+e.payAmount || 0) > 0))
      && (e.active || (stopOf(e) && stopOf(e) > S.from)) && (!S.emp || e.id === S.emp));
    const FD = forgotDed();
    return emps.map(e => {
      const bankName = e.bankName || '', iban = e.iban || '', jobTitle = e.jobTitle || '', dept = e.dept || '', nationalId = e.nationalId || '';
      if (e.empType === 'task') {
        const rs = S.reqs.filter(r => r.kind === 'task' && r.status === 'approved' && r.empId === e.id && r.from >= S.from && r.from <= S.to);
        const base = rs.reduce((a, r) => a + (+r.amount || 0), 0), qty = rs.reduce((a, r) => a + (+(r.qtyApproved ?? r.qty) || 0), 0);
        return { empId: e.id, name: e.name, dept, jobTitle, nationalId, bankName, iban, pm: 'task', amt: 0, paidH: 0, otEq: 0, base, otPay: 0, allowBonus: 0, dedLate: 0, dedEarly: 0, dedAbs: 0, dedForgot: 0, dedLoan: 0, dedPen: 0, statDed: 0, statDetail: null, net: base, absent: 0, unpaidDays: 0, payDays: 0, lateMin: 0, earlyMin: 0, forgotDays: 0, taskQty: qty };
      }
      const g = agg.get(e.id) || blank();
      const pm = e.payMode, amt = +e.payAmount || 0;
      const regH = Math.max(0, g.net - g.otMin) / 60;
      let base = 0, otPay = 0, dedLate = 0, dedEarly = 0, dedAbs = 0, dedForgot = 0, payDays = 0, avgH = 8;
      if (pm === 'hourly') {
        const leavePay = g.lv.reduce((a, x) => a + (x.plan ? x.plan / 60 : 8) * amt * x.pct, 0);
        const forgotFull = (g.forgotPlan / 60) * amt;
        base = amt * regH + leavePay + forgotFull; otPay = amt * g.otEq;
        dedForgot = forgotFull * FD;
      } else {
        avgH = g.plDays ? Math.min(24, Math.max(1, g.plMin / g.plDays / 60)) : 8;
        const perHourUnit = amt / avgH;
        const from = (e.startDate && e.startDate > S.from) ? e.startDate : S.from;
        const stop = stopOf(e);
        const to = (stop && stop < S.to) ? stop : S.to;
        for (let k = from; k <= to; k = addDays(k, 1)) { base += amt / dimOf(k); payDays++; }
        const absDed = g.absentDays.reduce((a, dKey) => a + (amt / dimOf(dKey)), 0);
        const lvDed = g.lv.reduce((a, x) => a + (amt / dimOf(x.day)) * (1 - x.pct), 0);
        otPay = perHourUnit * g.otK;
        dedLate = perHourUnit * g.lateK / 60;
        dedEarly = perHourUnit * g.earlyK / 60;
        dedAbs = Math.min(base, absDed + lvDed);
        dedForgot = g.forgotList.reduce((a, dKey) => a + (amt / dimOf(dKey)), 0) * FD;
      }
      const allowBonus = (+e.allowance || 0) + (+e.bonus || 0);
      const dedPen = +e.penalty || 0;
      const dedLoan = (+e.loanTotal > 0 && +e.loanInst > 0) ? Math.min(+e.loanTotal, +e.loanInst) : 0;
      const grossAfterAtt = Math.max(0, base + otPay + allowBonus - dedLate - dedEarly - dedAbs - dedForgot);
      const statDetail = e.lyStatutory ? calcLibyanStatutory(grossAfterAtt, e.familyStatus) : null;
      const statDed = statDetail ? statDetail.total : 0;
      const paidH = regH;
      const net = Math.max(0, grossAfterAtt - statDed - dedPen - dedLoan);
      return { empId: e.id, name: e.name, dept, jobTitle, nationalId, bankName, iban, pm, amt, paidH, otEq: g.otEq, base, otPay, allowBonus, dedLate, dedEarly, dedAbs, dedForgot, dedLoan, dedPen, statDed, statDetail, net, absent: g.absent, unpaidDays: g.lv.filter(x => x.pct === 0).length, payDays, lateMin: g.late, earlyMin: g.early, forgotDays: g.forgotDays, taskQty: 0 };
    });
  }

      if (act === 'addHol') {
        const d = $('#hDay').value, n = $('#hName').value.trim();
        if (!d || !n) return toast('حدد تاريخ العطلة واسمها', 'err');
        await setDoc(doc(db, 'holidays', d), { date: d, name: n, createdAt: serverTimestamp() });
        await loadAll(); toast('أُضيفت العطلة الرسمية', 'good');
      }
      if (act === 'delHol') { if (confirm('حذف هذه العطلة؟')) { await deleteDoc(doc(db, 'holidays', id)); await loadAll(); } }
      if (act === 'saveSet') {
        const org = $('#sOrg').value.trim();
        const tz = parseInt($('#sTz').value, 10);
        const fgd = parseFloat($('#sForgot').value);
        await setDoc(doc(db, 'settings', 'general'), { orgName: org, tzOffset: isNaN(tz) ? TZ_OFFSET_MIN : tz, ...(isSuper() ? { forgotDeductDays: isNaN(fgd) ? 0 : Math.min(1, Math.max(0, fgd)) } : {}), empNotice: ($('#sNotice') ? $('#sNotice').value.trim().slice(0, 300) : ''), updatedAt: serverTimestamp() }, { merge: true });
        if (!isNaN(tz) && tz !== TZOFF) TZOFF = tz;
        await loadAll(); toast('حُفظت إعدادات المنشأة', 'good');
      }
      if (act === 'addAdmin') {
        const nm = ($('#aName') ? $('#aName').value.trim() : '');
        const em = ($('#aUid') ? $('#aUid').value.trim() : '');
        const pw = $('#aPw') ? $('#aPw').value : '';
        if (!nm) return toast('اكتب اسم المشرف', 'err');
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return toast('اكتب بريداً إلكترونياً صحيحاً', 'err');
        let key, note;
        if (pw && pw.length >= 6) {
          const tmp = initializeApp(firebaseConfig, 'adm-' + Date.now());
          try {
            const cred = await createUserWithEmailAndPassword(getAuth(tmp), em, pw);
            key = cred.user.uid; note = 'أُنشئ حساب المشرف وأُضيفت صلاحياته';
          } catch (e2) {
            if (e2 && e2.code === 'auth/email-already-in-use') { key = em.toLowerCase(); note = 'البريد مستخدم من قبل — أُضيفت الصلاحيات لحسابه الحالي'; }
            else throw e2;
          } finally {
            try { await signOut(getAuth(tmp)); } catch {}
            try { await deleteApp(tmp); } catch {}
          }
        } else {
          if (pw) return toast('كلمة المرور 6 أحرف على الأقل (أو اتركها فارغة لمنح صلاحيات لحساب موجود مسبقاً)', 'err');
          key = em.toLowerCase(); note = 'البريد موجود مسبقاً — أُضيفت الصلاحيات لحسابه';
        }
        const role = $('#aRole') ? $('#aRole').value : 'super_admin';
        const deptScope = $('#aDept') ? $('#aDept').value.trim() : '';
        if (!['super_admin', 'hr_admin', 'payroll_admin', 'manager', 'auditor'].includes(role)) return toast('الدور المحدد غير صالح', 'err');
        if (role === 'manager' && !deptScope) return toast('حدد قسمًا ثابتًا لمدير القسم؛ لا يمكن ترك النطاق فارغًا', 'err');
        await setDoc(doc(db, 'admins', key), { name: nm, email: em.toLowerCase(), role, ...(role === 'manager' ? { deptScope } : {}), addedAt: serverTimestamp() });
        await loadAll(); toast(note, 'good');
      }
      if (act === 'delAdmin') { if (confirm('إزالة صلاحيات هذا المشرف؟')) { await deleteDoc(doc(db, 'admins', id)); await loadAll(); } }
      if (act === 'v2Done') { localStorage.setItem('att_rules_v5', '1'); return render(); }
      if (act === 'appr' || act === 'rej') {
        const empId = b.dataset.e;
        const r = S.reqs.find(x => x.id === id && x.empId === empId);
        if (!r || r.status !== 'pending') return toast('هذا الطلب لم يعد معلّقاً — حدّث الصفحة', 'err');
        const st = act === 'appr' ? 'approved' : 'rejected';
        let warn = '', extra = {};
        if (act === 'appr' && r && r.kind === 'leave') {
          const c = empCtx(empId), lt = findLT(r), n = countLeaveDays(r.from, r.to, c.sc, c.rot, S.holKeys);
          if (!n) return toast('هذه الفترة لا تتضمن أي يوم دوام لهذا الموظف', 'err');
          const ded = lt ? !!lt.deduct : leaveDeducts(r);
          const ans = prompt(`نسبة الدفع لهذه الإجازة (${n} يوم عمل) من 0 إلى 100%\nالافتراضي حسب نوعها «${r.typeName || ''}»:`, String(lt ? +lt.pct : leavePct(r)));
          if (ans === null) return;
          const pct = parseFloat(ans);
          if (isNaN(pct) || pct < 0 || pct > 100) return toast('نسبة غير صحيحة (0–100)', 'err');
          extra = { payPct: pct, deduct: ded, workDays: n };
          if (ded) { const emp0 = S.emps.find(x => x.id === empId), yr = r.from.slice(0, 4), q = emp0 && emp0.leaveQuota != null ? emp0.leaveQuota : 21, u = annualUsed(empId, yr); if (u + n > q) warn += `\n\nتنبيه: الرصيد المتبقي ${q - u} يوم وهذا الطلب ${n} يوم عمل — يتجاوز الرصيد.`; }
          if (lt && +lt.cap > 0) { const yr = r.from.slice(0, 4), used = S.leaves.filter(l => l.empId === empId && (l.type === lt.id || l.typeName === lt.name)).reduce((a, l) => a + countLeaveDays(l.from, l.to, c.sc, c.rot, S.holKeys, yr), 0); if (used + n > +lt.cap) warn += `\n\nتنبيه: يتجاوز الحد السنوي لنوع «${lt.name}» (${lt.cap} يوم، المستهلك ${used}).`; }
          warn += `\n\nيُحتسب ${n} يوم عمل بنسبة دفع ${pct}%.`;
        }
        if (act === 'appr' && r && r.kind === 'task') {
          const tt = S.taskTypes.find(x => x.id === r.taskId), e0 = S.emps.find(x => x.id === empId) || {};
          let price = e0.taskPrices && e0.taskPrices[r.taskId] != null ? +e0.taskPrices[r.taskId] : (tt ? +tt.price : NaN);
          if (isNaN(price)) { const p = prompt('سعر الوحدة لهذه المهمة غير محدد (نوع محذوف) — اكتب السعر:'); if (p === null) return; price = parseFloat(p); if (isNaN(price) || price < 0) return toast('سعر غير صحيح', 'err'); }
          const qa = prompt(`الكمية المعتمدة (المطلوب ${r.qty}) — سعر الوحدة ${price}:`, String(r.qty));
          if (qa === null) return;
          const q = parseFloat(qa);
          if (isNaN(q) || q <= 0 || q > 1000) return toast('كمية غير صحيحة', 'err');
          extra = { qtyApproved: q, unitPrice: price, amount: Math.round(q * price * 100) / 100 };
          warn += `\n\nالمبلغ = ${q} × ${price} = ${extra.amount}`;
        }
        if (!confirm((act === 'appr' ? 'اعتماد هذا الطلب؟' : 'رفض هذا الطلب؟') + warn)) return;
        const batch = writeBatch(db);
        batch.update(doc(db, 'employees', empId, 'requests', id), { status: st, reviewedAt: serverTimestamp(), reviewedBy: (auth.currentUser && auth.currentUser.email) || '', ...extra });

        if (st === 'approved' && r && r.kind === 'fix') {
          const base = dayStart(r.from);
          const mkTime = (type, tstr) => { let m = hm(tstr); if (type === 'out' && r.fixIn && m <= hm(r.fixIn)) m += 1440; return Timestamp.fromDate(new Date(base.getTime() + m * 60000)); };
          const mkRec = type => ({ type, lat: 0, lng: 0, accuracy: 0, distance: 0, locationId: 'admin', locationName: 'تصحيح إداري (طلب معتمد)', empName: r.empName, deviceId: 'admin-fix' });
          let latestType = null, latestTs = null, latestId = null;
          if (r.fixIn) {
            const inRef = doc(collection(db, 'employees', empId, 'records'));
            const inTs = mkTime('in', r.fixIn);
            batch.set(inRef, { ...mkRec('in'), time: inTs });
            latestType = 'in'; latestTs = inTs; latestId = inRef.id;
          }
          if (r.fixOut) {
            const outRef = doc(collection(db, 'employees', empId, 'records'));
            const outTs = mkTime('out', r.fixOut);
            batch.set(outRef, { ...mkRec('out'), time: outTs });
            latestType = 'out'; latestTs = outTs; latestId = outRef.id;
          }
          const empDoc = S.emps.find(x => x.id === empId);
          const prevLastMs = empDoc && empDoc.lastAt && empDoc.lastAt.toMillis ? empDoc.lastAt.toMillis() : 0;
          if (latestTs && latestTs.toMillis() >= prevLastMs) {
            batch.update(doc(db, 'employees', empId), { state: latestType, lastAt: latestTs, lastRecId: latestId });
          }
        }
        if (st === 'approved' && r && r.kind === 'loan') {
          const empDoc = S.emps.find(x => x.id === empId) || {};
          const addAmt = parseFloat(r.type) || 0, newInst = parseFloat(r.typeName) || (+empDoc.loanInst || 0);
          batch.update(doc(db, 'employees', empId), { loanTotal: (+empDoc.loanTotal || 0) + addAmt, loanInst: newInst });
        }
        await batch.commit();
        await loadAll(); toast(st === 'approved' ? 'تم اعتماد الطلب' : 'تم رفض الطلب', 'good');
        if (st === 'approved' && r && r.kind === 'cert') {
          setTimeout(() => printCertificate(S.emps.find(x => x.id === empId)), 300);
        }
      }
      if (act === 'ltEdit') return leaveTypesEditor();
      if (act === 'addTask') {
        const name = $('#tkName').value.trim(), price = parseFloat($('#tkPrice').value);
        if (!name || isNaN(price) || price < 0) return toast('اكتب اسم المهمة وسعرها', 'err');
        await addDoc(collection(db, 'taskTypes'), { name: name.slice(0, 80), price, active: true, createdAt: serverTimestamp() });
        await loadAll(); toast('أُضيفت المهمة للكتالوج', 'good');
      }
      if (act === 'editTask') {
        const x = S.taskTypes.find(v => v.id === id); if (!x) return;
        const n = prompt('اسم المهمة:', x.name); if (n === null) return;
        const p = prompt('سعر الوحدة:', String(x.price)); if (p === null) return;
        const pv = parseFloat(p); if (!n.trim() || isNaN(pv) || pv < 0) return toast('بيانات غير صحيحة', 'err');
        await updateDoc(doc(db, 'taskTypes', id), { name: n.trim().slice(0, 80), price: pv });
        await loadAll(); toast('تم التحديث — الأسعار المعتمدة سابقاً لا تتغيّر', 'good');
      }
      if (act === 'toggleTask') { const x = S.taskTypes.find(v => v.id === id); await updateDoc(doc(db, 'taskTypes', id), { active: x.active === false }); await loadAll(); }
      if (act === 'delTask') { if (confirm('حذف هذه المهمة من الكتالوج؟ تبقى مهامها المعتمدة سابقاً محفوظة.')) { await deleteDoc(doc(db, 'taskTypes', id)); await loadAll(); } }
      if (act === 'filter') {
        const f = $('#fFrom').value, t = $('#fTo').value;
        if (!f || !t || t < f) return toast('حدد فترة صحيحة', 'err');
        if ((dayStart(t) - dayStart(f)) / 86400000 > 92) return toast('الحد الأقصى للفترة 3 أشهر', 'err');
        S.from = f; S.to = t; S.emp = $('#fEmp').value; _sumC = null; await loadRecs(); _sumC = null; render();
      }
      if (act === 'csv') {
        const rows = [['الموظف', 'التاريخ', 'الحالة', 'أول حضور', 'آخر انصراف', 'متأخر (د)', 'مبكر (د)', 'صافي العمل (د)', 'إضافي (ساعات مكافئة)']];
        summary().forEach(s => rows.push([
          s.name, s.day,
          stText(s, ST_TXT),
          s.met.firstIn ? fmtTime(s.met.firstIn, true) : '',
          s.met.lastOut ? fmtTime(s.met.lastOut, true) : '',
          s.met.late || 0, s.met.early || 0, Math.round(s.met.net),
          s.met.otEq ? +s.met.otEq.toFixed(2) : 0
        ]));
        const csv = '\ufeff' + rows.map(r => r.map(c => { const s = String(c ?? ''); const safe = /^[=+\-@\t\r]/.test(s) ? "'" + s : s; return `"${safe.replace(/"/g, '""')}"`; }).join(',')).join('\n');
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = `meqat_summary_${S.from}_${S.to}.csv`; a.click();
      }
    } catch (err) { console.error(err); toast('حدث خطأ — تحقق من الاتصال وصلاحيات Firestore', 'err'); }
  };

  clearInterval(window.__meqatTick);
  // مؤقّت محلي خفيف: لا يقرأ من Firebase. يُحدّث الحالات المعتمدة على الوقت (متأخر/نسي الانصراف/مدة العمل) ويتحقق من تغيّر اليوم.
  window.__meqatTick = setInterval(async () => {
    if (!auth.currentUser) { stopTodayFeed(); return; }
    if (S.todayKey && dayKey(new Date()) !== S.todayKey) { try { await startTodayFeed(); } catch (e) { console.warn(e); } }
    if (S.tab !== 'today' || document.hidden || document.querySelector('.ov') || !$('#content')) return;
    viewToday($('#content'));
  }, 60000);
  loadAll();
}
</script>
</body>
</html>
