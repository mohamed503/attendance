<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E6B4D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ميقات">
<title>مِيقَاتْ | نظام الحضور والانصراف</title>
<meta name="description" content="نظام متكامل لإدارة الحضور والانصراف والورديات والإجازات ومسير الرواتب الآلي عبر إحداثيات GPS.">
<meta property="og:title" content="مِيقَاتْ | نظام الحضور والانصراف">
<meta property="og:description" content="نظام متكامل لإدارة الحضور والانصراف والورديات والإجازات ومسير الرواتب الآلي عبر إحداثيات GPS.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rubik:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#EAF4EE;--card:#ffffff;--surface:#F2F8F4;--ink:#0E2A20;--mute:#587265;--line:#D3E5DA;
--pri:#0E6B4D;--pri-d:#0A5139;--pri-l:#D3EBDD;--pri-t:#0E6B4D;--navy:#0E2A20;--on:#fff;
--mint:#BDE96B;--mint-ink:#1E3A07;--sun:#F7C948;--sun-ink:#3A2A05;--coral:#FF7352;--coral-ink:#3D1005;
--ok:#0E6B4D;--bad:#C23B1B;--warn:#8A6100;
--grad:linear-gradient(135deg,#12865A 0%,#0E6B4D 55%,#0A4A35 100%);--sh:0 4px 16px rgba(6,60,40,.07);--sh-lg:0 14px 40px rgba(6,60,40,.12);--th-bg:#F2F8F4;--tr-hover:#F2F8F4;--inp-bg:#F2F8F4;color-scheme:light;
}
[data-theme="dark"]{
--bg:#07140E;--card:#10241A;--surface:#0A1B13;--ink:#E9F6EE;--mute:#8FB0A0;--line:#1B3A2B;
--pri:#17935F;--pri-d:#12865A;--pri-l:#143A2B;--pri-t:#5FDBA3;--navy:#E9F6EE;
--mint:#C6F27A;--sun:#FFD35C;--coral:#FF8463;--ok:#C6F27A;--bad:#FF8463;--warn:#FFD35C;
--sh:0 4px 16px rgba(0,0,0,.28);--sh-lg:0 14px 40px rgba(0,0,0,.4);--th-bg:#0A1B13;--tr-hover:#143A2B;--inp-bg:#0A1B13;color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Cairo","Tajawal","Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif;font-size:15px;line-height:1.65;transition:background-color .25s,color .25s}
button,input,select,textarea{font:inherit}
.ic{flex:none;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(0,0,0,.1))}

/* ---------- الهيدر ---------- */
.top{background:var(--grad);color:#fff;padding:22px 20px 64px;border-radius:0 0 34px 34px;position:relative;overflow:hidden;box-shadow:0 8px 28px rgba(6,60,40,.2)}
.top::before,.top::after{content:"";position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 70%);pointer-events:none}
.top::before{width:320px;height:320px;top:-140px;left:-80px}
.top::after{width:260px;height:260px;bottom:-120px;right:18%}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:14px}
.brand b{display:block;font-size:24px;font-weight:900;line-height:1.25;letter-spacing:-.3px}
.brand small{opacity:.85;font-size:13px;font-weight:500}
.logo{width:50px;height:50px;border-radius:16px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);display:grid;place-items:center;backdrop-filter:blur(8px);color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.logo.big{width:82px;height:82px;border-radius:26px;background:var(--grad);border:0;box-shadow:0 12px 30px rgba(14,107,77,.38);margin:0 auto 14px}
.top-act{display:flex;gap:10px;align-items:center}
.ib{width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px);transition:transform .15s,background .2s}
.ib:hover{background:rgba(255,255,255,.26);transform:translateY(-2px)}
.ib:active{transform:scale(.95)}

.wrap{max-width:1180px;margin:0 auto;padding:0 18px 32px}

/* ---------- التبويبات الرئيسية والفرعية ---------- */
.tabs{display:flex;gap:6px;background:var(--card);padding:8px;border-radius:22px;box-shadow:var(--sh-lg);border:1px solid var(--line);margin:-38px 0 22px;position:relative;z-index:2;overflow-x:auto}
.tab{display:flex;align-items:center;gap:10px;padding:11px 20px;border-radius:15px;border:0;background:transparent;color:var(--mute);font-weight:800;font-size:14.5px;cursor:pointer;white-space:nowrap;transition:all .2s}
.tab:hover{background:var(--pri-l);color:var(--pri-d)}
.tab.on{background:var(--grad);color:#fff;box-shadow:0 6px 18px rgba(14,107,77,.32)}

.subtabs{display:inline-flex;gap:6px;background:var(--surface);padding:6px;border-radius:16px;border:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.stab{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:12px;border:0;background:transparent;color:var(--mute);font-weight:700;font-size:13.5px;cursor:pointer;transition:all .18s}
.stab:hover{color:var(--ink)}
.stab.on{background:var(--card);color:var(--pri);box-shadow:var(--sh);font-weight:800}

/* ---------- البطاقات والحاويات ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:var(--sh);transition:background-color .25s,border-color .25s}
h1,h2,h3{margin:0 0 12px}
h1{font-size:23px;font-weight:900}h2{font-size:19px;font-weight:800}h3{font-size:17px;font-weight:800;margin:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.ch-l{display:flex;align-items:center;gap:12px}
.chi{width:42px;height:42px;border-radius:14px;background:var(--pri-l);display:grid;place-items:center;flex:none}
.muted{color:var(--mute)}.center{text-align:center}

/* ---------- شريط الأدوات والبحث ---------- */
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.search-box{position:relative;flex:1;min-width:220px;max-width:340px}
.search-box input{padding-right:40px;border-radius:14px;background:var(--surface);border-color:var(--line)}
.search-box .s-ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.75}

/* ---------- الأزرار والحقول ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;background:var(--grad);color:#fff;padding:11px 20px;border-radius:14px;cursor:pointer;font-weight:800;font-size:14.5px;box-shadow:0 4px 14px rgba(14,107,77,.26);transition:transform .1s,filter .2s,box-shadow .2s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;transform:none}
.btn.sec{background:var(--pri-l);color:var(--pri);box-shadow:none;border:1px solid transparent}
.btn.sec:hover{border-color:var(--pri)}
.btn.ok{background:linear-gradient(135deg,#059669,#10b981);box-shadow:0 4px 14px rgba(16,185,129,.28)}
.btn.bad{background:linear-gradient(135deg,#dc2626,#ef4444);box-shadow:0 4px 14px rgba(239,68,68,.26)}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:11px;gap:6px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:6px;flex:1;min-width:160px}
.field label{font-size:13px;color:var(--mute);font-weight:700}
input,select,textarea{border:1.5px solid var(--line);border-radius:13px;padding:11px 14px;background:var(--inp-bg);color:var(--ink);width:100%;transition:border-color .2s,box-shadow .2s,background .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pri);background:var(--card);box-shadow:0 0 0 4px rgba(14,107,77,.15)}

/* ---------- الجداول الاحترافية ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:18px;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:13px 16px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--th-bg);color:var(--navy);font-weight:800;font-size:13px;letter-spacing:.1px}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background-color .15s}
tbody tr:hover td{background:var(--tr-hover)}
tfoot td{background:var(--th-bg);font-weight:900;border-top:2px solid var(--line)}
.who{display:flex;align-items:center;gap:12px;font-weight:800}
.av{width:40px;height:40px;border-radius:14px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px;flex:none;box-shadow:0 4px 10px rgba(14,107,77,.22)}
.av.lg{width:64px;height:64px;border-radius:22px;font-size:26px;border:2px solid rgba(255,255,255,.5);background:rgba(255,255,255,.18);backdrop-filter:blur(6px)}
.acts{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:10px;font-size:12.5px;font-weight:800}
.b-ok{background:rgba(16,185,129,.14);color:#10b981}.b-bad{background:rgba(239,68,68,.14);color:#ef4444}.b-warn{background:rgba(245,158,11,.15);color:#f59e0b}.b-mute{background:var(--surface);color:var(--mute);border:1px solid var(--line)}.b-pri{background:var(--pri-l);color:var(--pri)}

/* ---------- قائمة إجراءات الموظف المنسدلة (بدون زحمة) ---------- */
.act-menu{position:relative;display:inline-block}
.act-menu summary{list-style:none;cursor:pointer;padding:7px 12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:5px;user-select:none}
.act-menu summary::-webkit-details-marker{display:none}
.act-menu summary:hover{border-color:var(--pri);color:var(--pri)}
.act-drop{position:absolute;left:0;top:calc(100% + 6px);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:var(--sh-lg);z-index:40;min-width:185px;display:flex;flex-direction:column;gap:3px}
.act-drop button{width:100%;justify-content:flex-start;background:transparent;color:var(--ink);box-shadow:none;padding:9px 12px;border-radius:11px;font-size:13.5px;font-weight:700}
.act-drop button:hover{background:var(--pri-l);color:var(--pri);transform:none}
.act-drop button.bad-txt{color:var(--bad)}
.act-drop button.bad-txt:hover{background:rgba(239,68,68,.12)}

/* ---------- الإحصائيات ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:14px;margin-bottom:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;align-items:center;gap:15px;box-shadow:var(--sh);transition:transform .2s,box-shadow .2s}
.stat:hover{transform:translateY(-3px);box-shadow:var(--sh-lg)}
.stat b{display:block;font-size:30px;line-height:1.1;font-weight:900;color:var(--ink)}
.stat span{color:var(--mute);font-size:13px;font-weight:700}
.st-ic{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;flex:none;background:var(--surface);border:1px solid var(--line)}

/* ---------- تنبيهات ---------- */
.notice{border:1px solid rgba(245,158,11,.4);background:rgba(245,158,11,.1);border-radius:18px;padding:14px 18px;margin-bottom:16px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:13px 24px;border-radius:16px;z-index:120;max-width:90vw;box-shadow:0 12px 32px rgba(0,0,0,.35);font-weight:700;border:1px solid rgba(255,255,255,.1)}
.toast.err{background:#dc2626}.toast.good{background:#059669}

/* ---------- الدخول ---------- */
.auth-bg{min-height:100vh;background:var(--grad);display:grid;place-items:center;padding:20px;position:relative;overflow:hidden}
.auth-bg::before,.auth-bg::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.07)}
.auth-bg::before{width:420px;height:420px;top:-180px;right:-120px}
.auth-bg::after{width:340px;height:340px;bottom:-150px;left:-90px}
.login{width:100%;max-width:410px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:34px 28px;box-shadow:0 28px 70px rgba(6,21,15,.45);position:relative;z-index:1}
.login h1{font-size:30px;margin-bottom:2px;line-height:1.4;color:var(--ink)}
.mk{display:block}

/* ---------- واجهة الموظف المطوّرة ---------- */
.emp-bg{min-height:100vh;background:var(--grad) top/100% 320px no-repeat,var(--bg)}
.emp-wrap{max-width:480px;margin:0 auto;padding:20px 16px 36px}
.emp-brand{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff;font-weight:900;font-size:20px;margin-bottom:18px}
.emp-brand-l{display:flex;align-items:center;gap:10px}
.emp-head{display:flex;align-items:center;gap:16px;color:#fff;margin-bottom:20px;background:rgba(255,255,255,.1);padding:14px 16px;border-radius:22px;border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(8px)}
.emp-head small{opacity:.9;font-size:13px;font-weight:600;display:block;margin-bottom:2px}
.emp-head h1{margin:0;font-size:22px;font-weight:900}
.clockcard{text-align:center;padding:26px 20px;border-radius:28px;box-shadow:var(--sh-lg);position:relative;overflow:hidden}
.clock{font-size:50px;font-weight:900;letter-spacing:1.5px;direction:ltr;color:var(--ink);line-height:1.1;margin:8px 0 4px;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--pri-t);font-weight:800;background:var(--pri-l);padding:4px 12px;border-radius:99px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--pri-t);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(16,185,129,.55)}100%{box-shadow:0 0 0 10px rgba(16,185,129,0)}}
.punch{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}
.pbtn{border:0;border-radius:26px;padding:24px 12px;color:#fff;font-weight:900;font-size:17.5px;display:flex;flex-direction:column;align-items:center;gap:12px;cursor:pointer;transition:transform .14s,box-shadow .2s;position:relative;overflow:hidden}
.pbtn:hover:not(:disabled){transform:translateY(-3px)}
.pbtn:active:not(:disabled){transform:scale(.96)}
.pbtn .pc{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;box-shadow:inset 0 2px 4px rgba(255,255,255,.3)}
.pbtn.in{background:linear-gradient(145deg,#0A5139 0%,#0E6B4D 55%,#17935F 100%);box-shadow:0 12px 26px rgba(14,107,77,.38)}
.pbtn.out{background:linear-gradient(145deg,#E5573A 0%,#FF7352 60%,#FF9478 100%);box-shadow:0 12px 26px rgba(255,115,82,.38)}
.pbtn:disabled{opacity:.38;box-shadow:none;cursor:not-allowed;filter:grayscale(.25)}
.status{padding:14px 16px;border-radius:18px;background:var(--pri-l);color:var(--pri-d);text-align:center;min-height:50px;margin-bottom:16px;font-weight:700;display:flex;align-items:center;justify-content:center;border:1px solid rgba(14,107,77,.2)}
.status.err{background:rgba(239,68,68,.14);color:var(--bad);border-color:rgba(239,68,68,.3)}.status.good{background:rgba(16,185,129,.14);color:var(--ok);border-color:rgba(16,185,129,.3)}

pre.rules{background:#0b1329;color:#dbeafe;padding:16px;border-radius:16px;overflow:auto;direction:ltr;text-align:left;font-size:12.5px;max-height:340px;border:1px solid #1e293b}
ol li{margin-bottom:8px}
a{color:var(--pri)}

/* ---------- نوافذ ---------- */
.ov{position:fixed;inset:0;background:rgba(7,16,34,.62);z-index:100;display:grid;place-items:center;padding:16px;backdrop-filter:blur(4px)}
.modal{background:var(--card);border:1px solid var(--line);border-radius:26px;width:100%;max-width:740px;max-height:92vh;display:flex;flex-direction:column;box-shadow:var(--sh-lg)}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 22px;border-bottom:1px solid var(--line)}
.mh h3{margin:0;font-size:18px}
.mb{padding:20px 22px;overflow-y:auto;flex:1}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 22px;border-top:1px solid var(--line);background:var(--surface);border-radius:0 0 26px 26px}
.ib.dark{background:var(--pri-l);color:var(--pri);border-color:transparent;width:38px;height:38px}
.ib.dark:hover{background:var(--pri);color:#fff}
.sec-t{font-weight:900;color:var(--navy);margin:22px 0 10px;display:flex;align-items:center;gap:9px;font-size:15.5px}
.hint{font-size:13px;color:var(--mute);margin:4px 0 12px;line-height:1.6}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.drow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-bottom:1px dashed var(--line)}
.drow:last-child{border-bottom:0}
.dn{width:98px;font-weight:800;display:flex;align-items:center;gap:8px;flex:none}
.dn input{width:auto}
.tin{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.tin input{width:auto;min-width:116px;padding:8px 10px}
.num{width:100px!important}
.sc{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:12px;background:var(--pri-l);color:var(--pri);font-weight:800;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .15s}
.chip:hover{border-color:var(--pri);transform:translateY(-1px)}
.srow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.srow .nm{flex:1;min-width:120px}
.srow input[type=time]{width:auto;min-width:116px;padding:8px}
.cyc{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.cyc label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px;font-weight:700}
.plan{display:inline-flex;align-items:center;gap:8px;background:var(--pri-l);color:var(--pri);padding:6px 14px;border-radius:12px;font-weight:800;font-size:13.5px;margin-top:10px}
.sch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.sch{border:1px solid var(--line);border-radius:20px;padding:18px;background:var(--card);box-shadow:var(--sh);display:flex;flex-direction:column;justify-content:space-between;gap:12px}
.sch h4{margin:0 0 6px;font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800}
.sch p{margin:0;color:var(--mute);font-size:13.5px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chk input{width:auto}

/* ---------- طي البطاقات الفرعية ---------- */
details.fold{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:16px 20px;margin-bottom:18px;box-shadow:var(--sh)}
details.fold summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;font-weight:800;font-size:16px;user-select:none}
details.fold summary::-webkit-details-marker{display:none}
details.fold[open] summary{margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--line)}

/* ---------- شريط الاتصال وتثبيت التطبيق ---------- */
.off-bar{position:fixed;top:0;left:0;right:0;background:var(--warn);color:#fff;text-align:center;font-size:12.5px;font-weight:800;padding:6px 12px;z-index:110;display:none}
.pwa-btn{display:none;align-items:center;gap:6px;padding:7px 13px;border-radius:12px;border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.16);color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;backdrop-filter:blur(6px)}
.pwa-btn:hover{background:rgba(255,255,255,.28)}

@media (max-width:760px){
  .ov{padding:0;place-items:end stretch}
  .modal{max-width:none;max-height:94vh;border-radius:26px 26px 0 0}
  .mf{border-radius:0;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .top{padding:16px 14px 52px;border-radius:0 0 28px 28px}

  match /databases/{database}/documents {
    // المالك المعرّف عند توليد القواعد يبقى super_admin لاستعادة الوصول.
    function isOwnerEmail() {
      return request.auth != null && request.auth.token.get('email', '') == '${email}';
    }
    function uidAdminPath() {
      return /databases/$(database)/documents/admins/$(request.auth.uid);
    }
    function emailAdminPath() {
      return /databases/$(database)/documents/admins/$(request.auth.token.email);
    }
    function currentAdminData() {
      let up = uidAdminPath();
      let ep = emailAdminPath();
      return exists(up) ? get(up).data
        : (request.auth.token.get('email_verified', false) == true && exists(ep) ? get(ep).data : {});
    }
    // لا يُمنح أي دور افتراضيًا لمجرد وجود حساب Firebase؛ الوثيقة المفقودة = رفض.
    // الوثائق القديمة التي لا تحتوي role تُعامل كمدقق للقراءة فقط، لا كمدير عام.

      let up = uidAdminPath();
      let ep = emailAdminPath();

        (isOwnerEmail() && wanted == 'super_admin')
        || (exists(up) && get(up).data.get('role', 'auditor') == wanted)
        || (request.auth.token.get('email_verified', false) == true
            && exists(ep) && get(ep).data.get('role', 'auditor') == wanted)

    }
    function isSuperAdmin() { return roleIs('super_admin'); }
    function isHrAdmin() { return roleIs('hr_admin'); }
    function isPayrollAdmin() { return roleIs('payroll_admin'); }
    function isManager() { return roleIs('manager'); }
    function isAuditor() { return roleIs('auditor'); }
    function isAdmin() {
      return isSuperAdmin() || isHrAdmin() || isPayrollAdmin() || isManager() || isAuditor();
    }
    function managerScope() {

        && (d.get('uid', null) == request.auth.uid

        && d.role in ['super_admin', 'hr_admin', 'payroll_admin', 'manager', 'auditor']

          && d.keys().hasAll(['name','active','empType'])
          && d.name is string && d.name.size() > 0 && d.name.size() <= 100
          && d.active == true && d.empType in ['staff', 'task']
          && d.get('deviceId', null) == null

          && n.get('rebindProof', null) == resource.data.get('deviceId', null)

      }

  if (schedRaw) sched = normSched(schedRaw);

  let offset = 0, skewWarn = false;

  let last = null;

  /* سجل آخر 15 عملية: يُحفظ في الجهاز ولا يُعاد جلبه إلا إذا تغيّرت آخر عملية (lastRecId) أو مضى يوم.

    const n = now();
    const forgotLim = Math.min(FORGOT_MS, forgotMsOf(sched));

    const maxOutSpan = Math.max(forgotMsOf(sched) * 2, 36 * 3600e3);
    const canOut = !!(last && last.type === 'in' && (n - last.t) <= maxOutSpan);
    $('#bIn').disabled = !canIn; $('#bOut').disabled = !canOut;
    $('#state').innerHTML = last ? (last.type === 'in' ? `<span class="badge b-ok">${ic('check', 16)} أنت حاضر منذ ${fmtTime(last.t)}</span>` : `<span class="badge b-mute">آخر انصراف ${fmtTime(last.t)}</span>`) : '';
    const box = $('#myMonthBox');
    if (box) {
      try {
        const { rows: allRows, mk, capped } = await loadMonth(!!opt.force);
        const ses = pairSessions(allRows, forgotLim);
        const daysSet = new Set(ses.map(x => dayKey(x.start)).filter(k => k.startsWith(mk)));
        let totalMin = 0, lateDays = 0;
        daysSet.forEach(k => {
          const met = calcDay(sched, k, ses, hols, emp.rotOffset || 0, { nowMs: now().getTime(), cap: forgotLim });
          totalMin += met.net;
          if (met.late > 0) lateDays++;
        });
        const dCount = daysSet.size;
        const onTimePct = dCount ? Math.round(((dCount - lateDays) / dCount) * 100) : 100;
        const salInfo = (emp.payMode === 'monthly' && emp.payAmount > 0)
          ? `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px">الراتب الأساسي: <b>${emp.payAmount} د.ل</b>${emp.allowance ? ` + علاوات <b>${emp.allowance} د.ل</b>` : ''}${emp.loanTotal > 0 ? ` · متبقي سلفة: <b class="badge b-warn">${emp.loanTotal} د.ل</b>` : ''}</div>`
          : (emp.payMode === 'hourly' && emp.payAmount > 0)
          ? `<div style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:13.5px">المستحق التقديري للشهر: <b>${((totalMin / 60) * emp.payAmount).toFixed(1)} د.ل</b> (${emp.payAmount} د.ل/ساعة)</div>` : '';
        box.innerHTML = `<div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between">
          <span>أيام الحضور هذا الشهر: <b>${dCount}</b></span>
          <span>صافي الساعات: <b>${fmtDur(totalMin * 60000)}</b></span>
          <span>نسبة الانضباط: <b class="badge ${onTimePct >= 90 ? 'b-ok' : 'b-warn'}">${onTimePct}%</b></span>
        </div>${salInfo}${capped ? '<div class="muted" style="margin-top:6px;font-size:12px">عدد تسجيلات الشهر كبير؛ الملخص قد يكون ناقصًا.</div>' : ''}`;
      } catch (err) { console.warn(err); box.textContent = 'تعذر تحميل ملخص الشهر. تحقق من الاتصال.'; }
    }
  }

  const setMsg = (t, c = '') => { const m = $('#msg'); if (m) { m.className = 'status ' + c; m.textContent = t; } };
  const getPos = () => new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 25000, maximumAge: 0 }));

  async function punch(type) {
    if (!navigator.onLine) return setMsg('لا يوجد اتصال بالإنترنت. لا تُسجَّل البصمة دون اتصال — أعد المحاولة عند عودة الشبكة.', 'err');
    if (!navigator.geolocation) return setMsg('متصفحك لا يدعم تحديد الموقع.', 'err');
    if (!locs.length) return setMsg('لم تحدد الإدارة أي موقع عمل بعد.', 'err');
    try {
      const pendTs = +sessionStorage.getItem(inflightKey) || 0;
      if (Date.now() - pendTs < 25000) return setMsg('توجد عملية تسجيل قيد الإرسال حالياً — انتظر ثوانٍ ولا تُعد الضغط.', 'err');
    } catch {}
    if (last && now() - last.t < MIN_GAP_MS) return setMsg('تم تسجيلك للتو، انتظر لحظات ثم أعد المحاولة.', 'err');
    $('#bIn').disabled = $('#bOut').disabled = true;
    setMsg('جاري تحديد موقعك… (قد يستغرق بضع ثوانٍ)');
    let pos;
    try { pos = await getPos(); }
    catch (e) {
      setMsg(e.code === 1 ? 'تم رفض إذن الموقع. فعّل الإذن من إعدادات المتصفح ثم أعد المحاولة.' : 'تعذر تحديد موقعك. فعّل GPS وتأكد من الاتصال ثم أعد المحاولة.', 'err');
      return loadHist();
    }
    const { latitude: lat, longitude: lng, accuracy } = pos.coords;
    if (accuracy > MAX_ACCURACY) { setMsg(`دقة الموقع ضعيفة (±${Math.round(accuracy)}م). فعّل GPS أو انتقل لمكان مفتوح وأعد المحاولة.`, 'err'); return loadHist(); }
    let best = null;
    for (const l of locs) { const d = dist(lat, lng, l.lat, l.lng); if (!best || d < best.d) best = { l, d }; }
    if (best.d > best.l.radius) { setMsg(`أنت خارج نطاق العمل. تبعد حوالي ${Math.round(best.d)} متر عن «${best.l.name}» (المسموح ${best.l.radius}م). لم يتم التسجيل.`, 'err'); return loadHist(); }
    let recRef = null, punched = null;
    try {
      try { sessionStorage.setItem(inflightKey, String(Date.now())); } catch {}
      const devToUse = emp.deviceId || myDev;
      recRef = doc(collection(db, 'employees', token, 'records'));
      const batch = writeBatch(db);
      batch.set(recRef, { type, time: serverTimestamp(), lat, lng, accuracy: Math.round(accuracy), distance: Math.round(best.d), locationId: best.l.id, locationName: best.l.name, empName: emp.name, deviceId: devToUse });
      batch.update(ref, { state: type, lastAt: serverTimestamp(), lastRecId: recRef.id });
      const done = batch.commit();
      const first = await Promise.race([done.then(() => 'ok'), new Promise(r => setTimeout(() => r('slow'), 15000))]);
      if (first === 'slow') {
        setMsg('الشبكة بطيئة: التسجيل قيد الإرسال. لا تُعد الضغط — سيظهر في «آخر تسجيلاتك» فور وصوله.');
        done.then(() => { try { sessionStorage.removeItem(inflightKey); } catch {} setMsg('وصل التسجيل إلى الخادم', 'good'); histRid = recRef.id; emp.lastRecId = recRef.id; loadHist({ force: true }); }).catch(() => { try { sessionStorage.removeItem(inflightKey); } catch {} setMsg('تعذر حفظ التسجيل. تحقق من الاتصال وأعد المحاولة.', 'err'); loadHist(); });
        return;
      }
      try { sessionStorage.removeItem(inflightKey); } catch {}
      setMsg(type === 'in' ? `تم تسجيل حضورك في «${best.l.name}»` : `تم تسجيل انصرافك من «${best.l.name}»`, 'good');
      histRid = recRef.id; emp.lastRecId = recRef.id; punched = { type, t: now(), locationName: best.l.name };
    } catch (e) {
      try { sessionStorage.removeItem(inflightKey); } catch {}
      setMsg(e.code === 'permission-denied' ? 'رفض الخادم التسجيل: تأكد أنك داخل نطاق العمل وأن آخر عملية لم تُسجَّل للتو، ثم أعد المحاولة.' : 'تعذر حفظ التسجيل. تحقق من الاتصال وحاول مجدداً.', 'err');
    }
    loadHist(punched ? { add: punched } : {});
  }

  /* ---------- طلبات الموظف: إجازة وتصحيح ---------- */
  const rqFormEl = $('#rqForm');
  const myLeaves = { list: [] };
  async function refreshMyLeaves() {
    try { const s = await getDocs(query(collection(db, 'employees', token, 'requests'), where('kind', '==', 'leave'))); myLeaves.list = s.docs.map(d => d.data()); } catch {}
    return myLeaves.list;
  }
  const annualLeft = () => { const yr = dayKey(now()).slice(0, 4), q = emp.leaveQuota ?? 21; const used = myLeaves.list.filter(r => r.status === 'approved' && leaveDeducts(r)).reduce((a, r) => a + countLeaveDays(r.from, r.to, sched, emp.rotOffset || 0, hols, yr), 0); return { q, used, rem: q - used, yr }; };
  const cntWork = (from, to) => (from && to && to >= from ? countLeaveDays(from, to, sched, emp.rotOffset || 0, hols) : 0);
  const showBal = () => { const b = $('#rqBal'); if (!b) return; const x = annualLeft(); b.style.display = 'block'; b.innerHTML = `${ic('sun', 18)} رصيد الإجازات ${x.yr} (أيام عمل): المتبقي <b>${x.rem} يوم</b> (المستهلك ${x.used} من ${x.q})`; };
  function showRqForm(kind) {
    rqFormEl.innerHTML = kind === 'leave' ? `
      <div class="g2" style="margin-top:12px;padding:14px;background:var(--surface);border-radius:16px;border:1px solid var(--line)">
        <div id="rqBal" class="field" style="grid-column:1/-1;background:var(--pri-l);padding:10px 14px;border-radius:12px;font-size:13px;display:none"></div>
        <div class="field"><label>نوع الإجازة</label><select id="rqType">${LT.map(x => `<option value="${esc(x.id)}">${esc(x.name)}${+x.pct < 100 ? ` (تُدفع ${+x.pct}% من الأجر)` : ''}</option>`).join('')}</select></div>
        <div class="field"><label>من تاريخ</label><input type="date" id="rqFrom"></div>
        <div class="field"><label>إلى تاريخ</label><input type="date" id="rqTo"></div>
        <div id="rqCnt" class="hint" style="grid-column:1/-1;margin:0"></div>
        <div class="field" style="grid-column:1/-1"><label>ملاحظة (اختياري)</label><input id="rqNote" maxlength="300"></div>
        <div style="grid-column:1/-1;display:flex;gap:8px"><button class="btn" id="rqSend" style="flex:1">إرسال الطلب للإدارة</button><button class="btn sec" id="rqCancel">إغلاق</button></div>
      </div>` : `
      <div class="g2" style="margin-top:12px;padding:14px;background:var(--surface);border-radius:16px;border:1px solid var(--line)">
        <div class="field"><label>يوم النسيان</label><input type="date" id="rqDay" max="${dayKey(now())}"></div>
        <div class="field"><label>وقت حضور</label><input type="time" id="rqIn"></div>
        <div class="field"><label>وقت انصراف</label><input type="time" id="rqOut"></div>
        <div class="field" style="grid-column:1/-1"><label>سبب النسيان / ملاحظة</label><input id="rqNote" maxlength="300"></div>
        <div style="grid-column:1/-1;display:flex;gap:8px"><button class="btn" id="rqSend" style="flex:1">إرسال الطلب للإدارة</button><button class="btn sec" id="rqCancel">إغلاق</button></div>
      </div>`;
    if (kind === 'loan') {
      rqFormEl.innerHTML = `<div class="g2" style="margin-top:12px;padding:14px;background:var(--surface);border-radius:16px;border:1px solid var(--line)">
        <div class="field"><label>مبلغ السلفة المطلوب (د.ل)</label><input type="number" id="rqLoanAmt" min="10" step="10" placeholder="500"></div>
        <div class="field"><label>القسط الشهري المقترح للخصم (د.ل)</label><input type="number" id="rqLoanInst" min="10" step="10" placeholder="100"></div>
        <div class="field" style="grid-column:1/-1"><label>سبب طلب السلفة</label><input id="rqNote" maxlength="300" placeholder="ظرف طارئ..."></div>
        <div style="grid-column:1/-1;display:flex;gap:8px"><button class="btn" id="rqSend" style="flex:1">إرسال طلب السلفة</button><button class="btn sec" id="rqCancel">إغلاق</button></div>
      </div>`;
    } else if (kind === 'cert') {
      rqFormEl.innerHTML = `<div class="g2" style="margin-top:12px;padding:14px;background:var(--surface);border-radius:16px;border:1px solid var(--line)">
        <div class="field"><label>نوع الإفادة المطلوبة</label><select id="rqCertType"><option value="with_salary">شهادة تعريف بالراتب</option><option value="work_only">إفادة عمل (بدون ذكر الراتب)</option></select></div>
        <div class="field"><label>الجهة الموجَّه إليها (اختياري)</label><input id="rqNote" maxlength="300" placeholder="مصرف الجمهورية / السفارة / إلى من يهمه الأمر"></div>
        <div style="grid-column:1/-1;display:flex;gap:8px"><button class="btn" id="rqSend" style="flex:1">طلب الإفادة</button><button class="btn sec" id="rqCancel">إغلاق</button></div>
      </div>`;
    }
    $('#rqCancel').onclick = () => { rqFormEl.innerHTML = ''; };
    if (kind === 'leave') {
      refreshMyLeaves().then(showBal);
      const upd = () => {
        const el = $('#rqCnt'); if (!el) return;
        const n = cntWork($('#rqFrom').value, $('#rqTo').value), x = LT.find(v => v.id === $('#rqType').value) || LT[0];
        el.textContent = n ? `أيام العمل المحتسبة: ${n} (تُستثنى أيام الراحة والعطل الرسمية)${+x.pct < 100 ? ` · تُدفع بنسبة ${+x.pct}% من الأجر` : ''}` : ($('#rqFrom').value && $('#rqTo').value ? 'لا يوجد يوم دوام في هذه الفترة' : '');
      };
      ['rqFrom', 'rqTo', 'rqType'].forEach(i => $('#' + i).addEventListener('change', upd));
    }
    $('#rqSend').onclick = async () => {
      const btn = $('#rqSend');
      if (btn) btn.disabled = true;
      try {
        const note = ($('#rqNote') ? $('#rqNote').value.trim() : '');
        if (kind === 'leave') {
          const from = $('#rqFrom').value, to = $('#rqTo').value;
          if (!from || !to || to < from) { if (btn) btn.disabled = false; return toast('حدد فترة إجازة صحيحة', 'err'); }
          const list = await refreshMyLeaves();
          for (const r of list) if ((r.status === 'approved' || r.status === 'pending') && !(to < r.from || from > r.to)) { if (btn) btn.disabled = false; return toast(`يوجد طلب إجازة (${r.status === 'approved' ? 'معتمد' : 'معلّق'}) يتعارض مع هذه الفترة (${r.from} إلى ${r.to})`, 'err'); }
          if (list.filter(r => r.status === 'pending').length >= 5) { if (btn) btn.disabled = false; return toast('لديك 5 طلبات إجازة بانتظار المراجعة — انتظر حتى تُراجَع قبل إرسال طلب جديد', 'err'); }
          if (daysBetween(from, to) + 1 > 90) { if (btn) btn.disabled = false; return toast('أقصى مدة للطلب الواحد 90 يوماً', 'err'); }
          const nWork = cntWork(from, to);
          if (!nWork) { if (btn) btn.disabled = false; return toast('هذه الفترة لا تتضمن أي يوم دوام (راحة أو عطل رسمية)', 'err'); }
          const lt = LT.find(v => v.id === $('#rqType').value) || LT[0];
          if (lt.deduct) { const x = annualLeft(); if (nWork > x.rem && !confirm(`أيام العمل المطلوبة (${nWork}) تتجاوز رصيدك المتبقي (${x.rem} يوم). هل تريد الإرسال رغم ذلك؟`)) { if (btn) btn.disabled = false; return; } }
          await addDoc(collection(db, 'employees', token, 'requests'), { kind: 'leave', type: String(lt.id).slice(0, 40), typeName: String(lt.name).slice(0, 60), from, to, note, status: 'pending', empName: emp.name, createdAt: serverTimestamp() });
          rqFormEl.innerHTML = '';
          toast('أُرسل طلب الإجازة — بانتظار موافقة الإدارة', 'good');
        } else if (kind === 'loan') {
          const amt = parseFloat($('#rqLoanAmt').value), inst = parseFloat($('#rqLoanInst').value);
          if (!(amt > 0) || !(inst > 0) || inst > amt) { if (btn) btn.disabled = false; return toast('أدخل مبلغ السلفة والقسط الشهري بشكل صحيح', 'err'); }
          const kToday = dayKey(now());
          await addDoc(collection(db, 'employees', token, 'requests'), { kind: 'loan', type: String(amt), typeName: String(inst), from: kToday, to: kToday, note, status: 'pending', empName: emp.name, createdAt: serverTimestamp() });
          rqFormEl.innerHTML = ''; toast('أُرسل طلب السلفة للإدارة', 'good');
        } else if (kind === 'cert') {
          const ct = $('#rqCertType').value, kToday = dayKey(now());
          await addDoc(collection(db, 'employees', token, 'requests'), { kind: 'cert', type: ct, typeName: ct === 'with_salary' ? 'شهادة تعريف بالراتب' : 'إفادة عمل', from: kToday, to: kToday, note, status: 'pending', empName: emp.name, createdAt: serverTimestamp() });
          rqFormEl.innerHTML = ''; toast('أُرسل طلب الإفادة للإدارة', 'good');
        } else {
          const d = $('#rqDay').value, tin = $('#rqIn').value, tout = $('#rqOut').value;
          if (!d || (!tin && !tout)) { if (btn) btn.disabled = false; return toast('حدد اليوم والوقت المطلوب تصحيحه', 'err'); }
          if (d > dayKey(now())) { if (btn) btn.disabled = false; return toast('لا يمكن تقديم تصحيح ليوم في المستقبل', 'err'); }
          await addDoc(collection(db, 'employees', token, 'requests'), { kind: 'fix', type: '', typeName: '', from: d, to: d, fixIn: tin || '', fixOut: tout || '', note, status: 'pending', empName: emp.name, createdAt: serverTimestamp() });
          rqFormEl.innerHTML = '';
          toast('أُرسل طلب التصحيح — بانتظار موافقة الإدارة', 'good');
        }
        loadReqs();
      } catch (e) { if (btn) btn.disabled = false; console.error(e); toast('تعذر إرسال الطلب، حاول مجدداً', 'err'); }
    };
  }
  $('#rqLeave').onclick = () => showRqForm('leave');
  $('#rqLoan').onclick = () => showRqForm('loan');
  $('#rqCert').onclick = () => showRqForm('cert');
  $('#rqFix').onclick = () => showRqForm('fix');
  $('#rqList').onclick = async ev => {
    const bx = ev.target.closest('[data-cx]'); if (!bx || !confirm('إلغاء هذا الطلب؟')) return;
    try { await deleteDoc(doc(db, 'employees', token, 'requests', bx.dataset.cx)); toast('أُلغي الطلب', 'good'); loadReqs(); }
    catch { toast('تعذر الإلغاء (ربما روجع الطلب)', 'err'); }
  };
  async function loadReqs() {
    try {
      const q = query(collection(db, 'employees', token, 'requests'), orderBy('createdAt', 'desc'), limit(10));
      const s = await getDocs(q);
      $('#rqList').innerHTML = s.docs.length ? s.docs.map(d => {
        const r = d.data();
        const st = r.status === 'pending' ? '<span class="badge b-warn">بانتظار المراجعة</span>' : r.status === 'approved' ? '<span class="badge b-ok">مقبول</span>' : '<span class="badge b-bad">مرفوض</span>';
        const det = r.kind === 'loan' ? `<b>طلب سلفة: ${esc(r.type)} د.ل</b> (قسط شهري: ${esc(r.typeName)} د.ل)` : r.kind === 'cert' ? `<b>طلب ${esc(r.typeName || 'إفادة عمل')}</b>` : r.kind === 'leave' ? `${esc(r.typeName || 'إجازة')} · من ${fmtDate(dayStart(r.from))} إلى ${fmtDate(dayStart(r.to))}` : `تصحيح ${fmtDate(dayStart(r.from))}${r.fixIn ? ' · حضور ' + esc(r.fixIn) : ''}${r.fixOut ? ' · انصراف ' + esc(r.fixOut) : ''}`;
        return `<tr><td>${det}</td><td>${st}${r.status === 'pending' ? ` <button class="btn sm sec" data-cx="${d.id}">${ic('x', 15)} إلغاء</button>` : ''}</td></tr>`;
      }).join('') : '<tr><td class="muted">لا توجد طلبات بعد</td></tr>';
    } catch { $('#rqList').innerHTML = '<tr><td class="muted">تعذر تحميل طلباتك</td></tr>'; }
  }
  loadReqs();

  $('#bIn').onclick = () => punch('in');
  $('#bOut').onclick = () => punch('out');
  loadHist();
}

/* =====================================================================
   واجهة موظف المهام (عمل حر): بلا بصمة، يُسجّل مهامه والإدارة تعتمد

async function taskWorkerApp(db, token, emp, orgName) {
  let types = [];
  try { const s = await getDocs(collection(db, 'taskTypes')); types = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(x => x.active !== false).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar')); } catch {}

    <div class="card"><div class="ch"><div class="ch-l"><span class="chi">${ic('task', 24)}</span><h3>تسجيل مهمة منفّذة</h3></div></div>
      ${types.length ? `<div class="g2">
        <div class="field" style="grid-column:1/-1"><label>نوع المهمة</label><select id="tkType">${types.map(x => `<option value="${esc(x.id)}">${esc(x.name)} — ${price(x.id)} للوحدة</option>`).join('')}</select></div>
        <div class="field"><label>العدد المنفّذ</label><input type="number" id="tkQty" min="1" max="500" step="1" value="1" inputmode="numeric"></div>
        <div class="field"><label>تاريخ التنفيذ</label><input type="date" id="tkDay" value="${today}" max="${today}"></div>
        <div class="field" style="grid-column:1/-1"><label>ملاحظة / رابط الدليل (اختياري)</label><input id="tkNote" maxlength="300"></div>
        <button class="btn" id="tkSend" style="grid-column:1/-1">${ic('send', 18)} إرسال للإدارة للاعتماد</button></div>`
      : '<p class="muted" style="margin:0">لم تُضف الإدارة أنواع مهام بعد. تواصل معها.</p>'}
    </div>
    <div class="card"><div class="ch"><div class="ch-l"><span class="chi">${ic('payroll', 24)}</span><h3>حسابي هذا الشهر</h3></div></div><div id="tkSum" class="muted">…</div></div>
    <div class="card"><div class="ch"><div class="ch-l"><span class="chi">${ic('report', 24)}</span><h3>سجل مهامي</h3></div></div><div class="tw"><table><tbody id="tkList"><tr><td class="muted">…</td></tr></tbody></table></div></div>
  </div></div>`;
  refreshPwaButtons();
  async function load() {
    try {
      const s = await getDocs(query(collection(db, 'employees', token, 'requests'), orderBy('createdAt', 'desc'), limit(60)));
      const rows = s.docs.map(d => ({ id: d.id, ...d.data() })).filter(r => r.kind === 'task');
      const mk = today.slice(0, 7);
      const ap = rows.filter(r => r.status === 'approved' && String(r.from).startsWith(mk));
      const pe = rows.filter(r => r.status === 'pending' && String(r.from).startsWith(mk));
      const sum = (a, f) => a.reduce((x, r) => x + f(r), 0);
      $('#tkSum').innerHTML = `<div class="stats" style="margin-bottom:0">
        <div class="stat"><div class="st-ic">${ic('check', 28)}</div><div><b>${Math.round(sum(ap, r => +r.amount || 0) * 100) / 100}</b><span>معتمد (${sum(ap, r => +(r.qtyApproved ?? r.qty) || 0)} وحدة)</span></div></div>
        <div class="stat"><div class="st-ic">${ic('clock', 28)}</div><div><b>${Math.round(sum(pe, r => (+r.qty || 0) * price(r.taskId)) * 100) / 100}</b><span>معلّق (${sum(pe, r => +r.qty || 0)} وحدة)</span></div></div>
      </div>`;
      $('#tkList').innerHTML = rows.length ? rows.map(r => {
        const st = r.status === 'pending' ? '<span class="badge b-warn">بانتظار الاعتماد</span>' : r.status === 'approved' ? `<span class="badge b-ok">معتمد · ${+r.amount || 0}</span>` : '<span class="badge b-bad">مرفوض</span>';
        return `<tr><td><b>${esc(r.taskName || '')}</b> × ${+(r.qtyApproved ?? r.qty) || 0}<div class="muted" style="font-size:12px">${fmtDate(dayStart(r.from))}</div></td><td>${st}${r.status === 'pending' ? ` <button class="btn sm sec" data-cx="${esc(r.id)}">${ic('x', 15)}</button>` : ''}</td></tr>`;
      }).join('') : '<tr><td class="muted">لا توجد مهام مسجّلة بعد</td></tr>';
    } catch { $('#tkList').innerHTML = '<tr><td class="muted">تعذر تحميل مهامك</td></tr>'; }
  }
  if ($('#tkSend')) $('#tkSend').onclick = async () => {
    const id = $('#tkType').value, qty = parseInt($('#tkQty').value, 10), day = $('#tkDay').value, x = types.find(v => v.id === id);
    if (!x) return toast('اختر نوع المهمة', 'err');
    if (!(qty >= 1 && qty <= 500)) return toast('العدد من 1 إلى 500', 'err');
    if (!day || day > today) return toast('حدد تاريخ تنفيذ صحيحاً (لا يكون في المستقبل)', 'err');
    try {
      await addDoc(collection(db, 'employees', token, 'requests'), { kind: 'task', type: 'task', typeName: '', taskId: id, taskName: String(x.name).slice(0, 80), qty, from: day, to: day, note: $('#tkNote').value.trim().slice(0, 300), status: 'pending', empName: emp.name, createdAt: serverTimestamp() });
      $('#tkQty').value = 1; $('#tkNote').value = '';
      toast('أُرسلت المهمة — بانتظار اعتماد الإدارة', 'good'); load();
    } catch (e) { console.error(e); toast(e.code === 'permission-denied' ? 'رُفض الطلب: قد يكون نوع المهمة تغيّر — أعد تحميل الصفحة' : 'تعذر الإرسال، حاول مجدداً', 'err'); }
  };
  $('#tkList').onclick = async ev => {
    const bx = ev.target.closest('[data-cx]'); if (!bx || !confirm('إلغاء هذه المهمة؟')) return;
    try { await deleteDoc(doc(db, 'employees', token, 'requests', bx.dataset.cx)); toast('أُلغيت المهمة', 'good'); load(); }
    catch { toast('تعذر الإلغاء (ربما رُوجعت)', 'err'); }
  };
  load();
}

window.__downloadFile = async (url, filename) => {
  try {
    const r = await fetch(url, { cache: 'no-store' });
    const txt = await r.text();
    const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast(`تم بدء تحميل ${filename}`, 'good');
  } catch {
    toast(`تعذر تحميل ${filename}`, 'err');
  }
};

/* =====================================================================
   لوحة الإدارة المنظمة (بدون زحمة وبأقسام فرعية وبحث فوري)
   ===================================================================== */
function adminApp(db, auth) {
  if (licExpired()) { root.innerHTML = licGateHtml(); return; }
  const S = {
    tab: 'today',
    empSub: 'list',    // list | admins
    schedSub: 'sched', // sched | leaves | settings
    recSub: 'summary', // summary | payroll | raw
    qToday: '', qEmp: '', qRec: '',
    emps: [], locs: [], scheds: [], rulesOld: false, recs: [], today: [],
    idxUrl: '', from: '', to: '', emp: '', hols: [], holKeys: [], set: {},
    reqs: [], leaves: [], reqsErr: false, admins: [], adminsErr: false, taskTypes: [],
    role: 'unknown', deptScope: ''
  };
  S.from = dayKey(new Date(Date.now() - 6 * 86400000)); S.to = dayKey(new Date());
  async function resolveAdminRole() {
    const u = auth.currentUser;
    if (!u) throw new Error('admin-auth-required');
    const paths = [u.uid];
    if (u.emailVerified && u.email) paths.push(u.email.toLowerCase());
    for (const key of [...new Set(paths)]) {
      try {
        const snap = await getDoc(doc(db, 'admins', key));
        if (snap.exists()) {
          const d = snap.data();
          const valid = ['super_admin', 'hr_admin', 'payroll_admin', 'manager', 'auditor'];
          S.role = valid.includes(d.role) ? d.role : 'auditor';
          S.deptScope = S.role === 'manager' && typeof d.deptScope === 'string' ? d.deptScope.trim() : '';
          if (S.role === 'manager' && !S.deptScope) throw new Error('manager-scope-required');
          return;
        }
      } catch (err) {
        if (err.code !== 'permission-denied') throw err;
      }
    }
    let canReadOwnerProfile = false;
    try {
      const owner = await getDoc(doc(db, 'admins', 'owner'));
      canReadOwnerProfile = true;
      if (owner.exists() && String(owner.data().email || '').toLowerCase() === String(u.email || '').toLowerCase()) {
        S.role = 'super_admin'; S.deptScope = ''; return;
      }
    } catch (err) { if (err.code !== 'permission-denied') throw err; }
    // يظل المالك الأول قادرًا على الإعداد لأن قواعده تسمح له بقراءة /admins/owner حتى قبل إنشاء الوثيقة.
    if (canReadOwnerProfile) { S.role = 'super_admin'; S.deptScope = ''; return; }
    S.role = 'unknown'; S.deptScope = '';
  }
  const isSuper = () => S.role === 'super_admin';
  const isHr = () => S.role === 'hr_admin';
  const isPay = () => S.role === 'payroll_admin';
  // يطابق قيود قواعد Firestore: الموارد البشرية لا تكتب الحقول المالية، والرواتب لا تكتب حقول الموظف/الدوام.
  const HR_EMP_KEYS = new Set(['name','phone','dept','jobTitle','contractEnd','docExpiry','bioId','assets','scheduleId','rotOffset','startDate','leaveQuota','empType','locs','active']);
  const PAY_EMP_KEYS = new Set(['payMode','payAmount','allowance','bonus','penalty','loanTotal','loanInst','lyStatutory','familyStatus','nationalId','bankName','iban','taskPrices']);
  const scopeEmpPatch = p => {
    if (isSuper()) return p;
    const allow = isHr() ? HR_EMP_KEYS : isPay() ? PAY_EMP_KEYS : new Set();
    return Object.fromEntries(Object.entries(p).filter(([k]) => allow.has(k)));
  };
  const isManager = () => S.role === 'manager';
  const base = location.origin + location.pathname;
  const linkOf = id => `${base}?e=${id}`;
  const brandName = () => (S.set && S.set.orgName) ? S.set.orgName : BRAND;
  const ch = (icon, title, rightHtml = '') => `<div class="ch"><div class="ch-l"><span class="chi">${ic(icon, 24)}</span><h3>${title}</h3></div>${rightHtml}</div>`;
  const ST_TXT = { work: 'حضور', open: 'لم ينصرف', forgot: 'نسي الانصراف', absent: 'غياب', leave: 'إجازة', holiday: 'عطلة رسمية', rest: 'راحة' };
  const stText = (s, M) => s.status === 'leave' && s.lv ? `إجازة${s.lv.typeName ? ' · ' + s.lv.typeName : ''}${leavePct(s.lv) < 100 ? ` (${leavePct(s.lv)}%)` : ''}` : M[s.status];
  const findLT = r => { const L = leaveTypesOf(S.set); return L.find(x => x.id === r.type) || L.find(x => x.name === r.typeName) || null; };
  const empCtx = empId => { const e = S.emps.find(x => x.id === empId) || {}; const x = S.scheds.find(s => s.id === e.scheduleId); return { sc: x ? normSched(x) : null, rot: e.rotOffset || 0 }; };

  async function fetchRecs(a, b) {
    const map = d => ({ id: d.id, empId: d.ref.parent.parent.id, ...d.data(), t: d.data().time?.toDate() });
    if (isManager()) {
      if (!S.deptScope) throw new Error('manager-scope-required');
      const target = S.emp ? S.emps.filter(e => e.id === S.emp) : S.emps.filter(e => e.empType !== 'task');
      const chunks = await Promise.all(target.map(e => getDocs(query(
        collection(db, 'employees', e.id, 'records'),
        where('time', '>=', Timestamp.fromDate(a)), where('time', '<', Timestamp.fromDate(b)), orderBy('time')
      )).then(q => q.docs.map(map))));
      return chunks.flat().filter(x => x.t).sort((x, y) => x.t - y.t);
    }
    try {
      const s = await getDocs(query(collectionGroup(db, 'records'), where('time', '>=', Timestamp.fromDate(a)), where('time', '<', Timestamp.fromDate(b)), orderBy('time')));
      return s.docs.map(map).filter(x => x.t);
    } catch (err) {
      if (err.code !== 'failed-precondition') throw err;
      S.idxUrl = (String(err.message).match(/https:\/\/\S+/) || [''])[0] || 'https://console.firebase.google.com';
      console.warn(err.message);
      const targetEmps = S.emp ? S.emps.filter(e => e.id === S.emp) : S.emps.filter(e => e.empType !== 'task');
      const chunks = await Promise.all(targetEmps.map(e =>
        getDocs(query(collection(db, 'employees', e.id, 'records'), where('time', '>=', Timestamp.fromDate(a)), where('time', '<', Timestamp.fromDate(b)), orderBy('time')))
          .then(s => s.docs.map(map)).catch(() => [])
      ));
      return chunks.flat().filter(x => x.t).sort((x, y) => x.t - y.t);
    }
  }
  async function loadRecs() { S.recs = await fetchRecs(new Date(dayStart(S.from).getTime() - 86400000), dayEnd(S.to)); }
  async function migrateLocs() {
    if (!isSuper() && !isHr()) return;
    for (const l of S.locs) if (!(l.kx > 0) || !(l.ky > 0)) { const k = geoK(l.lat); await updateDoc(doc(db, 'locations', l.id), k); Object.assign(l, k); }
  }
  /* ---- تبويب «اليوم»: أمس يُجلب مرة واحدة + مستمع لحظي لسجلات اليوم ----
     بدل إعادة جلب كل السجلات كل 60 ثانية: القراءة الكاملة مرة عند الفتح، ثم قراءة واحدة لكل سجل جديد فقط. */
  const mapRec = d => ({ id: d.id, empId: d.ref.parent.parent.id, ...d.data(), t: d.data().time?.toDate() });
  let _todayRT = 0;
  const mergeToday = () => { S.today = (S.todayPrev || []).concat(S.todayLive || []); };
  function stopTodayFeed() {
    if (window.__meqatUnsub) { try { window.__meqatUnsub(); } catch {} window.__meqatUnsub = null; }
    clearInterval(window.__meqatPoll);
  }
  function refreshTodayView() {
    clearTimeout(_todayRT);
    _todayRT = setTimeout(() => { if (S.tab === 'today' && !document.querySelector('.ov') && $('#content')) viewToday($('#content')); }, 400);
  }
  async function startTodayFeed() {
    stopTodayFeed();
    const nowD = new Date(), key = dayKey(nowD), yKey = dayKey(new Date(nowD.getTime() - 86400000));
    S.todayKey = key; S.todayLive = []; S.todayPrev = [];
    S.todayPrev = await fetchRecs(dayStart(yKey), dayEnd(yKey));   // أمس: لإكمال جلسات الدوام الليلي — مرة واحدة فقط
    mergeToday();
    await new Promise(resolve => {
      let first = true;
      const done = () => { if (first) { first = false; resolve(); } else refreshTodayView(); };
      const slowPoll = async () => {   // احتياط إذا تعذّر المستمع (مثلاً الفهرس غير منشأ): تحديث كل 5 دقائق فقط
        clearInterval(window.__meqatPoll);
        const pull = async () => { try { S.todayLive = await fetchRecs(dayStart(key), dayEnd(key)); mergeToday(); } catch (err) { console.warn(err); } done(); };
        await pull();
        window.__meqatPoll = setInterval(() => { if (!document.hidden && auth.currentUser) pull(); }, 300000);
      };
      if (isManager()) { slowPoll(); return; }
      const q = query(collectionGroup(db, 'records'), where('time', '>=', Timestamp.fromDate(dayStart(key))), where('time', '<', Timestamp.fromDate(dayEnd(key))), orderBy('time'));
      try {
        window.__meqatUnsub = onSnapshot(q, snap => {
          S.todayLive = snap.docs.map(mapRec).filter(x => x.t);
          mergeToday();
          done();
        }, err => {
          console.warn(err);
          if (err.code === 'failed-precondition') S.idxUrl = (String(err.message).match(/https:\/\/\S+/) || [''])[0] || 'https://console.firebase.google.com';
          if (window.__meqatUnsub) { try { window.__meqatUnsub(); } catch {} window.__meqatUnsub = null; }
          slowPoll();
        });
      } catch (e) { console.warn(e); slowPoll(); }
      setTimeout(() => { if (first) { first = false; resolve(); } }, 15000);   // لا نعطّل تحميل اللوحة إذا تأخر الاتصال
    });
  }
  async function loadAll() {
    _sumC = null;
    S.idxUrl = '';
    try {
      await resolveAdminRole();
      const empQuery = isManager()
        ? query(collection(db, 'employees'), where('dept', '==', S.deptScope))
        : collection(db, 'employees');
      const [e, l] = await Promise.all([getDocs(empQuery), getDocs(collection(db, 'locations'))]);
      S.emps = e.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
      S.locs = l.docs.map(d => ({ id: d.id, ...d.data() }));
      try {
        const sc = await getDocs(collection(db, 'schedules'));
        S.scheds = sc.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar'));
        S.rulesOld = false;
      } catch (e2) { if (e2.code === 'permission-denied') S.rulesOld = true; else throw e2; }
      try {
        const hs = await getDocs(collection(db, 'holidays'));
        S.hols = hs.docs.map(d => ({ id: d.id, date: d.data().date || d.id, name: d.data().name || '' })).sort((a, b) => (a.date || '').localeCompare(b.date || ''));
        S.holKeys = S.hols.map(h => h.date || h.id);
      } catch (e2) { if (e2.code !== 'permission-denied') console.warn(e2); }
      try {
        const st = await getDoc(doc(db, 'settings', 'general'));
        S.set = st.exists() ? st.data() : {};
      } catch (e2) { if (e2.code !== 'permission-denied') console.warn(e2); }
      if (S.set && S.set.tzOffset != null && +S.set.tzOffset !== TZOFF) TZOFF = +S.set.tzOffset;
      try { const tk = await getDocs(collection(db, 'taskTypes')); S.taskTypes = tk.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.name || '').localeCompare(b.name || '', 'ar')); } catch (e2) { S.taskTypes = []; if (e2.code !== 'permission-denied') console.warn(e2); }
      try {
        if (isManager()) {
          const groups = await Promise.all(S.emps.map(async emp => {
            const q = await getDocs(collection(db, 'employees', emp.id, 'requests'));
            return q.docs.map(d => ({ id: d.id, empId: emp.id, ...d.data(), cAt: (d.data().createdAt && d.data().createdAt.toMillis ? d.data().createdAt.toMillis() : 0) }));
          }));
          S.reqs = groups.flat();
        } else {
          const rq = await getDocs(collectionGroup(db, 'requests'));
          S.reqs = rq.docs.map(d => ({ id: d.id, empId: d.ref.parent.parent.id, ...d.data(), cAt: (d.data().createdAt && d.data().createdAt.toMillis ? d.data().createdAt.toMillis() : 0) }));
        }
        S.reqsErr = false;
      } catch (e2) { S.reqs = []; if (e2.code === 'permission-denied') S.reqsErr = true; else console.warn(e2); }
      S.leaves = S.reqs.filter(r => r.kind === 'leave' && r.status === 'approved');
      if (isSuper()) {

        ['rest', 'hol'].forEach(p => { if (!OFFDAY_MODES.includes(c.ot[p + 'Mode'])) c.ot[p + 'Mode'] = c.ot.mode === 'none' ? 'normal' : 'all'; });

  async function deviceManager(e) {

    try {

      W.pinExp = d && d.exp && d.exp.toMillis ? d.exp.toMillis() : 0;
      W.pinState = W.pinExp > Date.now() ? 'active' : (d ? 'expired' : 'none');
    } catch {}
    const stamp = t => t && t.toDate ? `${fmtDate(t.toDate())} ${fmtTime(t.toDate())}` : '';
    const devRows = () => {
      const map = e.devices || {}, ks = Object.keys(map);
      if (!ks.length) return `<p class="muted">${e.deviceId ? 'رابط قديم مربوط بجهاز واحد.' : 'لا توجد أجهزة مسجّلة بعد؛ أول جهاز يفتح الرابط يُسجَّل دون رمز.'}</p>`;
      return ks.map(k => {
        const j = W.joins[map[k]];
        return `<div style="display:flex;gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><div><b dir="ltr" style="font-size:12.5px;word-break:break-all">${j && j.ua ? esc(j.ua) : 'الجهاز الأول (سُجّل دون رمز)'}</b><div class="muted" style="font-size:12px">${esc(stamp(j && j.at))}</div></div><button class="btn sm bad" data-a="rev" data-key="${esc(k)}">إلغاء</button></div>`;
      }).join('');
    };
    const pinBox = () => W.pin
      ? `<div class="notice" style="text-align:center"><div class="muted">يُعرض مرة واحدة — صالح ${PIN_TTL_H} ساعة</div><div dir="ltr" style="font-size:26px;font-weight:800;letter-spacing:3px;margin:6px 0">${fmtPin(W.pin)}</div><div style="display:flex;gap:8px;justify-content:center"><button class="btn sm sec" data-a="copypin">نسخ</button><button class="btn sm ok" data-a="wapin">إرسال واتساب</button></div></div>`
      : `<p class="muted">${W.pinState === 'active' ? 'يوجد رمز صالح حتى ' + esc(fmtDate(new Date(W.pinExp)) + ' ' + fmtTime(new Date(W.pinExp))) + ' (لا يمكن عرضه مجددًا؛ أصدر رمزًا جديدًا إن ضاع).' : W.pinState === 'expired' ? 'الرمز السابق منتهٍ.' : 'لا يوجد رمز صالح.'}</p>`;
    const act = async (a, d) => {
      try {
        if (a === 'newpin') {
          const pin = genPin(); const exp = Date.now() + PIN_TTL_H * 3600e3;
          await setDoc(doc(db, 'pins', e.id), { pin, exp: Timestamp.fromMillis(exp), createdAt: serverTimestamp() });
          W.pin = pin; W.pinState = 'active'; W.pinExp = exp; toast('أُصدر رمز جديد وتوقف الرمز السابق', 'good');
        } else if (a === 'killpin') {
          await deleteDoc(doc(db, 'pins', e.id)); W.pin = null; W.pinState = 'none'; toast('أُلغي الرمز', 'good');
        } else if (a === 'copypin' && W.pin) {
          await navigator.clipboard.writeText(fmtPin(W.pin)); toast('تم النسخ', 'good');
        } else if (a === 'wapin' && W.pin) {
          const msg = `مرحباً ${e.name}، رمز إضافة جهاز جديد لرابطك في «${BRAND}»: ${fmtPin(W.pin)}\nصالح ${PIN_TTL_H} ساعة. لا تشاركه مع أحد.`;
          const l = document.createElement('a'); l.href = `https://wa.me/${e.phone || ''}?text=${encodeURIComponent(msg)}`; l.target = '_blank'; l.rel = 'noopener noreferrer'; l.click();
        } else if (a === 'rev') {
          const key = d.key, map = e.devices || {}, uidv = map[key];
          if (!uidv || !confirm('إلغاء هذا الجهاز؟ سيحتاج صاحبه رمزًا جديدًا لإضافته.')) return;

          delete W.joins[uidv]; toast('أُلغي الجهاز', 'good'); render();
        }
      } catch (err) { console.error(err); toast(err && err.code === 'permission-denied' ? 'غير مسموح: انشر قواعد Firestore المحدثة أولًا' : 'تعذرت العملية', 'err'); }
      m.draw();
    };
    const m = openModal({
      title: `الأجهزة والرمز — ${esc(e.name)}`, saveText: 'حفظ الحد الأقصى',
      body: () => `<p class="muted">الأجهزة المسجّلة (${e.devices ? Object.keys(e.devices).length : (e.deviceId ? 1 : 0)}/${W.max})</p>${devRows()}

        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-a="newpin">إصدار رمز جديد</button>${W.pinState === 'active' ? '<button class="btn sm sec" data-a="killpin">إلغاء الرمز الحالي</button>' : ''}</div>`,
      onField: (k, v) => { if (k === 'max') W.max = +v; },
      onAct: (a, d) => { act(a, d); },
      onSave: async () => {
        if (W.max !== (e.maxDevices || 2)) { await updateDoc(empRef, { maxDevices: W.max }); e.maxDevices = W.max; render(); toast('حُفظ الحد الأقصى للأجهزة', 'good'); }

    });

          const targetNet = parseFloat(prompt('أدخل صافي الراتب المطلوب استلامه في اليد (د.ل):'));
          if (!(targetNet > 0)) return;
          // بحث ثنائي سريع (Binary Search) لإيجاد الإجمالي الذي يعطي هذا الصافي بعد الضمان والضرائب الليبية
          let lo = targetNet, hi = targetNet * 1.4, mid = targetNet;
          for (let i = 0; i < 40; i++) {
            mid = (lo + hi) / 2;
            const st = calcLibyanStatutory(mid, W.familyStatus || 'single');
            if (mid - st.total < targetNet) lo = mid; else hi = mid;
          }
          W.payAmount = Math.round(mid * 100) / 100;
          W.lyStatutory = true;
          toast(`تم ضبط الإجمالي إلى ${W.payAmount} د.ل ليكون الصافي ${targetNet} د.ل`, 'good');

          bankName: String(W.bankName || '').trim(), iban: String(W.iban || '').trim(),
          bioId: String(W.bioId || '').trim(), assets: String(W.assets || '').trim()
        };

          await loadAll(); toast('تم حفظ ملف الموظف', 'good'); return;
        }
        const sc = S.scheds.find(x => x.id === W.scheduleId);
        const n = sc && sc.mode === 'rotation' ? (sc.cycle || []).length : 0;
        const rot = n ? Math.min(Math.max(1, +W.rotPos || 1), n) - 1 : 0;
        const ids = Object.keys(W.locs).filter(id => W.locs[id]);
        const amt = +W.payAmount || 0;
        if (W.payMode !== 'none' && !(amt > 0)) { toast('اكتب قيمة الراتب', 'err'); return false; }
        await updateDoc(doc(db, 'employees', e.id), scopeEmpPatch({
          ...common, scheduleId: sc ? sc.id : '', rotOffset: rot, startDate: W.startDate || created,
          payMode: W.payMode, payAmount: W.payMode === 'none' ? 0 : amt,
          allowance: Math.max(0, +W.allowance || 0), bonus: Math.max(0, +W.bonus || 0), penalty: Math.max(0, +W.penalty || 0),
          loanTotal: Math.max(0, +W.loanTotal || 0), loanInst: Math.max(0, +W.loanInst || 0),
          lyStatutory: !!W.lyStatutory, familyStatus: W.familyStatus || 'single',
          locs: ids, leaveQuota: Math.max(0, +W.leaveQuota || 21), empType: 'staff'
        }));
        await loadAll(); toast('تم حفظ ملف الموظف الشامل', 'good');
      }
    });

  let _L = null;
  function loadLeaflet() {
    if (window.L) return Promise.resolve(window.L);
    if (_L) return _L;
    _L = new Promise((res, rej) => {
      const css = document.createElement('link'); css.rel = 'stylesheet'; css.href = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'; document.head.appendChild(css);
      const s = document.createElement('script'); s.src = 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js';
      s.onload = () => res(window.L); s.onerror = () => { _L = null; rej(new Error('leaflet-load')); };
      document.head.appendChild(s);
    });
    return _L;
  }

  function locEditor(ex) {
    const W = ex ? { id: ex.id, name: ex.name || '', lat: +ex.lat, lng: +ex.lng, radius: +ex.radius || 100 } : { id: null, name: '', lat: 32.8872, lng: 13.1913, radius: 100 };
    let map = null, marker = null, circle = null;
    const syncMap = () => {
      if (!map || !window.L) return;
      const c = [W.lat, W.lng];
      if (marker) marker.setLatLng(c);
      else { marker = window.L.marker(c, { draggable: true }).addTo(map); marker.on('dragend', () => { const p = marker.getLatLng(); W.lat = p.lat; W.lng = p.lng; syncMap(); }); }
      if (circle) circle.setLatLng(c).setRadius(W.radius);
      else circle = window.L.circle(c, { radius: W.radius, color: '#0E6B4D', fillOpacity: 0.15 }).addTo(map);
      map.setView(c, Math.max(map.getZoom(), 15), { animate: false });
      const t = $('#coordTxt'); if (t) t.textContent = `${W.lat.toFixed(5)}, ${W.lng.toFixed(5)}`;
    };
    const initMap = box => {
      loadLeaflet().then(() => {
        if (!box.isConnected) return;
        box._ready = true;
        map = window.L.map(box, { scrollWheelZoom: true }).setView([W.lat, W.lng], 15);
        window.L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap' }).addTo(map);
        map.on('click', ev => { W.lat = ev.latlng.lat; W.lng = ev.latlng.lng; syncMap(); });
        syncMap();
      }).catch(() => { box._busy = false; toast('تعذر تحميل الخريطة — تحقق من الاتصال ثم أعد المحاولة', 'err'); });
    };
    let mo = null;
    const obs = new MutationObserver(() => {
      if (!document.querySelector('.ov')) { obs.disconnect(); return; }
      const box = document.getElementById('mapBox');
      if (box && !box._ready && !box._busy) { box._busy = true; initMap(box); }
    });
    obs.observe(document.body, { childList: true, subtree: true });
    const body = () => `
      <div class="g2"><div class="field"><label>اسم الموقع</label><input data-k="name" value="${esc(W.name)}"></div>
      <div class="field"><label>النطاق (متر)</label><input class="num" type="number" min="10" data-k="radius" data-redraw value="${W.radius}"></div></div>
      <p class="hint">اضغط على الخريطة لوضع النقطة أو اسحب العلامة. الدائرة الزرقاء هي النطاق المسموح للموظف حول الموقع.</p>
      <div id="mapBox" style="height:320px;border-radius:16px;border:1px solid var(--line);background:var(--surface)"></div>
      <div class="sc"><button type="button" class="chip" data-a="myLoc">${ic('target', 16)} موقعي الحالي</button><span class="muted" dir="ltr" id="coordTxt">${W.lat ? W.lat.toFixed(5) + ', ' + W.lng.toFixed(5) : ''}</span></div>`;
    mo = openModal({
      title: ex ? 'تعديل الموقع (خريطة تفاعلية)' : 'موقع جديد (خريطة تفاعلية)', saveText: 'حفظ الموقع', body,
      onField: (k, v) => { if (k === 'radius') W.radius = Math.max(10, +v || 100); else W[k] = v; },
      onAct: async a => {
        if (a === 'myLoc') {
          toast('جاري تحديد موقعك…');
          try {
            const p = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { enableHighAccuracy: true, timeout: 20000 }));
            W.lat = p.coords.latitude; W.lng = p.coords.longitude;
            toast('تم تعيين نقطة موقعك على الخريطة', 'good');
          } catch { toast('تعذر تحديد موقعك', 'err'); }
          if (mo) mo.draw();
        }
      },
      onSave: async () => {
        const bad = m => { toast(m, 'err'); return false; };
        if (!(W.name || '').trim()) return bad('اكتب اسم الموقع');
        if (typeof W.lat !== 'number' || typeof W.lng !== 'number' || isNaN(W.lat) || isNaN(W.lng)) return bad('حدد نقطة على الخريطة');
        if (!(W.radius >= 10)) return bad('النطاق 10 أمتار على الأقل');
        obs.disconnect();
        if (ex) await updateDoc(doc(db, 'locations', ex.id), { name: W.name.trim(), lat: W.lat, lng: W.lng, radius: Math.round(W.radius), ...geoK(W.lat) });
        else await addDoc(collection(db, 'locations'), { name: W.name.trim(), lat: W.lat, lng: W.lng, radius: Math.round(W.radius), active: true, ...geoK(W.lat) });
        await loadAll(); toast('تم حفظ الموقع', 'good');
      }
    });
  }

    try {
      let XLSX;
      for (const u of ['https://cdn.sheetjs.com/xlsx-0.20.3/package/xlsx.mjs', 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/xlsx.mjs', 'https://unpkg.com/xlsx@0.18.5/xlsx.mjs']) {
        try { XLSX = await import(u); if (XLSX && XLSX.utils) break; } catch (err) { console.warn('xlsx load failed:', u, err); XLSX = null; }
      }
      if (!XLSX) throw new Error('xlsx-load');
      const wb = XLSX.utils.book_new();
      wb.Workbook = { Views: [{ RTL: true }] };
      const aoa1 = [['الموظف', 'التاريخ', 'الحالة', 'أول حضور', 'آخر انصراف', 'متأخر (د)', 'مبكر (د)', 'صافي العمل (د)', 'إضافي (ساعات مكافئة)']];
      summary().forEach(s => aoa1.push([xlSafe(s.name), s.day, stText(s, ST_TXT), s.met.firstIn ? fmtTime(s.met.firstIn, true) : '', s.met.lastOut ? fmtTime(s.met.lastOut, true) : '', s.met.late || 0, s.met.early || 0, Math.round(s.met.net), s.met.otEq ? +s.met.otEq.toFixed(2) : 0]));
      const ws1 = XLSX.utils.aoa_to_sheet(aoa1);
      ws1['!cols'] = [{ wch: 22 }, { wch: 12 }, { wch: 12 }, { wch: 13 }, { wch: 13 }, { wch: 10 }, { wch: 10 }, { wch: 14 }, { wch: 18 }];
      try { ws1['!views'] = [{ RTL: true }]; ws1['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: { r: aoa1.length - 1, c: 8 } }) }; } catch {}
      XLSX.utils.book_append_sheet(wb, ws1, 'الملخص اليومي');
      const aoa2 = [['الموظف', 'العملية', 'التاريخ', 'الوقت', 'الموقع', 'البعد (م)', 'خط العرض', 'خط الطول']];
      filtered().forEach(r => aoa2.push([xlSafe(r.empName), r.type === 'in' ? 'حضور' : 'انصراف', fmtDate(r.t), fmtTime(r.t, true), xlSafe(r.locationName), r.distance, r.lat, r.lng]));
      const ws2 = XLSX.utils.aoa_to_sheet(aoa2);
      ws2['!cols'] = [{ wch: 22 }, { wch: 10 }, { wch: 12 }, { wch: 13 }, { wch: 20 }, { wch: 10 }, { wch: 12 }, { wch: 12 }];
      try { ws2['!views'] = [{ RTL: true }]; } catch {}
      XLSX.utils.book_append_sheet(wb, ws2, 'عمليات البصمة');
      const pr = payrollRows().filter(r => r.pm !== 'none');
      if (pr.length) {
        const rn = v => +(Math.round(v * 100) / 100);
        const aoa3 = [['الموظف', 'طريقة الأجر', 'قيمة الأجر', 'ساعات عادية فعلية', 'الأساسي', 'قيمة الإضافي', 'خصم التأخير', 'خصم المبكر', 'خصم الغياب / إجازة بلا راتب', 'خصم نسيان الانصراف', 'علاوات/مكافآت', 'ضمان وضرائب', 'سلفة/جزاء', 'الصافي']];
        pr.forEach(r => aoa3.push([xlSafe(r.name), r.pm === 'monthly' ? 'شهري' : r.pm === 'task' ? 'بالمهام' : 'بالساعة', rn(r.amt), r.pm === 'task' ? r.taskQty : rn(r.paidH), rn(r.base), rn(r.otPay), rn(r.dedLate), rn(r.dedEarly), rn(r.dedAbs), rn(r.dedForgot || 0), rn(r.allowBonus || 0), rn(r.statDed || 0), rn((r.dedLoan || 0) + (r.dedPen || 0)), rn(r.net)]));
        const ws3 = XLSX.utils.aoa_to_sheet(aoa3);
        ws3['!cols'] = [{ wch: 22 }, { wch: 10 }, { wch: 12 }, { wch: 16 }, { wch: 12 }, { wch: 14 }, { wch: 12 }, { wch: 12 }, { wch: 18 }, { wch: 16 }, { wch: 14 }, { wch: 14 }, { wch: 14 }, { wch: 12 }];
        try { ws3['!views'] = [{ RTL: true }]; } catch {}
        XLSX.utils.book_append_sheet(wb, ws3, 'الرواتب');
        const bkRows = pr.filter(r => r.net > 0);
        if (bkRows.length) {
          const aoaB = [['الموظف', 'الرقم الوطني', 'المصرف', 'رقم الحساب / IBAN', 'صافي الراتب المستحق', 'الفترة']];
          bkRows.forEach(r => aoaB.push([xlSafe(r.name), xlSafe(r.nationalId || ''), xlSafe(r.bankName || ''), xlSafe(r.iban || ''), rn(r.net), `${S.from} -> ${S.to}`]));
          const wsB = XLSX.utils.aoa_to_sheet(aoaB);
          wsB['!cols'] = [{ wch: 22 }, { wch: 16 }, { wch: 22 }, { wch: 30 }, { wch: 16 }, { wch: 24 }];
          try { wsB['!views'] = [{ RTL: true }]; } catch {}
          XLSX.utils.book_append_sheet(wb, wsB, 'كشف مصرفي (IBAN)');
        }
      }
      const tkx = S.reqs.filter(r => r.kind === 'task' && r.status === 'approved' && r.from >= S.from && r.from <= S.to && (!S.emp || r.empId === S.emp)).sort((a, b) => a.from.localeCompare(b.from));
      if (tkx.length) {
        const aoa4 = [['الموظف', 'المهمة', 'التاريخ', 'الكمية', 'سعر الوحدة', 'المبلغ']];
        tkx.forEach(r => aoa4.push([xlSafe((S.emps.find(e => e.id === r.empId) || {}).name || ''), xlSafe(r.taskName || ''), r.from, +(r.qtyApproved ?? r.qty) || 0, +r.unitPrice || 0, +r.amount || 0]));
        const ws4 = XLSX.utils.aoa_to_sheet(aoa4);
        ws4['!cols'] = [{ wch: 22 }, { wch: 22 }, { wch: 12 }, { wch: 10 }, { wch: 12 }, { wch: 12 }];
        XLSX.utils.book_append_sheet(wb, ws4, 'المهام المعتمدة');
      }
      XLSX.writeFile(wb, `meqat_${S.from}_${S.to}.xlsx`);
      toast('تم تنزيل ملف Excel', 'good');
    } catch (e) {
      console.error(e);
      toast('تعذر تجهيز Excel (ربما لا يوجد اتصال) — استخدم تصدير CSV', 'err');
    }
  }

  /* --- كشف دوام جاهز للطباعة/PDF --- */
  function printReport() {
    const sum = summary();
    if (!sum.length) { toast('لا توجد بيانات للفترة المحددة', 'err'); return; }
    const byEmp = new Map();
    sum.forEach(s => { const g = byEmp.get(s.empId) || { empId: s.empId, name: s.name, rows: [] }; g.rows.push(s); byEmp.set(s.empId, g); });
    const html = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>كشف دوام من ${S.from} إلى ${S.to}</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Rubik:wght@400;600;800&family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
  <style>body{font-family:"Cairo","Rubik","IBM Plex Sans Arabic",Arial,sans-serif;margin:0;padding:24px;color:#0E2A20}
  header{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #0E6B4D;padding-bottom:10px;margin-bottom:14px}
  h1{margin:0;font-size:22px} h2{margin:0 0 6px;font-size:19px}
  .meta{color:#587265;font-size:12.5px}
  section{margin-bottom:6px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:8px}
  th,td{border:1px solid #9CC4AF;padding:5px 7px;text-align:center}
  th{background:#D3EBDD;color:#0A5139}
  tr.abs td{color:#c93636;font-weight:700}
  tfoot td{font-weight:800;background:#EAF4EE}
  .sig{display:flex;justify-content:space-between;margin:10px 0 22px;font-size:13.5px}
  .pb{page-break-after:always}
  @page{size:A4;margin:12mm}</style></head><body>
  <header><div><h1>${esc(brandName())} — كشف دوام</h1><div class="meta">الفترة: ${fmtDate(dayStart(S.from))} إلى ${fmtDate(dayStart(S.to))}</div></div><div class="meta">طُبع في: ${fmtDate(new Date())}</div></header>
  ${[...byEmp.values()].map(g => {
      const rows = g.rows.slice().sort((a, b) => a.day.localeCompare(b.day));
      const net = rows.reduce((a, s) => a + (s.status === 'work' || s.status === 'open' ? s.met.net : 0), 0);
      const ote = rows.reduce((a, s) => a + (s.met.otEq || 0), 0);
      const late = rows.reduce((a, s) => a + (s.met.late || 0), 0);
      const early = rows.reduce((a, s) => a + (s.met.early || 0), 0);
      const emp = S.emps.find(e => e.id === g.empId);
      const scn = emp && emp.scheduleId ? (S.scheds.find(x => x.id === emp.scheduleId) || {}).name : '';
      return `<section class="emp"><h2>${esc(g.name)}</h2><div class="meta">الجدول: ${esc(scn || 'بدون جدول')} · متأخر: ${late} د · مبكر: ${early} د</div>
      <table><thead><tr><th>التاريخ</th><th>اليوم</th><th>الحالة</th><th>أول حضور</th><th>آخر انصراف</th><th>متأخر (د)</th><th>مبكر (د)</th><th>صافي العمل</th><th>إضافي (س.م)</th></tr></thead><tbody>
      ${rows.map(s => `<tr class="${s.status === 'absent' ? 'abs' : ''}"><td>${s.day.split('-').reverse().join('/')}</td><td>${DAYS_AR[new Date(s.day + 'T00:00:00Z').getUTCDay()]}</td><td>${esc(stText(s, ST_TXT))}</td><td>${s.met.firstIn ? fmtTime(s.met.firstIn) : '—'}</td><td>${s.met.lastOut ? fmtTime(s.met.lastOut) : '—'}</td><td>${s.met.late || '—'}</td><td>${s.met.early || '—'}</td><td>${fmtDur(s.met.net * 60000)}</td><td>${s.met.otEq ? s.met.otEq.toFixed(1) : '—'}</td></tr>`).join('')}
      </tbody><tfoot><tr><td colspan="7">إجماليات الفترة</td><td>${fmtDur(net * 60000)}</td><td>${ote.toFixed(1)}</td></tr></tfoot></table>
      <div class="sig"><span>توقيع الموظف: ....................</span><span>اعتماد الإدارة: ....................</span></div></section>`;
    }).join('<div class="pb"></div>')}</body></html>`;
    let pf = document.getElementById('__printFrame');
    if (pf) pf.remove();
    pf = document.createElement('iframe');
    pf.id = '__printFrame';
    pf.style.cssText = 'position:fixed;right:0;bottom:0;width:0;height:0;border:0;';
    document.body.appendChild(pf);
    const docPf = pf.contentWindow.document;
    docPf.open(); docPf.write(html); docPf.close();
    setTimeout(() => { try { pf.contentWindow.focus(); pf.contentWindow.print(); } catch {} }, 400);
  }

  function viewReqs(el) {
